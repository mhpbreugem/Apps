<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#ffffff"><title>Hours · Days</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#fff;--ink:#111;--mu:#7A7A7A;--ln:#EBEBEB;--ch:#F3F3F1;--top:max(env(safe-area-inset-top),38px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 14px/1.35 Inter,system-ui,sans-serif;font-feature-settings:'tnum' 1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
.k-hd{padding:var(--top) 18px 10px;display:flex;align-items:flex-end;gap:10px;flex:none}
.k-hd .t{flex:1;min-width:0}.k-hd h1{margin:0;font:800 26px/1.05 Inter;letter-spacing:-.03em}.k-hd small{display:block;color:var(--mu);font-size:12.5px;margin-top:3px}
.k-ib{width:36px;height:36px;border-radius:10px;background:var(--ch);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
main{flex:1;overflow:auto;padding:4px 18px 40px}
.k-nav{display:flex;border-top:1px solid var(--ln);flex:none;padding-bottom:env(safe-area-inset-bottom)}
.k-nav button{flex:1;height:54px;font:700 13px Inter;color:var(--mu);position:relative}.k-nav button.on{color:var(--ink)}.k-nav button.on:before{content:'';position:absolute;left:35%;right:35%;top:-1px;height:2px;background:var(--ink)}
.k-c{display:inline-block;width:var(--s,14px);height:var(--s,14px);border-radius:50%;box-shadow:inset 0 0 0 2px var(--c);background:conic-gradient(var(--c) 0 calc(var(--f)*100%),transparent 0);vertical-align:middle;flex:none}
.k-s{display:inline-block;width:var(--s,14px);height:var(--s,14px);border-radius:24%;background:var(--c);vertical-align:middle;flex:none}
.k-t{font-size:.8em}
.k-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--ln)}
.k-row b{flex:1;min-width:0;font-weight:700;font-size:15px}.k-row b small{display:block;font-weight:500;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.k-row b.dn{color:var(--mu);text-decoration:line-through}
.k-m{color:var(--mu);font-size:12.5px}
.k-gh{font:700 12px Inter;color:var(--mu);margin:18px 0 2px}
.k-b{display:block;width:100%;height:48px;border-radius:12px;background:var(--ink);color:var(--bg);font:700 15px Inter;margin-top:8px}.k-b.g{background:var(--ch);color:var(--ink)}.k-b.r{background:var(--ch);color:#D0342C}
.k-pill{height:34px;min-width:44px;padding:0 10px;border-radius:10px;background:var(--ch);font:800 14px Inter;flex:none}.k-pill.d{background:var(--ink);color:var(--bg)}
.k-in{width:100%;height:46px;border:0;border-radius:12px;background:var(--ch);padding:0 12px;font:500 15px Inter;outline:0}
label{display:block;font:700 12px Inter;color:var(--mu);margin:12px 0 5px}
.k-big{font:800 64px/1 Inter;letter-spacing:-.05em}
.k-bar{height:5px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,transparent);overflow:hidden;margin-top:6px}.k-bar i{display:block;height:100%;background:var(--c)}
#k-sh{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}#k-sh.on{display:flex}
#k-si{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
#k-si h2{margin:0 0 2px;font:800 20px Inter;letter-spacing:-.02em}
.k-pg{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}.k-pg button{display:flex;align-items:center;gap:9px;padding:10px 4px;font-weight:700;text-align:left}
#k-toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap}#k-toast.on{opacity:1}
.k-ver{text-align:center;color:#bbb;font-size:11px;margin-top:22px}
.k-day{display:grid;grid-template-columns:38px 1fr 30px;align-items:center;gap:8px;min-height:44px;padding:4px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.k-day .dl{font:800 15px/1 Inter;text-align:center}.k-day .dl small{display:block;font:600 10px Inter;color:var(--mu);margin-bottom:2px}
.k-day .it{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.k-day b{text-align:right;font-size:13px}
.k-day.to .dl{background:var(--ink);color:var(--bg);border-radius:9px;padding:4px 0}.k-day.to .dl small{color:inherit;opacity:.7}
.k-day.pa{opacity:.85}.k-day.we .dl{color:var(--mu)}
.k-c.pl{box-shadow:inset 0 0 0 2px var(--c);background:transparent;opacity:.9}
.k-12{display:grid;grid-template-columns:34px repeat(7,1fr) 30px;gap:3px;font-size:11px}
.k-cell{position:relative;aspect-ratio:1;border-radius:7px;background:var(--ch);display:flex;flex-wrap:wrap;align-content:flex-end;gap:1px;padding:3px}.k-cell.to{box-shadow:inset 0 0 0 1.5px var(--ink)}
.k-8{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;justify-items:center;margin:14px 0 6px}
.k-8 .k-e{width:36px;height:36px;border-radius:50%;border:2px dashed #ccc;color:#bbb;font:400 20px/32px Inter}
</style></head><body>
<div id="app"><header class="k-hd" id="hd"></header><main id="mn"></main></div>
<script>const KEY='hours-lv-04',LV=4;
const OLD='hours-v4',CATS=['Research','Teaching','Chair & Admin','Personal'];
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9),sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},td=()=>iso(new Date());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fdt=s=>{const d=pd(s);return d.getDate()+' '+MO[d.getMonth()]};
const qf=x=>{x=Math.round((+x||0)*4)/4;const neg=x<0;x=Math.abs(x);const w=Math.floor(x),f=x-w,q=f===.25?'¼':f===.5?'½':f===.75?'¾':'';return (neg?'−':'')+((w||!q?w:'')+q)};
function fromOld(o){const N={v:1,bud:Object.assign({Research:14,Teaching:12,'Chair & Admin':10,Personal:4},o.bud||{}),p:[],q:[],log:[],pl:[],bk:[]};
 (o.p||[]).filter(p=>!p.dt).forEach(p=>N.p.push({id:p.id,n:p.name,c:p.c||'#111',cat:CATS.includes(p.cat)?p.cat:'Personal',er:!!p.er,dl:p.aim||null,
  t:(p.st||[]).filter(s=>!s.q).flatMap(s=>(s.t||[]).filter(t=>!t.mx).map(t=>({id:t.id,n:t.n,s:s.n,h:+t.h||0,d:Math.min(+t.d||0,+t.h||0),dl:t.dl||null})))}));
 (o.qk||[]).filter(q=>q.d<q.h).forEach(q=>N.q.push({id:q.id,n:q.n,h:+q.h||.25,p:q.p,dl:q.dl||null}));
 const F=o.fn&&o.fn.ov||{};Object.keys(F).forEach(d=>(F[d]||[]).forEach(x=>{if(!x||x[1]===3||x[1]===2)return;if(x[3]&&x[3].length)x[3].forEach(q=>N.log.push({d,p:q,h:.25,old:1}));else if(+x[2]>0)N.log.push({d,p:x[0],h:+x[2],old:1});else if(d>=td())N.pl.push({id:uid(),d,p:x[0]})}));
 (o.bk||[]).forEach(b=>N.bk.push({id:uid(),d:b.d,p:b.p,h:+b.h||1,n:b.n||''}));return N}
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}try{const o=localStorage.getItem(OLD);if(o)return fromOld(JSON.parse(o))}catch(e){}return fromOld({})})();
['p','q','log','pl','bk'].forEach(k=>S[k]=S[k]||[]);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let UH=[];const snap=()=>{UH.push(JSON.stringify(S));if(UH.length>50)UH.shift()};
const P=id=>S.p.find(p=>p.id===id),live=()=>S.p,left=p=>sum(p.t,t=>Math.max(0,t.h-t.d)),doneP=p=>sum(p.t,t=>t.d),totP=p=>sum(p.t,t=>t.h),cur=p=>p.t.find(t=>t.d<t.h);
const pDL=p=>p.t.filter(t=>t.d<t.h&&t.dl).map(t=>t.dl).sort()[0]||(left(p)>0?p.dl:null);
function logH(pid,h,d,tid){const p=P(pid);if(!p)return;d=d||td();S.log.push({d,p:pid,h});let r=h;
 if(tid){const t=p.t.find(x=>x.id===tid);if(t){const k=h>0?Math.min(h,t.h-t.d):-Math.min(-h,t.d);t.d+=k;return}}
 if(h>0){for(const t of p.t){if(r<=0)break;const k=Math.min(r,t.h-t.d);t.d+=k;r-=k}}else{r=-h;for(let i=p.t.length-1;i>=0&&r>0;i--){const t=p.t[i],k=Math.min(r,t.d);t.d-=k;r-=k}}}
const doneOn=(d,f)=>sum(S.log.filter(l=>l.d===d&&(!f||f(l.p))),l=>l.h);
const wk0=()=>iso(mon(new Date()));
const doneWk=f=>sum(S.log.filter(l=>l.d>=wk0()&&l.d<=td()&&(!f||f(l.p))),l=>l.h);
const budget=()=>sum(CATS,c=>+S.bud[c]||0);
function suggest(){const T=pd(td());return live().filter(p=>cur(p)).map(p=>{const dl=pDL(p),b=+S.bud[p.cat]||0,days=dl?(pd(dl)-T)/864e5:999,need=b?(b-doneWk(id=>P(id)&&P(id).cat===p.cat))/b:0;return{p,t:cur(p),dl,days,sc:need*10+(days<28?28-days:0)+(days<0?20:0)}}).sort((a,b)=>b.sc-a.sc)}
const ring=(c,f,s,cls)=>'<i class="k-c'+(cls?' '+cls:'')+'" style="--c:'+c+';--f:'+Math.max(0,Math.min(1,f))+(s?';--s:'+s+'px':'')+'"></i>';
const sq=(c,s)=>'<i class="k-s" style="--c:'+c+(s?';--s:'+s+'px':'')+'"></i>';
const tri=(c)=>'<span class="k-t" style="color:'+(c||'inherit')+'">▲</span>';
let TT;function toast(t){let x=$('k-toast');if(!x){x=document.createElement('div');x.id='k-toast';document.body.appendChild(x)}x.textContent=t;x.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>x.classList.remove('on'),1600)}
function sheet(h){let b=$('k-sh');if(!b){b=document.createElement('div');b.id='k-sh';b.innerHTML='<div id="k-si"></div>';document.body.appendChild(b);b.addEventListener('click',e=>{if(e.target===b)closeS()})}$('k-si').innerHTML=h;b.classList.add('on')}
function closeS(){const b=$('k-sh');if(b)b.classList.remove('on')}
let PICK=null;function pickP(title,cb,f){PICK=cb;sheet('<h2>'+esc(title)+'</h2>'+CATS.map(c=>{const ps=S.p.filter(p=>p.cat===c&&(!f||f(p)));return ps.length?'<div class="k-gh">'+esc(c)+'</div><div class="k-pg">'+ps.map(p=>'<button data-k="pick" data-p="'+p.id+'">'+ring(p.c,1,10)+esc(p.n)+'</button>').join('')+'</div>':''}).join(''))}
function undo(){if(!UH.length)return toast('Nothing to undo');S=JSON.parse(UH.pop());draw();toast('Undone')}
const K={pick(e){closeS();const f=PICK;PICK=null;f&&f(e.dataset.p)},undo};
function on(obj){Object.assign(K,obj)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b&&K[b.dataset.k]){K[b.dataset.k](b,e)}});
/* shared editors (used by fuller levels) */
function projSheet(pid){const p=P(pid);let h='<h2 style="color:'+p.c+'">'+esc(p.n)+'</h2><div class="k-m">'+qf(doneP(p))+' of '+qf(totP(p))+' h'+(p.dl?' · '+tri()+' '+fdt(p.dl):'')+'</div>';let ls='';
 p.t.forEach(t=>{if(t.s!==ls){ls=t.s;h+='<div class="k-gh">'+esc(t.s)+'</div>'}h+='<button class="k-row" data-k="tsh" data-p="'+p.id+'" data-t="'+t.id+'"><b'+(t.d>=t.h?' class="dn"':'')+'>'+esc(t.n)+(t.dl?' '+tri(p.c)+' <small style="display:inline">'+fdt(t.dl)+'</small>':'')+'</b><span class="k-m">'+qf(t.d)+'/'+qf(t.h)+'</span></button>'});
 h+='<button class="k-b g" data-k="tnew" data-p="'+p.id+'">+ Task</button><button class="k-b g" data-k="pedit" data-p="'+p.id+'">Rename, colour, ▲ deadline</button>';sheet(h)}
function taskSheet(pid,tid){const p=P(pid),t=tid&&p.t.find(x=>x.id===tid);sheet('<h2>'+(t?'Task':'New task')+'</h2><div class="k-m">'+esc(p.n)+(t?' · '+qf(t.d)+' of '+qf(t.h)+' h':'')+'</div><label>Name</label><input class="k-in" id="k-tn" value="'+esc(t?t.n:'')+'"><label>Stage</label><input class="k-in" id="k-ts" value="'+esc(t?t.s:(p.t.length?p.t[p.t.length-1].s:'Stage 1'))+'"><label>Hours</label><input class="k-in" id="k-th" inputmode="decimal" value="'+(t?t.h:4)+'"><label>▲ Deadline</label><input class="k-in" type="date" id="k-td" value="'+(t&&t.dl||'')+'"><button class="k-b" data-k="tsave" data-p="'+pid+'" data-t="'+(tid||'')+'">Save</button>'+(t?'<button class="k-b g" data-k="tlog" data-p="'+pid+'" data-t="'+tid+'">Log 1 hour</button><button class="k-b r" data-k="tdel" data-p="'+pid+'" data-t="'+tid+'">Delete</button>':''))}
function pEdit(pid){const p=pid?P(pid):null;sheet('<h2>'+(p?'Project':'New project')+'</h2><label>Name</label><input class="k-in" id="k-pn" value="'+esc(p?p.n:'')+'"><label>Category</label><select class="k-in" id="k-pc">'+CATS.map(c=>'<option'+(c===(p?p.cat:'Research')?' selected':'')+'>'+c+'</option>').join('')+'</select><label>Colour</label><input class="k-in" type="color" id="k-pk" value="'+(p?p.c:'#2E7D4F')+'"><label>▲ Deadline</label><input class="k-in" type="date" id="k-pd" value="'+(p&&p.dl||'')+'"><button class="k-b" data-k="psave" data-p="'+(pid||'')+'">Save</button>'+(p?'<button class="k-b r" data-k="pdel" data-p="'+pid+'">Delete project</button>':''))}
let CF=null;const conf=k=>{if(CF===k){CF=null;return true}CF=k;toast('Tap again to confirm');setTimeout(()=>{if(CF===k)CF=null},2500);return false};
on({tsh(e){taskSheet(e.dataset.p,e.dataset.t)},tnew(e){taskSheet(e.dataset.p)},pedit(e){pEdit(e.dataset.p)},
 tsave(e){const p=P(e.dataset.p),n=$('k-tn').value.trim();if(!n)return toast('Name it first');snap();let t=e.dataset.t&&p.t.find(x=>x.id===e.dataset.t);if(!t){t={id:uid(),d:0};p.t.push(t)}t.n=n;t.s=$('k-ts').value.trim()||'Stage 1';t.h=Math.max(.25,Math.round((parseFloat($('k-th').value.replace(',','.'))||1)*4)/4);t.d=Math.min(t.d,t.h);t.dl=$('k-td').value||null;closeS();draw()},
 tlog(e){snap();logH(e.dataset.p,1,null,e.dataset.t);closeS();draw();toast('+1 h')},
 tdel(e){if(!conf('td'))return;snap();const p=P(e.dataset.p);p.t=p.t.filter(x=>x.id!==e.dataset.t);closeS();draw()},
 psave(e){const n=$('k-pn').value.trim();if(!n)return toast('Name it first');snap();let p=e.dataset.p&&P(e.dataset.p);if(!p){p={id:uid(),t:[],er:false};S.p.push(p)}p.n=n;p.cat=$('k-pc').value;p.c=$('k-pk').value;p.dl=$('k-pd').value||null;closeS();draw()},
 pdel(e){if(!conf('pd'))return;snap();S.p=S.p.filter(p=>p.id!==e.dataset.p);closeS();draw()}});

/* shared screens for the fuller levels */
const U={tab:null,pj:null,sel:null,off:0,z:0,per:'30',qd:0};
const selP=()=>P(U.sel)?U.sel:((suggest()[0]||{}).p||S.p[0]).id;
function hd(t,s,r,back){$('hd').innerHTML=(back?'<button class="k-ib" data-k="back" aria-label="Back">‹</button>':'')+'<div class="t"><h1>'+esc(t)+'</h1><small>'+s+'</small></div>'+(r||'')+'<button class="k-ib" data-k="undo" aria-label="Undo">↶</button>'}
function nav(T){$('nv').innerHTML=T.map(([k,l])=>'<button class="'+(U.tab===k?'on':'')+'" data-k="tab" data-t="'+k+'">'+l+'</button>').join('')}
on({tab(e){U.tab=e.dataset.t;U.pj=null;$('mn').scrollTop=0;draw()},back(){U.pj=null;draw()}});
/* Days */
function dayItems(d){const o=[];const g={};S.log.filter(l=>l.d===d).forEach(l=>g[l.p]=(g[l.p]||0)+l.h);
 Object.keys(g).forEach(pid=>{const p=P(pid);if(!p)return;let h=Math.round(g[pid]*4)/4;while(h>0){o.push({k:'d',p,f:Math.min(1,h)});h-=1}});
 S.pl.filter(x=>x.d===d).forEach(x=>{const p=P(x.p);if(p)o.push({k:'p',p,id:x.id})});
 S.bk.filter(x=>x.d===d).forEach(x=>{const p=P(x.p);if(p)o.push({k:'s',p,id:x.id,h:x.h})});return o}
function dls(){const o={};S.p.forEach(p=>{p.t.forEach(t=>{if(t.dl&&t.d<t.h)(o[t.dl]=o[t.dl]||[]).push(p)});if(p.dl&&left(p)>0)(o[p.dl]=o[p.dl]||[]).push(p)});return o}
function rDays(opt){opt=opt||{};if(!S.p.length){hd('Days','No projects yet','');$('mn').innerHTML='<div class="k-m" style="padding:20px 0">Add a project first.</div>';return}const sp=P(selP());if(U.z&&opt.zoom)return rDays12(opt);
 const m0=addD(mon(new Date()),7*U.off),T=td(),D=dls();
 hd('Days',fdt(iso(m0))+' – '+fdt(iso(addD(m0,13))),'<button class="k-pill" data-k="dsel" style="display:flex;align-items:center;gap:6px">'+ring(sp.c,1,10)+esc(sp.n.slice(0,8))+'</button>'+(opt.sessions?'<button class="k-pill'+(U.ms?' d':'')+'" data-k="ms" aria-label="Add sessions">■</button>':'')+(opt.zoom?'<button class="k-pill" data-k="zm">12w</button>':''));
 let h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><button class="k-pill" data-k="wk" data-d="-1">‹</button><span class="k-m">'+(U.off?'<button data-k="wk" data-d="0" style="text-decoration:underline">back to this week</button>':(U.ms?'Tap a day to add a session of ':'Tap a day to add an hour of ')+esc(sp.n))+'</span><button class="k-pill" data-k="wk" data-d="1">›</button></div>';
 for(let i=0;i<14;i++){const dd=addD(m0,i),d=iso(dd),it=dayItems(d),tot=sum(it.filter(x=>x.k==='d'),x=>x.f);if(i===7)h+='<div style="height:10px"></div>';
  h+='<div class="k-day'+(d===T?' to':'')+(d<T?' pa':'')+(i%7>4?' we':'')+'" data-k="dadd" data-d="'+d+'"><span class="dl"><small>'+WD[i%7]+'</small>'+dd.getDate()+'</span><span class="it">'+it.map((x,j)=>'<button data-k="dtap" data-d="'+d+'" data-i="'+j+'">'+(x.k==='s'?sq(x.p.c,22):ring(x.p.c,x.k==='d'?x.f:0,22,x.k==='p'?'pl':''))+'</button>').join('')+(D[d]?D[d].map(p=>tri(p.c)).join(''):'')+'</span><b>'+(tot?qf(tot):'')+'</b></div>'}
 const wd=sum([...Array(7)].map((_,i)=>iso(addD(m0,i))),d=>doneOn(d));
 h+='<div class="k-m" style="margin-top:12px">'+ring('#111',1,10)+' done · '+ring('#111',0,10)+' planned'+(opt.sessions?' · '+sq('#111',10)+' session':'')+' · '+tri()+' deadline · this week '+qf(wd)+' / '+budget()+' h</div>';
 $('mn').innerHTML=h}
function rDays12(opt){const m0=addD(mon(new Date()),7*U.off),T=td(),D=dls();hd('Days','12 weeks from '+fdt(iso(m0)),'<button class="k-pill d" data-k="zm">2w</button>');
