<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booked page: 10 sleek concepts, week and month</title>
<style>
:root{--bg:#0B0B0E;--ink:#F2F2F5;--mu:#8B8D96;--ln:#23242B;--ch:#17181D;--cap:#FF5A44}
*{box-sizing:border-box}html{scroll-snap-type:y mandatory}body{margin:0;background:#000;color:var(--ink);font:13px/1.3 Inter,system-ui,sans-serif;max-width:440px;margin:auto}
header{background:#000;padding:8px 14px;height:44px;position:sticky;top:0;z-index:9;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--ln)}header b{font-size:15px}header small{color:var(--mu);font-size:10.5px}
section{height:calc(100vh - 44px);height:calc(100dvh - 44px);scroll-snap-align:start;background:var(--bg);display:flex;flex-direction:column;padding:12px 12px 10px;border-bottom:1px solid var(--ln);overflow:hidden}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.top b{font-size:15px;font-weight:600;letter-spacing:-.01em}.top .sp{flex:1}
.seg{display:flex;background:var(--ch);border-radius:9px;padding:2px}.seg button{border:0;background:none;color:var(--mu);font:600 11.5px Inter,system-ui;padding:5px 11px;border-radius:7px}.seg button.on{background:var(--ink);color:#000}
.sum{color:var(--mu);font-size:11.5px;margin-bottom:6px}.sum b{color:var(--ink);font-weight:600}
.v{flex:1;min-height:0;position:relative}svg{display:block;width:100%;height:100%}
text{font-family:Inter,system-ui,sans-serif;fill:var(--mu);font-size:10px}.t1{fill:var(--ink)}
.lgd{display:flex;flex-wrap:wrap;gap:3px 11px;margin-top:6px;font:500 10.5px Inter,system-ui;color:var(--mu)}.lgd i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:4px}.lgd i.u{background:none;box-shadow:inset 0 0 0 1.5px #aaa}
.row{display:flex;align-items:center;gap:8px}
</style></head><body>
<header><b>Booked: 10 sleek concepts</b><small>Each has Week and Month · 20 h per week · swipe up for the next</small></header>
<div id="app"></div>
<script>
const CAP=20,MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const P={FMA:{c:'#E39A4B',t:'FMA class'},BT:{c:'#B8651B',t:'BT lectures'},FRA:{c:'#C8402A',t:'Frankfurt'},REC:{c:'#7B4FA3',t:'Recruitment'},COM:{c:'#9A74BD',t:'Committee'},DEF:{c:'#2F7D5B',t:'Defences'}};
const D=s=>{const a=s.split('-');return new Date(Date.UTC(+a[0],a[1]-1,+a[2]))},iso=d=>d.toISOString().slice(0,10),add=(d,n)=>new Date(d.getTime()+n*864e5),mon=d=>add(d,-((d.getUTCDay()+6)%7)),fd=s=>{const d=D(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const B=[];const bk=(d,h,p,un)=>B.push({d,h,p,un:!!un});
bk('2026-11-20',6,'FMA');bk('2026-11-27',4,'FMA');bk('2026-12-04',4,'FMA');bk('2026-12-11',4,'FMA');
['2026-11-25','2026-12-02','2026-12-09','2026-12-16','2027-01-13','2027-01-20'].forEach(d=>bk(d,2,'REC'));['2026-12-03','2027-01-14','2027-02-04'].forEach(d=>bk(d,2,'COM'));
bk('2026-12-15',3,'DEF');bk('2026-12-17',3,'DEF');bk('2027-01-12',6,'BT');bk('2027-01-13',6,'BT');
for(let i=0;i<5;i++)bk(iso(add(D('2027-01-25'),i)),6,'FRA');
for(let i=0;i<10;i++){const d=add(D('2027-01-30'),i);if(d.getUTCDay())bk(iso(d),i<9?6:6,'FRA',1)}
B.sort((a,b)=>a.d<b.d?-1:1);
const T0=D('2026-11-20'),W0=mon(T0),NW=13,weeks=[...Array(NW)].map((_,i)=>add(W0,7*i));
const wkOf=d=>Math.floor((D(d)-W0)/6048e5);
const wt=weeks.map(()=>({tot:0,by:{},un:0}));B.forEach(b=>{const i=wkOf(b.d);if(i<0||i>=NW)return;wt[i].tot+=b.h;wt[i].by[b.p]=(wt[i].by[b.p]||0)+b.h;if(b.un)wt[i].un+=b.h});



const ALL=Object.keys(P),NOW=0,CAPW=CAP;
const COL=Object.fromEntries(ALL.map(p=>[p,P[p].c]));
const MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dim=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
function periods(mode){const o=[];if(mode==='w'){weeks.forEach((w,i)=>{const a=iso(w),b=iso(add(w,7));o.push({lab:fd(a),a,b,cap:CAP,days:[0,1,2,3,4,5].map(j=>iso(add(w,j))),now:i===NOW})})}else{for(let m=0;m<4;m++){const d=new Date(Date.UTC(2026,10+m,1)),a=iso(d),b=iso(new Date(Date.UTC(2026,11+m,1)));o.push({lab:MS[d.getUTCMonth()],a,b,cap:Math.round(dim(d.getUTCFullYear(),d.getUTCMonth())/7*CAP),days:[...Array(dim(d.getUTCFullYear(),d.getUTCMonth()))].map((_,j)=>iso(add(d,j))),now:m===0})}}
o.forEach(p=>{p.it=B.filter(b=>b.d>=p.a&&b.d<p.b);p.tot=p.it.reduce((a,b)=>a+b.h,0);p.un=p.it.filter(b=>b.un).reduce((a,b)=>a+b.h,0);p.by={};ALL.forEach(k=>{const n=p.it.filter(b=>b.p===k&&!b.un).reduce((a,b)=>a+b.h,0),u=p.it.filter(b=>b.p===k&&b.un).reduce((a,b)=>a+b.h,0);if(n||u)p.by[k]={n,u}})});return o}
const lgd=()=>'<div class="lgd">'+ALL.map(p=>`<span><i style="--c:${COL[p]}"></i>${P[p].t}</span>`).join('')+'<span><i class="u"></i>not allocated</span></div>';
const sumTxt=ps=>{const t=ps.reduce((a,p)=>a+p.tot,0),c=ps.reduce((a,p)=>a+p.cap,0),u=ps.reduce((a,p)=>a+p.un,0);return`<b>${t}</b> of ${c} h used · <b>${Math.round(t/c*100)}%</b>${u?` · ${u} h not allocated`:''}`};
const DEFS='<defs><pattern id="h" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="4" fill="#fff" opacity=".35"/></pattern></defs>';
const fmt=n=>n%1?n.toFixed(1):n;
// ---- designs: (ps,w,h) => html
const DS=[];
// 1 rings
DS.push(['Rings','Each period is a ring. A full lap is 20 h.',(ps,w,h)=>{const cx=w/2,cy=h/2,R=Math.min(w,h)/2-6,n=ps.length,gap=2,rw=Math.min(14,(R-34)/n-gap);let g='';ps.forEach((p,k)=>{const r=R-k*(rw+gap)-rw/2,C=2*Math.PI*r;g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1d1e24" stroke-width="${rw}"/>`;let off=0;const tot=p.cap;ALL.forEach(q=>{const b=p.by[q];if(!b)return;[[b.n,0],[b.u,1]].forEach(([v,u])=>{if(!v)return;const len=Math.min(v,tot-off)/tot*C;if(len<=0){return}g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${COL[q]}" stroke-width="${rw}" stroke-dasharray="${u?`2 2`:`${len} ${C}`}" ${u?`stroke-opacity=".65" stroke-dasharray="${len} ${C-len}"`:''} stroke-dashoffset="${-off/tot*C}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=Math.min(v,tot-off)})});g+=`<text x="${cx-4}" y="${cy-r+rw*.35}" text-anchor="end" font-size="${Math.min(10,rw)}" ${p.tot>p.cap?'style="fill:var(--cap)"':''}>${p.lab}${p.tot>p.cap?' +'+(p.tot-p.cap):''}</text>`});const t=ps.reduce((a,p)=>a+p.tot,0),c=ps.reduce((a,p)=>a+p.cap,0);return`<svg viewBox="0 0 ${w} ${h}">${g}<text class="t1" x="${cx}" y="${cy+6}" text-anchor="middle" style="font-size:26px;font-weight:300">${Math.round(t/c*100)}%</text></svg>`}]);
// 2 stream
DS.push(['Stream','Hours by project flowing through time, with the 20 h line.',(ps,w,h)=>{const L=14,Rr=14,T=14,Bm=26,iw=w-L-Rr,ih=h-T-Bm,n=ps.length,mx=Math.max(...ps.map(p=>p.tot/p.cap*CAP),CAP)*1.1,x=i=>L+(n===1?iw/2:i*iw/(n-1)),y=v=>T+ih-v/mx*ih;const series=[...ALL,'un'],val=(p,q,i)=>(q==='un'?p.un:(p.by[q]?p.by[q].n:0))/p.cap*CAP;const cum=ps.map(()=>0);let g='';const path=(top,bot)=>{const pt=a=>a.map((v,i)=>[x(i),y(v)]);const sm=P_=>{let d=`M${P_[0][0]},${P_[0][1]}`;for(let i=1;i<P_.length;i++){const a=P_[i-1],b=P_[i],mx_=(a[0]+b[0])/2;d+=` C${mx_},${a[1]} ${mx_},${b[1]} ${b[0]},${b[1]}`}return d};const tp=pt(top),bp=pt(bot).reverse();let d=sm(tp);const sb=sm(bp);return d+' L'+bp[0][0]+','+bp[0][1]+' '+sb.slice(sb.indexOf('C'))+' Z'};series.forEach(q=>{const bot=cum.slice(),top=ps.map((p,i)=>cum[i]+val(p,q,i));top.forEach((v,i)=>cum[i]=v);if(top.every((v,i)=>v===bot[i]))return;g+=`<path d="${path(top,bot)}" fill="${q==='un'?'url(#h)':COL[q]}" opacity="${q==='un'?1:.9}"/>`});g+=`<line x1="${L}" x2="${w-Rr}" y1="${y(CAP)}" y2="${y(CAP)}" stroke="#fff" stroke-dasharray="3 4" opacity=".5"/><text x="${w-Rr}" y="${y(CAP)-4}" text-anchor="end">20 h per week</text>`;ps.forEach((p,i)=>{if(n<=6||i%2===0)g+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle">${p.lab}</text>`});return`<svg viewBox="0 0 ${w} ${h}">${DEFS}${g}</svg>`}]);
// 3 contribution grid
DS.push(['Hour map','Every day is a cell, darker means more hours. Weeks run across.',(ps,w,h)=>{const wk=weeks;const cols=NW,gap=3,lw=26,cw=(w-lw-(cols-1)*gap)/cols,ch=Math.min(cw*1.5,(h-30-(mode0==='m'?20:0))/6-gap);let g='';const days=['M','T','W','T','F','S'];days.forEach((d,j)=>g+=`<text x="0" y="${26+j*(ch+gap)+ch*.65}">${d}</text>`);const mos={};wk.forEach((wd,i)=>{const m=wd.getUTCMonth();if(!mos[m])mos[m]=[i,i];mos[m][1]=i;});const per=mode0==='m';Object.keys(mos).forEach(m=>{const[a,b]=mos[m],x0=lw+a*(cw+gap),x1=lw+b*(cw+gap)+cw;g+=`<text class="t1" x="${x0}" y="12" style="font-weight:600">${MS[m]}</text>`;if(per){const t=B.filter(b2=>D(b2.d).getUTCMonth()==m).reduce((a2,b2)=>a2+b2.h,0);g+=`<text x="${x1}" y="12" text-anchor="end">${t} h</text>`}});wk.forEach((wd,i)=>{for(let j=0;j<6;j++){const d=iso(add(wd,j)),it=B.filter(b=>b.d===d),t=it.reduce((a,b)=>a+b.h,0),un=it.some(b=>b.un),a=Math.min(1,t/8),x=lw+i*(cw+gap),y=24+j*(ch+gap);g+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="4" fill="${t?(un?'none':`rgba(255,120,90,${.2+a*.8})`):'#17181D'}" ${un?`stroke="rgba(255,120,90,.8)" stroke-width="1.3"`:''}/>`}if(i===NOW)g+=`<rect x="${lw+i*(cw+gap)-1.5}" y="22" width="${cw+3}" height="${6*(ch+gap)}" rx="5" fill="none" stroke="#FFE27A" stroke-width="1.2"/>`;});const yb=24+6*(ch+gap)+14;wk.forEach((wd,i)=>{const t=ps.length===NW?ps[i].tot:B.filter(b=>wkOf(b.d)===i).reduce((a,b)=>a+b.h,0);g+=`<text x="${lw+i*(cw+gap)+cw/2}" y="${yb}" text-anchor="middle" style="${t>CAP?'fill:var(--cap)':''}">${t}</text>`});return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}]);
// 4 swimlanes
DS.push(['Lanes','One lane per project. Blocks show when and how heavy.',(ps,w,h)=>{const lanes=ALL.filter(p=>B.some(b=>b.p===p)),L=70,start=D(ps[0].a),end=D(ps[ps.length-1].b),span=(end-start)/864e5,pw=(w-L-6)/span,lh=Math.min(44,(h-30)/lanes.length);let g='';ps.forEach((p,i)=>{const x=L+(D(p.a)-start)/864e5*pw;g+=`<line x1="${x}" x2="${x}" y1="18" y2="${h-4}" stroke="#23242B"/>${(ps.length<=6||i%3===0)?`<text x="${x+3}" y="12">${p.lab}</text>`:''}`});lanes.forEach((q,k)=>{const y=24+k*lh;g+=`<text class="t1" x="0" y="${y+lh/2+3}">${P[q].t}</text>`;B.filter(b=>b.p===q).forEach(b=>{const x=L+(D(b.d)-start)/864e5*pw,bh=Math.min(lh-6,4+b.h*3.2);g+=`<rect x="${x}" y="${y+(lh-bh)/2}" width="${Math.max(2.5,pw*.9)}" height="${bh}" rx="2" fill="${b.un?'none':COL[q]}" ${b.un?`stroke="${COL[q]}" stroke-width="1.2"`:''}/>`})});return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}]);
// 5 dials small multiples
DS.push(['Dials','A small dial per period, one spoke per day.',(ps,w,h)=>{const n=ps.length,cols=n>6?3:2,rows=Math.ceil(n/cols),cw=w/cols,chh=(h)/rows,r=Math.min(cw,chh)/2-6;let g='';ps.forEach((p,k)=>{const cx=(k%cols)*cw+cw/2,cy=Math.floor(k/cols)*chh+chh/2,nd=p.days.length;g+=`<circle cx="${cx}" cy="${cy}" r="${r*.42}" fill="none" stroke="#23242B"/>`;p.days.forEach((d,j)=>{const it=B.filter(b=>b.d===d),t=it.reduce((a,b)=>a+b.h,0);if(!t)return;const a=j/nd*2*Math.PI-Math.PI/2,r0=r*.45,r1=r0+Math.min(1,t/8)*(r-r0),pr=it[0].p,un=it[0].un;g+=`<line x1="${cx+Math.cos(a)*r0}" y1="${cy+Math.sin(a)*r0}" x2="${cx+Math.cos(a)*r1}" y2="${cy+Math.sin(a)*r1}" stroke="${COL[pr]}" stroke-width="${Math.min(5,Math.max(2,2*Math.PI*r/nd*.55))}" stroke-linecap="round" ${un?'stroke-opacity=".5" stroke-dasharray="1 4"':''}/>`});g+=`<text class="t1" x="${cx}" y="${cy-1}" text-anchor="middle" style="font-size:${r>40?16:12}px;font-weight:600;${p.tot>p.cap?'fill:var(--cap)':''}">${p.tot}</text><text x="${cx}" y="${cy+11}" text-anchor="middle">${p.lab}</text>`});return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}]);
// 6 typographic
DS.push(['Numerals','Big numbers. A hairline shows how much of the capacity is used.',(ps,w,h)=>{const n=ps.length,rh=h/n;let g='';ps.forEach((p,k)=>{const y=k*rh,pc=p.tot/p.cap,fs=Math.min(rh*.78,56);g+=`<text class="t1" x="0" y="${y+rh*.76}" style="font-size:${fs}px;font-weight:200;letter-spacing:-.04em;${p.tot>p.cap?'fill:var(--cap)':''}">${String(p.tot).padStart(2,'0')}</text><text x="${fs*1.3}" y="${y+rh*.42}" style="font-size:11px">${p.lab}${p.now?'  now':''}</text><text x="${fs*1.3}" y="${y+rh*.42+13}" style="font-size:10px">${Math.round(pc*100)}% of ${p.cap}${p.un?' · '+p.un+' open':''}</text>`;const x0=w*.52,x1=w-2;g+=`<line x1="${x0}" x2="${x1}" y1="${y+rh*.6}" y2="${y+rh*.6}" stroke="#23242B" stroke-width="3" stroke-linecap="round"/><line x1="${x0}" x2="${x0+Math.min(1,pc)*(x1-x0)}" y1="${y+rh*.6}" y2="${y+rh*.6}" stroke="${p.tot>p.cap?'#FF5A44':'#F2F2F5'}" stroke-width="3" stroke-linecap="round"/>`;if(p.tot>p.cap)g+=`<text x="${x1}" y="${y+rh*.6-7}" text-anchor="end" style="fill:var(--cap)">+${p.tot-p.cap}</text>`;g+=`<line x1="0" x2="${w}" y1="${y+rh}" y2="${y+rh}" stroke="#17181D"/>`});return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}]);
// 7 battery
DS.push(['Cells','Twenty glowing cells per week. Lit means booked.',(ps,w,h)=>{const n=ps.length,rh=h/n,lw=36,cw=(w-lw-44)/CAP;let g='';ps.forEach((p,k)=>{const y=k*rh+rh/2,units=p.cap,seg=Math.min(units,CAP*(mode0==='m'?1:1)),sc=mode0==='m'?p.cap/CAP:1,hh=[];ALL.forEach(q=>{const b=p.by[q];if(!b)return;for(let i=0;i<b.n;i++)hh.push([q,0]);for(let i=0;i<b.u;i++)hh.push([q,1])});const tot=hh.length,cell=(w-lw-52)/CAP,hgt=Math.min(rh*.62,18);g+=`<text x="0" y="${y+3}" ${p.now?'class="t1"':''}>${p.lab}</text>`;const scale=p.cap/CAP,cnt=CAP;for(let i=0;i<cnt;i++){const lo=i*scale,idx=Math.floor(lo),it=hh[Math.min(idx,hh.length-1)];const lit=idx<hh.length&&i*scale<tot;const x=lw+i*cell;g+=lit?`<rect x="${x}" y="${y-hgt/2}" width="${cell-2}" height="${hgt}" rx="3" fill="${it[1]?'none':COL[it[0]]}" ${it[1]?`stroke="${COL[it[0]]}" stroke-width="1.2"`:`style="filter:drop-shadow(0 0 3px ${COL[it[0]]}88)"`}/>`:`<rect x="${x}" y="${y-hgt/2}" width="${cell-2}" height="${hgt}" rx="3" fill="#17181D"/>`}g+=`<text x="${w}" y="${y+4}" text-anchor="end" class="t1" style="font-weight:600;${p.tot>p.cap?'fill:var(--cap)':''}">${p.tot>p.cap?'+'+(p.tot-p.cap):Math.round(p.tot/p.cap*100)+'%'}</text>`});return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}]);
// 8 bubbles
DS.push(['Bubbles','Bubble size is hours. Hollow bubbles are not allocated.',(ps,w,h)=>{const n=ps.length,cols=n>6?2:1,rows=Math.ceil(n/cols),cw=w/cols,rh=h/rows,lw=34;let g='';ps.forEach((p,k)=>{const x0=(k%cols)*cw,y=Math.floor(k/cols)*rh+rh/2;g+=`<text x="${x0}" y="${y+3}" ${p.now?'class="t1"':''}>${p.lab}</text>`;const items=[];Object.keys(p.by).forEach(q=>{if(p.by[q].n)items.push([q,p.by[q].n,0]);if(p.by[q].u)items.push([q,p.by[q].u,1])});const unit=Math.min(rh*.42,(cw-lw-8)/(Math.max(p.tot,10)*.28+items.length*2))*1,sc=(v)=>Math.max(4,Math.sqrt(v)*Math.min(rh*.1,6)*(mode0==='m'?.5:1));let x=x0+lw;items.forEach(([q,v,u])=>{const r=sc(v);x+=r;g+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${u?'none':COL[q]}" ${u?`stroke="${COL[q]}" stroke-width="1.4"`:'fill-opacity=".92"'}/>`;if(r>9)g+=`<text x="${x}" y="${y+3}" text-anchor="middle" style="fill:#000;font-weight:700;font-size:9.5px;${u?'fill:'+COL[q]:''}">${v}</text>`;x+=r+3})});return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}]);
// 9 donuts
DS.push(['Donuts','A donut per period split by project. The outer arc is capacity used.',(ps,w,h)=>{const n=ps.length,cols=n>6?3:2,rows=Math.ceil(n/cols),cw=w/cols,rh=h/rows,r=Math.min(cw,rh)/2-8;let g='';ps.forEach((p,k)=>{const cx=(k%cols)*cw+cw/2,cy=Math.floor(k/cols)*rh+rh/2,r2=r*.72,C=2*Math.PI*r2,sw=r*.3;g+=`<circle cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="#17181D" stroke-width="${sw}"/>`;let off=0;const T=Math.max(p.tot,1);ALL.forEach(q=>{const b=p.by[q];if(!b)return;[[b.n,0],[b.u,1]].forEach(([v,u])=>{if(!v)return;const len=v/T*C;g+=`<circle cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="${COL[q]}" stroke-width="${sw}" stroke-dasharray="${len-1.5} ${C-len+1.5}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" ${u?'stroke-opacity=".45"':''}/>`;off+=len})});const ro=r,Co=2*Math.PI*ro;g+=`<circle cx="${cx}" cy="${cy}" r="${ro}" fill="none" stroke="#23242B" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${ro}" fill="none" stroke="${p.tot>p.cap?'#FF5A44':'#F2F2F5'}" stroke-width="2" stroke-linecap="round" stroke-dasharray="${Math.min(1,p.tot/p.cap)*Co} ${Co}" transform="rotate(-90 ${cx} ${cy})"/><text class="t1" x="${cx}" y="${cy+2}" text-anchor="middle" style="font-size:${r>45?20:14}px;font-weight:600">${p.tot}</text><text x="${cx}" y="${cy+(r>45?16:12)}" text-anchor="middle">${p.lab}</text>`});return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}]);
// 10 lollipop
DS.push(['Lollipops','A thin line per period, a dot at the end, a tick at 20 h.',(ps,w,h)=>{const n=ps.length,rh=h/n,L=42,Rr=40,mx=Math.max(...ps.map(p=>p.tot/p.cap*CAP),CAP)*1.05,x=v=>L+v/mx*(w-L-Rr);let g='';ps.forEach((p,k)=>{const y=k*rh+rh/2,sc=CAP/p.cap;g+=`<text x="0" y="${y+3}" ${p.now?'class="t1"':''}>${p.lab}</text><line x1="${L}" x2="${x(CAP)}" y1="${y}" y2="${y}" stroke="#23242B" stroke-width="1"/>`;let off=0;ALL.forEach(q=>{const b=p.by[q];if(!b)return;[[b.n,0],[b.u,1]].forEach(([v,u])=>{if(!v)return;const a=x(off*sc),bx=x((off+v)*sc);g+=`<line x1="${a}" x2="${bx}" y1="${y}" y2="${y}" stroke="${COL[q]}" stroke-width="${Math.min(8,rh*.38)}" stroke-linecap="butt" ${u?'stroke-opacity=".45"':''}/>`;off+=v})});const ex=x(p.tot*sc);if(p.tot)g+=`<circle cx="${ex}" cy="${y}" r="${Math.min(6,rh*.3)}" fill="${p.tot>p.cap?'#FF5A44':'#F2F2F5'}"/>`;g+=`<line x1="${x(CAP)}" x2="${x(CAP)}" y1="${y-rh*.3}" y2="${y+rh*.3}" stroke="#fff" opacity=".4"/><text x="${w}" y="${y+3}" text-anchor="end" class="t1" style="font-weight:600;${p.tot>p.cap?'fill:var(--cap)':''}">${p.tot}</text>`});return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}]);
let mode0='w';
const state=DS.map(()=>'w');
function draw(){const app=document.getElementById('app');app.innerHTML=DS.map((d,i)=>`<section data-i="${i}"><div class="top"><b>${i+1} · ${d[0]}</b><span class="sp"></span><div class="seg"><button data-i="${i}" data-m="w" class="${state[i]==='w'?'on':''}">Week</button><button data-i="${i}" data-m="m" class="${state[i]==='m'?'on':''}">Month</button></div></div><div class="sum" id="s${i}"></div><div class="v" id="v${i}"></div>${lgd()}</section>`).join('');DS.forEach((d,i)=>fill(i))}
function fill(i){const m=state[i];mode0=m;const ps=periods(m),v=document.getElementById('v'+i),w=Math.round(v.clientWidth),h=Math.round(v.clientHeight);document.getElementById('s'+i).innerHTML=sumTxt(ps)+' · '+DS[i][1];v.innerHTML=DS[i][2](ps,w,h)}
document.addEventListener('click',e=>{const b=e.target.closest('.seg button');if(!b)return;const i=+b.dataset.i;state[i]=b.dataset.m;document.querySelectorAll('section')[i].querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.m===state[i]));fill(i)});
draw();addEventListener('resize',draw);
</script></body></html>
