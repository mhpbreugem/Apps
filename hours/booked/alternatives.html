<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booked page: 10 alternatives</title>
<style>
:root{--bg:#F7F6F2;--ink:#17181B;--mu:#7A7B82;--ln:#E3E1DA;--sf:#fff;--ch:#ECEAE3;--cap:#C8402A}
@media(prefers-color-scheme:dark){:root{--bg:#131417;--ink:#ECECEF;--mu:#9EA0A8;--ln:#2B2C32;--sf:#1B1C20;--ch:#26272D}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 Inter,system-ui,sans-serif;max-width:440px;margin:auto;padding:0 0 60px}
header{background:#000;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}header b{font-size:17px}header small{display:block;opacity:.65;font-size:11.5px}
section{padding:18px 14px 14px;border-bottom:8px solid var(--ch)}h2{font-size:15px;margin:0 0 2px}p.d{margin:0 0 10px;color:var(--mu);font-size:12px}
.sq{display:inline-block;width:var(--s,12px);height:var(--s,12px);border-radius:24%;background:var(--c);margin:0 2px 2px 0;vertical-align:top}.sq.un{background:none;box-shadow:inset 0 0 0 1.5px var(--c)}.sq.ov{background:none;box-shadow:inset 0 0 0 1.5px var(--cap);opacity:.9}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font:600 11.5px Inter,system-ui;color:var(--mu);margin-top:6px}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:4px}
.m{color:var(--mu)}.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.wk{display:flex;align-items:center;gap:8px;margin:5px 0}.wk .l{width:44px;font-size:11.5px;color:var(--mu)}.wk .n{width:46px;text-align:right;font:700 12px Inter,system-ui}.wk .n.o{color:var(--cap)}
.bar{flex:1;height:16px;background:var(--ch);border-radius:5px;display:flex;position:relative;overflow:visible}.bar i{display:block;height:100%}.bar i:first-child{border-radius:5px 0 0 5px}.bar i.un{background:none!important;box-shadow:inset 0 0 0 1.5px var(--c)}.bar .cp{position:absolute;right:0;top:-3px;bottom:-3px;border-right:2px dashed var(--ink);opacity:.5}
.hm{display:grid;grid-template-columns:44px repeat(6,1fr) 46px;gap:3px;align-items:center}.hm .c{aspect-ratio:1.5;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 11px Inter,system-ui;background:var(--ch);color:var(--mu)}.hm .h{font-size:11px;color:var(--mu);text-align:center}
.gt{position:relative;margin-top:4px}.gt .ax{display:flex;font-size:11px;color:var(--mu);border-bottom:1px solid var(--ln);padding-bottom:3px}.gt .ax span{flex:1}.gt .r{height:26px;position:relative;border-bottom:1px dashed var(--ln)}.gt .r b{position:absolute;top:4px;height:18px;border-radius:6px;font:700 10.5px/18px Inter,system-ui;color:#fff;padding:0 6px;overflow:hidden;white-space:nowrap}
.pc{display:flex;align-items:center;gap:10px;margin:8px 0}.pc .nm{width:78px;font-weight:700;font-size:13px}.pc .bar{height:14px}
.ag h4{margin:12px 0 4px;font-size:12.5px;display:flex;gap:8px}.ag .it{display:flex;align-items:center;gap:8px;padding:5px 0 5px 8px;border-left:3px solid var(--c);margin:3px 0;background:var(--sf);border-radius:0 8px 8px 0}.ag .it .dt{width:50px;font-size:11.5px;color:var(--mu)}
.col{display:flex;align-items:flex-end;gap:12px;height:170px;border-bottom:1px solid var(--ln);position:relative;padding-top:6px}.col .cl{flex:1;display:flex;flex-direction:column-reverse;height:100%;position:relative}.col .cl i{display:block}.col .cl i.un{background:none!important;box-shadow:inset 0 0 0 1.5px var(--c)}.col .cl em{position:absolute;left:0;right:0;text-align:center;font:700 11px Inter,system-ui;font-style:normal}.cx{display:flex;gap:12px}.cx span{flex:1;text-align:center;font-size:11.5px;color:var(--mu);margin-top:4px}
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.gg div{text-align:center;font-size:11px;color:var(--mu)}.ring{--p:0;width:62px;height:62px;border-radius:50%;margin:0 auto 3px;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--ch) 0);display:flex;align-items:center;justify-content:center;position:relative}.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}.ring b{position:relative;font-size:13px;color:var(--ink)}
.big{font:800 34px/1 Inter,system-ui}.spk{display:flex;align-items:flex-end;gap:3px;height:56px;margin:10px 0 4px}.spk i{flex:1;background:var(--ink);border-radius:3px 3px 0 0;opacity:.85;min-height:2px}.spk i.o{background:var(--cap)}
</style></head><body>
<header><b>Booked page: 10 alternatives</b><small>Sample data · capacity 20 h per week · hollow = not yet allocated to a day</small></header>
<div id="app"></div>
<script>
const CAP=20,MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const P={FMA:{c:'#E39A4B',t:'FMA class'},BT:{c:'#B8651B',t:'BT lectures'},FRA:{c:'#C8402A',t:'Frankfurt'},REC:{c:'#7B4FA3',t:'Recruitment'},COM:{c:'#9A74BD',t:'Committee'},DEF:{c:'#2F7D5B',t:'Defences'}};
const D=s=>{const a=s.split('-');return new Date(Date.UTC(+a[0],a[1]-1,+a[2]))},iso=d=>d.toISOString().slice(0,10),add=(d,n)=>new Date(d.getTime()+n*864e5),mon=d=>add(d,-((d.getUTCDay()+6)%7)),fd=s=>{const d=D(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]};
const B=[];const bk=(d,h,p,un)=>B.push({d,h,p,un:!!un});
bk('2026-11-20',6,'FMA');bk('2026-11-27',4,'FMA');bk('2026-12-04',4,'FMA');bk('2026-12-11',4,'FMA');
['2026-11-25','2026-12-02','2026-12-09','2026-12-16','2027-01-13','2027-01-20'].forEach(d=>bk(d,2,'REC'));['2026-12-03','2027-01-14','2027-02-04'].forEach(d=>bk(d,2,'COM'));
bk('2026-12-15',3,'DEF');bk('2026-12-17',3,'DEF');bk('2027-01-12',6,'BT');bk('2027-01-13',6,'BT');
for(let i=0;i<5;i++)bk(iso(add(D('2027-01-25'),i)),6,'FRA');
for(let i=0;i<10;i++){const d=add(D('2027-01-30'),i);if(d.getUTCDay())bk(iso(d),i<9?6:6,'FRA',1)}
B.sort((a,b)=>a.d<b.d?-1:1);
const T0=D('2026-11-20'),W0=mon(T0),NW=13,weeks=[...Array(NW)].map((_,i)=>add(W0,7*i));
const wkOf=d=>Math.floor((D(d)-W0)/6048e5);
const wt=weeks.map(()=>({tot:0,by:{},un:0}));B.forEach(b=>{const i=wkOf(b.d);if(i<0||i>=NW)return;wt[i].tot+=b.h;wt[i].by[b.p]=(wt[i].by[b.p]||0)+b.h;if(b.un)wt[i].un+=b.h});
const sq=(p,n,un,s)=>[...Array(n)].map(()=>`<i class="sq${un?' un':''}" style="--c:${P[p].c};${s?'--s:'+s+'px':''}"></i>`).join('');
const lg=ps=>`<div class="lg">${ps.map(p=>`<span><i style="--c:${P[p].c}"></i>${P[p].t}</span>`).join('')}<span><i style="--c:#888;background:none;box-shadow:inset 0 0 0 1.5px #888"></i>not allocated yet</span></div>`;
const ALL=Object.keys(P);const out=[];const S=(t,d,h)=>out.push(`<section><h2>${t}</h2><p class="d">${d}</p>${h}</section>`);
// 1 months of squares
{let h='';for(let m=0;m<3+1;m++){const d=new Date(Date.UTC(2026,10+m,1)),k=iso(d).slice(0,7),it=B.filter(b=>b.d.slice(0,7)===k),n=it.reduce((a,b)=>a+b.h,0);h+=`<div class="row" style="margin-top:10px"><b>${MN[d.getUTCMonth()]}</b><span class="sp"></span><span class="m">${n} h</span></div><div>${it.map(b=>sq(b.p,b.h,b.un,10)).join('')}</div>`}S('1 · Months of squares','Today\'s layout: one block of squares per month.',h+lg(ALL))}
// 2 week rows of 20 slots
{let h='';weeks.forEach((w,i)=>{const it=B.filter(b=>wkOf(b.d)===i);let k=0,cells='';it.forEach(b=>{for(let j=0;j<b.h;j++){k++;cells+=k>CAP?`<i class="sq ov" style="--s:9px"></i>`:`<i class="sq${b.un?' un':''}" style="--c:${P[b.p].c};--s:9px"></i>`}});for(;k<CAP;k++){cells+=`<i class="sq" style="--s:9px;background:var(--ch)"></i>`}h+=`<div class="wk"><span class="l">${fd(iso(w))}</span><div style="flex:1;line-height:0">${cells}</div><span class="n${wt[i].tot>CAP?' o':''}">${wt[i].tot}</span></div>`});S('2 · Weeks as 20 slots','Each week is a row of 20 slots. Booked hours fill them. Red outlines are hours above 20.',h+lg(ALL))}
// 3 week stacked bars
{let h='';weeks.forEach((w,i)=>{const mx=Math.max(CAP,wt[i].tot);h+=`<div class="wk"><span class="l">${fd(iso(w))}</span><div class="bar" style="flex:1"><span style="display:contents">${ALL.map(p=>{const n=B.filter(b=>wkOf(b.d)===i&&b.p===p&&!b.un).reduce((a,b)=>a+b.h,0),u=B.filter(b=>wkOf(b.d)===i&&b.p===p&&b.un).reduce((a,b)=>a+b.h,0);return(n?`<i style="width:${n/mx*100}%;background:${P[p].c}"></i>`:'')+(u?`<i class="un" style="--c:${P[p].c};width:${u/mx*100}%"></i>`:'')}).join('')}</span>${wt[i].tot>CAP?`<span class="cp" style="right:auto;left:${CAP/mx*100}%"></span>`:`<span class="cp"></span>`}</div><span class="n${wt[i].tot>CAP?' o':''}">${wt[i].tot}/${CAP}</span></div>`});S('3 · Weekly load bars','A bar per week against 20 h. The dashed line is the limit. Hollow parts are not allocated to a day.',h+lg(ALL))}
// 4 heatmap
{let h='<div class="hm"><span></span>'+'MTWTFS'.split('').map(x=>`<span class="h">${x}</span>`).join('')+'<span class="h">week</span>';weeks.forEach((w,i)=>{h+=`<span class="h" style="text-align:left">${fd(iso(w))}</span>`;for(let j=0;j<6;j++){const d=iso(add(w,j)),n=B.filter(b=>b.d===d).reduce((a,b)=>a+b.h,0),un=B.some(b=>b.d===d&&b.un);const a=Math.min(1,n/8);h+=`<span class="c" style="${n?`background:${un?'transparent':`rgba(200,64,42,${.15+a*.7})`};${un?'box-shadow:inset 0 0 0 1.5px rgba(200,64,42,.7);':''}color:var(--ink)`:''}">${n||''}</span>`}h+=`<span class="h" style="font-weight:700;color:${wt[i].tot>CAP?'var(--cap)':'var(--ink)'}">${wt[i].tot}</span>`});S('4 · Calendar heatmap','Weeks down, days across. Darker means more booked hours that day. Outlined cells are not allocated yet.',h+'</div>')}
// 5 gantt
{const first=iso(W0),span=NW*7;let h='<div class="gt"><div class="ax">'+['Nov','Dec','Jan','Feb'].map(x=>`<span>${x}</span>`).join('')+'</div>';ALL.forEach(p=>{const it=B.filter(b=>b.p===p);if(!it.length)return;const a=(D(it[0].d)-W0)/864e5,b2=(D(it[it.length-1].d)-W0)/864e5+1,tot=it.reduce((s,b)=>s+b.h,0);h+=`<div class="r"><b style="left:${a/span*100}%;width:${Math.max(9,(b2-a)/span*100)}%;background:${P[p].c}">${tot} h</b></div><div style="font-size:11px;color:var(--mu);margin:-2px 0 4px">${P[p].t}</div>`});S('5 · Timeline per project','One bar per project from first to last booked day, with total hours.',h+'</div>')}
// 6 per project bars
{let h='';ALL.forEach(p=>{const n=B.filter(b=>b.p===p&&!b.un).reduce((a,b)=>a+b.h,0),u=B.filter(b=>b.p===p&&b.un).reduce((a,b)=>a+b.h,0);h+=`<div class="pc"><span class="nm">${P[p].t}</span><div class="bar"><i style="width:${n/(n+u)*100}%;background:${P[p].c}"></i><i class="un" style="--c:${P[p].c};width:${u/(n+u)*100}%"></i></div><span style="width:70px;text-align:right;font-weight:700">${n}${u?' + '+u:''} h</span></div>`});S('6 · Allocated vs not allocated','Per project: filled is booked on a day, hollow is still to allocate.',h)}
// 7 agenda
{let h='<div class="ag">';weeks.forEach((w,i)=>{const it=B.filter(b=>wkOf(b.d)===i&&!b.un);if(!it.length&&!wt[i].un)return;h+=`<h4>Week of ${fd(iso(w))}<span class="sp"></span><span class="${wt[i].tot>CAP?'':'m'}" style="${wt[i].tot>CAP?'color:var(--cap)':''}">${wt[i].tot} / ${CAP} h</span></h4>`+it.map(b=>`<div class="it" style="--c:${P[b.p].c}"><span class="dt">${fd(b.d)}</span><b>${P[b.p].t}</b><span class="sp"></span>${b.h} h</div>`).join('')+(wt[i].un?`<div class="it" style="--c:#888;opacity:.7"><span class="dt"></span><b>Not allocated</b><span class="sp"></span>${wt[i].un} h</div>`:'')});S('7 · Agenda by week','A list: weeks as headers, days underneath. Best for reading what is on when.',h+'</div>')}
// 8 monthly columns
{const ms=[0,1,2,3].map(m=>{const d=new Date(Date.UTC(2026,10+m,1)),k=iso(d).slice(0,7);return{n:MON[d.getUTCMonth()],it:B.filter(b=>b.d.slice(0,7)===k)}}),mx=130;let h='<div class="col">';const cap=87;h+=`<div style="position:absolute;left:0;right:0;bottom:${cap/mx*100}%;border-top:2px dashed var(--ink);opacity:.4"></div>`;ms.forEach(m=>{const tot=m.it.reduce((a,b)=>a+b.h,0);h+='<div class="cl">'+ALL.map(p=>[0,1].map(u=>{const n=m.it.filter(b=>b.p===p&&!!b.un===!!u).reduce((a,b)=>a+b.h,0);return n?`<i class="${u?'un':''}" style="--c:${P[p].c};height:${n/mx*100}%;${u?'':'background:'+P[p].c}"></i>`:''}).join('')).join('')+`<em style="bottom:calc(${tot/mx*100}% + 2px)">${tot}</em></div>`});h+='</div><div class="cx">'+ms.map(m=>`<span>${m.n}</span>`).join('')+'</div>';S('8 · Month columns','Hours per month as stacked columns. Dashed line is 20 h × 4.3 weeks.',h+lg(ALL))}
// 9 gauges
{let h='<div class="gg">';weeks.slice(0,8).forEach((w,i)=>{const t=wt[i].tot,f=Math.max(0,CAP-t);h+=`<div><div class="ring" style="--c:${t>CAP?'var(--cap)':'#2F7D5B'};--p:${Math.min(100,t/CAP*100)}"><b>${t}</b></div>${fd(iso(w))}<br>${t>CAP?'<span style="color:var(--cap)">+'+(t-CAP)+' over</span>':f+' free'}</div>`});S('9 · Weekly gauges','Ring per week against 20 h. Shows what is free or over, for the next 8 weeks.',h+'</div>')}
// 10 summary + sparkline
{const tot=wt.reduce((a,x)=>a+x.tot,0),un=wt.reduce((a,x)=>a+x.un,0),cap=NW*CAP;let h=`<div class="row"><div><div class="big">${tot-un}</div><div class="m">allocated hours</div></div><div style="margin-left:18px"><div class="big" style="opacity:.55">${un}</div><div class="m">not allocated</div></div><div style="margin-left:18px"><div class="big" style="opacity:.55">${Math.max(0,cap-tot)}</div><div class="m">free of ${cap}</div></div></div><div class="spk">${wt.map(x=>`<i class="${x.tot>CAP?'o':''}" style="height:${Math.min(100,x.tot/36*100)}%"></i>`).join('')}</div><div class="row m" style="font-size:11px"><span>${fd(iso(weeks[0]))}</span><span class="sp"></span><span>${fd(iso(weeks[NW-1]))}</span></div><div class="m" style="font-size:12px;margin-top:8px">Total hours first, one bar per week below. Red bars exceed 20 h.</div>`;S('10 · Totals first','Totals over 13 weeks at 20 h per week, with a bar per week.',h)}
document.getElementById('app').innerHTML=out.join('');
</script></body></html>
