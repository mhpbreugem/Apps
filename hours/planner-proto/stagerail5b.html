<script>
const C={Research:'#2E7D4F',Teaching:'#E39A45','Chair & Admin':'#6B4FA3',Personal:'#7B7D86'};
const R=['Question','Initial model','Story','Numerics','Submit'];
const SH={'Teaching alloc.':'T.All','Frankfurt':'FS','Recruitment':'Rec','New master':'NMsc','Staff and MT':'S&MT','Committees':'Com','Persian':'Pers'};
const D=[['Research',14,[['MIZN',250,21,R,[1,.4,0,0,0]],['TSI',200,40,R,[1,1,.2,0,0]],['IRR',150,0,R,[0,0,0,0,0]],['KEZ',150,12,R,[.6,0,0,0,0]],['BBP',100,60,R,[1,1,.6,0,0]],['WP0',100,10,R,[.4,0,0,0,0]],['WP1',150,0,R,[0,0,0,0,0]]]],
['Teaching',12,[['BT',75,18,['Prepare','Teach','Exam and grading'],[.5,.1,0]],['FMA',50,6,['Prepare','Teach','Exam and grading'],[.4,0,0]],['EEOD',10,0,['Prepare','Teach','Exam and grading'],[0,0,0]],['Frankfurt',90,0,['Teach'],[0]],['Theses',74,30,['Supervision','Reading','Defences'],[.7,.3,0]]]],
['Chair & Admin',10,[['Recruitment',30,12,['Profile','Applications','Fly-outs','Decide','Offer'],[1,.5,0,0,0]],['Teaching alloc.',20,8,['Supply and demand','Draft','Agree'],[1,.4,0]],['New master',30,4,['Proposal','Partner talks','Curriculum','Approval'],[.3,0,0,0]],['Staff and MT',60,20,['Ongoing'],[.33]],['Committees',50,10,['Ongoing'],[.2]]]],
['Personal',4,[['Persian',60,15,['Ongoing'],[.25]],['Sport',100,40,['Ongoing'],[.4]],['Home',40,5,['Ongoing'],[.12]]]]];
const CATS=D.map(([n,wk,ps])=>({n,wk,c:C[n],ps:ps.map(([a,t,d,sn,sf])=>({n:SH[a]||a,t,d,sn,sf,c:C[n]})),d:ps.reduce((a,p)=>a+p[2],0),t:ps.reduce((a,p)=>a+p[1],0)}));
const tr=(c,k=22)=>`color-mix(in srgb,${c} ${k}%,var(--bg))`;
const frac=p=>p.sf.reduce((a,b)=>a+b,0)/p.sn.length*100;
let MODE=1,RC=24;const cnt=p=>{const f=p.d/p.t,pc=Math.round(f*100);return MODE===1?`<span class="pie" style="background:conic-gradient(${p.c} ${f*360}deg,${tr(p.c,26)} 0)"></span>`:MODE===2?`<span class="dn tb">${p.d}</span>`:MODE===3?`<span class="dn tb">${pc}%</span>`:MODE===4?`<span class="pd"><i class="pie s" style="background:conic-gradient(${p.c} ${f*360}deg,${tr(p.c,26)} 0)"></i><b class="tb">${p.d}</b></span>`:''};
function bar(p,o){o=o||{};const n=p.sn.length,w=frac(p),tk=o.tk||2,k=p.sf.findIndex(x=>x<1),cur=k<0?n-1:k;
const tkb=`repeating-linear-gradient(90deg,transparent 0 calc(100%/${n} - ${tk}px),var(--bg) calc(100%/${n} - ${tk}px) calc(100%/${n}))`;
const lab=p.sn.map((x,i)=>{const on=p.sf[i]>=1,pt=p.sf[i]>0&&p.sf[i]<1;return `<span style="color:${on?'#fff':'var(--ink)'};${i===cur?'font-weight:800':'font-weight:500;opacity:.66'}${pt?';text-shadow:0 0 3px var(--bg),0 0 2px var(--bg)':''}">${o.first?x.split(' ')[0]:x}</span>`}).join('');
return `<div class="b4" style="height:${(o.bh||.78)*100}%;border-radius:${o.r||8}px;background:${tr(p.c)}"><div class="reg" style="right:0"><i style="width:${w}%;background:${p.c}"></i><span class="tkl" style="background-image:${tkb}"></span><div class="sl" style="grid-template-columns:repeat(${n},1fr)">${lab}</div></div></div>`}
const row=(p,o,mid)=>`<div class="ln mr" style="grid-template-columns:${(o&&o.nw)||43}px 1fr ${RC}px"><b>${MODE===5?`<span class="nu"><i style="width:${Math.max(4,p.d/p.t*100*3)}%;background:${p.c}"></i></span>`:''}${p.n}</b>${mid||bar(p,o)}${cnt(p)}</div>`;
const rows=(c,o)=>c.ps.map(p=>row(p,o)).join('');
const grp=(n,inner,extra)=>`<div class="grp" style="flex:${n} 1 0;${extra||''}">${inner}</div>`;
const pct=c=>Math.round(c.d/c.t*100);
const rl=c=>`<div class="rail rw" style="background:${c.c}"><span>${c.n}</span></div>`;
const mk=(m,rc)=>b=>{MODE=m;RC=rc;return b.map(c=>grp(c.ps.length,rl(c)+`<div class="rows">${rows(c)}</div>`)).join('')};
const V=[
['1 · Pie dot only',mk(1,18)],
['2 · Hours done only',mk(2,22)],
['3 · Percent only',mk(3,26)],
['4 · Pie + hours done',mk(4,34)],
['5 · Underline under name, no column',mk(5,0)]
];
document.body.innerHTML=V.map(([t,f])=>`<section><div class="hd"><div><b>Planner</b><small>6 of 1789 h done</small></div><em>${t}</em></div><div class="body eq">${f(CATS)}</div><div class="nav"><b>Planner</b><span>Days</span><span>Booked</span><span>Settings</span></div></section>`).join('');
</script></body></html>
