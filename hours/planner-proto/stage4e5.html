<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner overview, 10 alternatives</title>
<style>
:root{--bg:#F7F6F2;--ink:#17181B;--mu:#7B7D86;--ln:#E3E1DA;--ch:#ECEAE4;--sf:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#131417;--ink:#ECECEF;--mu:#9EA0A8;--ln:#2B2C32;--ch:#26272D;--sf:#1B1C20}}
*{box-sizing:border-box;margin:0}html,body{background:#777}body{font:13px Inter,system-ui,sans-serif;color:var(--ink);display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:16px 0}
section{width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;border-radius:14px}
.hd{background:#000;color:#fff;padding:10px 14px;flex:none;display:flex;justify-content:space-between;align-items:flex-end}.hd b{font-size:16px;display:block}.hd small{opacity:.7;font-size:11px}.hd em{font:normal 10px Inter;opacity:.6}
.body{flex:1;min-height:0;padding:6px 12px 8px;overflow:hidden;position:relative}
.nav{flex:none;height:56px;border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:center;font-size:10px;color:var(--mu)}.nav b{color:var(--ink)}
.cn{display:flex;align-items:baseline;gap:6px;font:700 12px Inter;margin:6px 0 3px}.cn small{font:500 10px Inter;color:var(--mu)}.cn i{width:9px;height:9px;border-radius:3px;background:var(--c);align-self:center}.cn .sp{flex:1}
.m{color:var(--mu);font-size:10px}
.ring{width:var(--z);height:var(--z);border-radius:50%;background:linear-gradient(0deg,var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--c) 24%,var(--bg)) 0);display:flex;align-items:center;justify-content:center;flex:none}.ring b{display:flex;align-items:center;justify-content:center;font:700 calc(var(--z)*.22) Inter;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.bar{height:var(--h,8px);border-radius:var(--r,4px);background:color-mix(in srgb,var(--c) 22%,var(--bg));overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.dg{display:flex;flex-wrap:wrap;line-height:0}.dg i{width:var(--s);height:var(--s);border-radius:50%;background:var(--c);margin:0 1.5px 1.5px 0;flex:none}.dg i.e{opacity:.26}
.eq{display:flex;flex-direction:column;padding-top:4px;padding-bottom:6px}.ln{flex:1 1 0;max-height:34px;min-height:0}.ln.mr{display:grid;column-gap:4px;align-items:center}.ln.mh{display:grid;column-gap:4px;align-items:end;padding:0 0 1px}.ln.cn{margin:0;align-items:flex-end;padding-bottom:1px}.sl{position:absolute;inset:0;display:grid}.sl span{display:flex;align-items:center;padding:0 5px;font:600 8px Inter;color:var(--ink);white-space:nowrap;overflow:hidden;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.pills{display:grid;gap:3px;width:100%}.pil{display:flex;align-items:center;padding:0 6px;font:600 8px Inter;white-space:nowrap;overflow:hidden;min-width:0}.pil span{overflow:hidden;text-overflow:ellipsis}.ni.r{justify-content:flex-end;right:6px;left:auto;padding:0;text-shadow:0 0 3px var(--bg)}
.reg{position:absolute;left:0;top:0;bottom:0;overflow:hidden;border-radius:inherit}.reg>i{position:absolute;left:0;top:0;bottom:0}.sl span{text-shadow:none}
</style><style>
.mh,.mr{display:grid;column-gap:4px;align-items:center}.mh{font:600 9px Inter;color:var(--mu);text-align:center;padding-top:2px}.mh span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr{height:21px}.mr.t{height:24px}.mr b{font:700 11px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r{text-align:right}
.bar.tx{position:relative}.bar.tx u{position:absolute;inset:0;display:flex;align-items:center;padding:0 5px;font:600 8.5px Inter;text-decoration:none;white-space:nowrap;overflow:hidden;color:var(--ink)}
.bar.one{background-image:repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--n) - 2px),var(--bg) calc(100%/var(--n) - 2px) calc(100%/var(--n)));position:relative}
.dc{display:flex;justify-content:center}.dc i{width:15px;height:15px;border-radius:50%}
.pr{display:grid;grid-template-columns:1fr auto;padding:2px 0 3px;row-gap:2px}.pr b{font:600 11.5px Inter}.pl2{display:flex;gap:3px}.pl2 span{flex:1;min-width:0;font:600 8.5px Inter;padding:3px 2px;border-radius:7px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs small{font:500 9px Inter;color:var(--mu);display:block;margin-top:1px}
.hc{height:17px;border-radius:4px;display:flex;align-items:center;justify-content:center}.hc small{font:600 8px Inter;color:var(--ink)}
.tl{height:15px;background:repeating-linear-gradient(90deg,var(--ln) 0 1px,transparent 1px calc(100%/7))}.tb{height:15px;display:flex;gap:1px;border-radius:5px;overflow:hidden}.tb i{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.cd{display:grid;grid-template-columns:1fr auto;padding:4px 6px;border-radius:8px;background:var(--sf);border:1px solid var(--ln);row-gap:1px}.cd b{font:600 11px Inter}.cd small{grid-column:1/3;font:500 8px Inter;color:var(--mu)}.sg{grid-column:1/3;display:grid;gap:2px;margin-top:2px}
.lad{display:flex}.lad span{flex:1;font:600 8.5px Inter;padding:3px 2px;text-align:center;white-space:nowrap;overflow:hidden;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 50%,calc(100% - 5px) 100%,0 100%,5px 50%);margin-left:-3px}
</style><style>
.mh,.mr{display:grid;column-gap:4px;align-items:center}.mh{font:600 8px Inter;color:var(--mu);text-align:center;padding-top:2px}.mh span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mr b{font:700 11px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}.r{text-align:right}
.b4{position:relative;overflow:hidden;width:100%}.b4>i{position:absolute;left:0;top:0;bottom:0}.b4 .a2{opacity:.95}.tkl{position:absolute;inset:0}
.mk{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink);transform:translateX(-1px)}
.ni{position:absolute;inset:0;display:flex;align-items:center;padding:0 7px;font:600 9.5px Inter;text-decoration:none;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}.ni.r{justify-content:flex-end}
.gd{position:absolute;inset:-3px 0;pointer-events:none}.dt{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px}
</style></head><body>
<script>
const C={Research:'#2E7D4F',Teaching:'#E39A45','Chair & Admin':'#6B4FA3',Personal:'#7B7D86'};
const R=['Question','Initial model','Story','Numerics','Submit'];
const D=[['Research',14,[['MIZN',250,21,R,[1,.4,0,0,0]],['TSI',200,40,R,[1,1,.2,0,0]],['IRR',150,0,R,[0,0,0,0,0]],['KEZ',150,12,R,[.6,0,0,0,0]],['BBP',100,60,R,[1,1,.6,0,0]],['WP0',100,10,R,[.4,0,0,0,0]],['WP1',150,0,R,[0,0,0,0,0]]]],
['Teaching',12,[['BT',75,18,['Prepare','Teach','Exam and grading'],[.5,.1,0]],['FMA',50,6,['Prepare','Teach','Exam and grading'],[.4,0,0]],['EEOD',10,0,['Prepare','Teach','Exam and grading'],[0,0,0]],['Frankfurt',90,0,['Teach'],[0]],['Theses',74,30,['Supervision','Reading','Defences'],[.7,.3,0]]]],
['Chair & Admin',10,[['Recruitment',30,12,['Profile','Applications','Fly-outs','Decide','Offer'],[1,.5,0,0,0]],['Teaching alloc.',20,8,['Supply and demand','Draft','Agree'],[1,.4,0]],['New master',30,4,['Proposal','Partner talks','Curriculum','Approval'],[.3,0,0,0]],['Staff and MT',60,20,['Ongoing'],[.33]],['Committees',50,10,['Ongoing'],[.2]]]],
['Personal',4,[['Persian',60,15,['Ongoing'],[.25]],['Sport',100,40,['Ongoing'],[.4]],['Home',40,5,['Ongoing'],[.12]]]]];
const SH={'Teaching alloc.':'T.All','Frankfurt':'FS','Recruitment':'Rec','New master':'NMsc','Staff and MT':'S&MT','Committees':'Com','Persian':'Pers','Sport':'Sport','Home':'Home','Theses':'Thes'};
const CATS=D.map(([n,wk,ps])=>({n,wk,c:C[n],ps:ps.map(([a,t,d,sn,sf])=>({n:SH[a]||a,t,d,sn,sf,c:C[n]}))}));
const tr=(c,k=22)=>`color-mix(in srgb,${c} ${k}%,var(--bg))`;
const cat0=c=>`<div class="cn" style="--c:${c.c}"><i></i>${c.n}<span class="sp"></span><small>${c.ps.reduce((a,p)=>a+p.d,0)} of ${c.ps.reduce((a,p)=>a+p.t,0)} h · ${c.wk} h/wk</small></div>`;
const frac=p=>p.sf.reduce((a,b)=>a+b,0)/p.sn.length*100;
// equal pitch, labels inside bars; variants refine design 4
function make(o){const O={bh:.78,r:8,tk:2,nw:40,...o};
return c=>{let h='';c.ps.forEach(p=>{const n=p.sn.length;
const gc=`grid-template-columns:${O.nw}px 1fr ${O.cin?'0px':'38px'}`;
const tkb=`repeating-linear-gradient(90deg,transparent 0 calc(100%/${n} - ${O.tk}px),var(--bg) calc(100%/${n} - ${O.tk}px) calc(100%/${n}))`;
const k=p.sf.findIndex(x=>x<1),cur=k<0?n-1:k;
const lab=p.sn.map((x,i)=>{const on=p.sf[i]>=1,pt=p.sf[i]>0&&p.sf[i]<1;let st='';
 if(O.contrast)st+=`color:${on?'#fff':'var(--ink)'};`+(pt?'text-shadow:0 0 3px var(--bg),0 0 2px var(--bg)!important;':'');
 if(O.cur)st+=i===cur?'font-weight:800;opacity:1;':'font-weight:500;opacity:.62;';
 if(O.first)x=x.split(' ')[0];
 return `<span style="${st}">${x}</span>`}).join('');
let bar;
if(O.pills){bar=`<div class="pills" style="grid-template-columns:repeat(${n},1fr);height:${O.bh*100}%">${p.sn.map((x,i)=>{const f=p.sf[i];let t=O.first?x.split(' ')[0]:x;return `<div class="pil" style="border-radius:${O.r}px;background:linear-gradient(90deg,${p.c} ${f*100}%,${tr(p.c)} 0);color:${f>=1?'#fff':'var(--ink)'}"><span>${t}</span></div>`}).join('')}</div>`}
else{const w=p.sf.reduce((a,b)=>a+b,0)/n*100;
bar=`<div class="b4" style="height:${O.bh*100}%;border-radius:${O.r}px;background:${tr(p.c)}"><div class="reg" style="right:${O.cin?38:0}px"><i style="width:${w}%;background:${p.c}"></i><span class="tkl" style="background-image:${tkb}"></span><div class="sl" style="grid-template-columns:repeat(${n},1fr)">${lab}</div></div>${O.cin?`<u class="ni r" style="color:var(--ink)">${p.d}/${p.t}</u>`:''}</div>`}
h+=`<div class="ln mr" style="${gc}"><b>${p.n}</b>${bar}${O.cin?'<span></span>':`<span class="m r">${p.d}/${p.t}</span>`}</div>`});return h}}
const cat=c=>`<div class="ln cn" style="--c:${c.c}"><i></i>${c.n}<span class="sp"></span><small>${c.ps.reduce((a,p)=>a+p.d,0)} of ${c.ps.reduce((a,p)=>a+p.t,0)} h · ${c.wk} h/wk</small></div>`;
const V=[
['1 · Contrast text',{contrast:1}],
['2 · Current stage bold',{contrast:1,cur:1,tk:3}],
['3 · Separate pills',{pills:1,r:8,bh:.8}],
['4 · First word only, taller',{contrast:1,first:1,bh:.86,r:9}],
['5 · Count inside bar',{contrast:1,cin:1,cur:1,bh:.82}]];
document.body.innerHTML=V.map(([t,o])=>{const f=make(o);return `<section><div class="hd"><div><b>Planner</b><small>6 of 1789 h done</small></div><em>${t}</em></div><div class="body eq">${CATS.map(c=>cat(c)+f(c)).join('')}</div><div class="nav"><b>Planner</b><span>Days</span><span>Booked</span><span>Settings</span></div></section>`}).join('');
</script></body></html>
