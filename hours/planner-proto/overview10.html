<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner overview, 10 alternatives</title>
<style>
:root{--bg:#F7F6F2;--ink:#17181B;--mu:#7B7D86;--ln:#E3E1DA;--ch:#ECEAE4;--sf:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#131417;--ink:#ECECEF;--mu:#9EA0A8;--ln:#2B2C32;--ch:#26272D;--sf:#1B1C20}}
*{box-sizing:border-box;margin:0}html,body{background:#777}body{font:13px Inter,system-ui,sans-serif;color:var(--ink);display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:16px 0}
section{width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;border-radius:14px}
.hd{background:#000;color:#fff;padding:10px 14px;flex:none;display:flex;justify-content:space-between;align-items:flex-end}.hd b{font-size:16px;display:block}.hd small{opacity:.7;font-size:11px}.hd em{font:normal 10px Inter;opacity:.6}
.body{flex:1;min-height:0;padding:6px 12px 8px;overflow:hidden;position:relative}
.nav{flex:none;height:56px;border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:center;font-size:10px;color:var(--mu)}.nav b{color:var(--ink)}
.cn{display:flex;align-items:baseline;gap:6px;font:700 12px Inter;margin:6px 0 3px}.cn small{font:500 10px Inter;color:var(--mu)}.cn i{width:9px;height:9px;border-radius:3px;background:var(--c);align-self:center}.cn .sp{flex:1}
.m{color:var(--mu);font-size:10px}
.ring{width:var(--z);height:var(--z);border-radius:50%;background:linear-gradient(0deg,var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--c) 24%,var(--bg)) 0);display:flex;align-items:center;justify-content:center;flex:none}.ring b{display:flex;align-items:center;justify-content:center;font:700 calc(var(--z)*.22) Inter;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.bar{height:var(--h,8px);border-radius:var(--r,4px);background:color-mix(in srgb,var(--c) 22%,var(--bg));overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.dg{display:flex;flex-wrap:wrap;line-height:0}.dg i{width:var(--s);height:var(--s);border-radius:50%;background:var(--c);margin:0 1.5px 1.5px 0;flex:none}.dg i.e{opacity:.26}
</style></head><body>
<script>
const C={Research:'#2E7D4F',Teaching:'#E39A45','Chair & Admin':'#6B4FA3',Personal:'#7B7D86'};
const mix=(c,i)=>{const h=c.slice(1),n=parseInt(h,16),r=n>>16,g=(n>>8)&255,b=n&255,f=i*.18;const m=v=>Math.round(v+(255-v)*f).toString(16).padStart(2,'0');return'#'+m(r)+m(g)+m(b)};
// [name,total,done,likely finish (months from now), stage fractions]
const D=[['Research',14,[['MIZN',250,21,18,[1,.4,0,0,0]],['TSI',200,40,20,[1,1,.2,0,0]],['IRR',150,0,24,[0,0,0,0,0]],['KEZ',150,12,22,[.6,0,0,0,0]],['BBP',100,60,14,[1,1,.6,0,0]],['WP0',100,10,26,[.4,0,0,0,0]],['WP1',150,0,28,[0,0,0,0,0]]]],
['Teaching',12,[['BT',75,18,5,[.3,.2,.1,0,0]],['FMA',50,6,3,[.12,0,0,0,0]],['EEOD',10,0,2,[0,0,0,0,0]],['Frankfurt',90,0,3,[0,0,0,0,0]],['Theses',74,30,8,[.5,.4,.3,0,0]]]],
['Chair & Admin',10,[['Recruitment',30,12,4,[1,.5,0,0,0]],['Teaching alloc.',20,8,3,[1,.4,0,0,0]],['New master',30,4,10,[.3,0,0,0,0]],['Staff and MT',60,20,12,[.6,.3,0,0,0]],['Committees',50,10,12,[.2,.1,0,0,0]]]],
['Personal',4,[['Persian',60,15,16,[.5,.2,0,0,0]],['Sport',100,40,12,[.8,.4,0,0,0]],['Home',40,5,6,[.2,0,0,0,0]]]]];
const CATS=D.map(([n,wk,ps])=>({n,wk,c:C[n],ps:ps.map(([a,t,d,m,st],i)=>({n:a,t,d,m,st,c:mix(C[n],i)}))}));
const ALL=CATS.flatMap(c=>c.ps.map(p=>({...p,cat:c.n,cc:c.c})));
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0),TT=sum(ALL,p=>p.t),TD=sum(ALL,p=>p.d);
const pc=p=>Math.round(100*p.d/p.t);
const ch=c=>`<div class="cn" style="--c:${c.c}"><i></i>${c.n}<small>${sum(c.ps,p=>p.d)}/${sum(c.ps,p=>p.t)} h · ${c.wk} h/wk</small></div>`;
const MON=['Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov'];
const ring=(p,z)=>`<div class="ring" style="--c:${p.c};--p:${pc(p)};--z:${z}px"><b>${pc(p)}%</b></div>`;
const DES=[
['1 · Filled dots, 4 columns',()=>CATS.map(c=>ch(c)+`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px">`+c.ps.map(p=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center">${ring(p,56)}<b style="font-size:11px;line-height:1.1">${p.n}</b><span class="m">${p.d}/${p.t}</span></div>`).join('')+`</div>`).join('')],
['2 · Dot rows (1 dot = 5 h)',()=>CATS.map(c=>ch(c)+c.ps.map(p=>`<div style="display:grid;grid-template-columns:66px 1fr;gap:6px;margin-bottom:3px"><div style="font:600 11px/1.1 Inter">${p.n}<div class="m">${pc(p)}%</div></div><div class="dg" style="--s:9px;--c:${p.c}">${Array.from({length:Math.ceil(p.t/5)},(_,k)=>`<i class="${k*5<p.d?'':'e'}"></i>`).join('')}</div></div>`).join('')).join('')],
['3 · Progress bars',()=>CATS.map(c=>ch(c)+c.ps.map(p=>`<div style="display:grid;grid-template-columns:78px 1fr 62px;gap:8px;align-items:center;height:25px"><b style="font:600 11.5px Inter">${p.n}</b><div class="bar" style="--c:${p.c};--h:10px"><i style="width:${pc(p)}%"></i></div><span class="m" style="text-align:right">${p.d}/${p.t} h</span></div>`).join('')).join('')],
['4 · Treemap by hours',()=>{const W=366,H=690;function sq(items,x,y,w,h,out){const tot=sum(items,i=>i.v);if(items.length===1){out.push({...items[0],x,y,w,h});return}let acc=0,k=0;const half=tot/2;while(k<items.length-1&&acc+items[k].v<=half)acc+=items[k++].v;if(k===0){acc=items[0].v;k=1}const a=items.slice(0,k),b=items.slice(k);if(w>=h){const w1=w*acc/tot;sq(a,x,y,w1,h,out);sq(b,x+w1,y,w-w1,h,out)}else{const h1=h*acc/tot;sq(a,x,y,w,h1,out);sq(b,x,y+h1,w,h-h1,out)}}
const out=[];sq(CATS.map(c=>({v:sum(c.ps,p=>p.t),c})),0,0,W,H,out);let h='';out.forEach(o=>{const ps=o.c.ps.map(p=>({...p,v:p.t})).sort((a,b)=>b.v-a.v),o2=[];sq(ps,o.x,o.y,o.w,o.h,o2);o2.forEach(q=>{h+=`<div style="position:absolute;left:${q.x+1}px;top:${q.y+1}px;width:${q.w-2}px;height:${q.h-2}px;border-radius:7px;overflow:hidden;background:color-mix(in srgb,${q.c} 22%,var(--bg))"><div style="position:absolute;left:0;bottom:0;width:100%;height:${pc(q)}%;background:${q.c}"></div><div style="position:absolute;left:5px;top:4px;font:700 ${q.w>90?11:9}px/1.1 Inter;color:var(--ink)">${q.n}<br><span class="m">${pc(q)}%</span></div></div>`})});return`<div style="position:relative;width:366px;height:${H}px;margin-top:4px">${h}</div>`}],
['5 · Category cards, 2 × 2',()=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">`+CATS.map(c=>`<div style="background:var(--sf);border-radius:14px;padding:10px;border-top:4px solid ${c.c}"><div style="font:700 13px Inter">${c.n}</div><div class="m" style="margin-bottom:6px">${sum(c.ps,p=>p.d)}/${sum(c.ps,p=>p.t)} h · ${c.wk} h/wk</div>`+c.ps.map(p=>`<div style="margin-bottom:5px"><div style="display:flex;justify-content:space-between;font:600 10.5px Inter"><span>${p.n}</span><span class="m">${pc(p)}%</span></div><div class="bar" style="--c:${p.c};--h:6px"><i style="width:${pc(p)}%"></i></div></div>`).join('')+`</div>`).join('')+`</div>`],
['6 · Timeline to finish',()=>`<div style="display:grid;grid-template-columns:70px 1fr;margin-top:2px"><span></span><div style="display:flex;justify-content:space-between" class="m">${['now','+6 m','+12 m','+18 m','+24 m','+30 m'].map(x=>`<span>${x}</span>`).join('')}</div></div>`+CATS.map(c=>ch(c)+c.ps.map(p=>`<div style="display:grid;grid-template-columns:70px 1fr;align-items:center;height:21px"><b style="font:600 11px Inter">${p.n}</b><div style="position:relative;height:12px;background:linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/16.66% 100%"><div class="bar" style="--c:${p.c};--h:12px;--r:6px;width:${p.m/30*100}%"><i style="width:${pc(p)}%"></i></div></div></div>`).join('')).join('')],
['7 · Waffle (1 dot = 10 h)',()=>CATS.map(c=>ch(c)+`<div class="dg" style="--s:12.5px">`+c.ps.map(p=>Array.from({length:Math.ceil(p.t/10)},(_,k)=>`<i class="${k*10<p.d?'':'e'}" style="background:${p.c}"></i>`).join('')).join('')+`</div><div class="m" style="margin-top:2px;line-height:1.4">`+c.ps.map(p=>`<span style="color:${p.c}">●</span> ${p.n} ${pc(p)}%`).join(' &nbsp; ')+`</div>`).join('')],
['8 · Bubble dots',()=>`<div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin-top:6px">`+[...ALL].sort((a,b)=>b.t-a.t).map(p=>{const z=Math.round(Math.sqrt(p.t)*6.3);return`<div style="display:flex;flex-direction:column;align-items:center;width:${z}px;text-align:center"><div class="ring" style="--c:${p.cc};--p:${pc(p)};--z:${z}px"><b style="font-size:${Math.max(8,z*.15)}px;text-align:center;line-height:1.05;padding:2px">${p.n}</b></div></div>`}).join('')+`</div>`],
['9 · Table with due date',()=>`<div style="display:grid;grid-template-columns:78px 1fr 44px 52px;gap:6px;font:600 9.5px Inter;color:var(--mu);padding:4px 0"><span>Project</span><span>Progress</span><span style="text-align:right">Hours</span><span style="text-align:right">Done by</span></div>`+CATS.map(c=>ch(c)+c.ps.map(p=>{const d=new Date(2026,10+p.m,1);return`<div style="display:grid;grid-template-columns:78px 1fr 44px 52px;gap:6px;align-items:center;height:24px;border-bottom:1px solid var(--ln)"><b style="font:600 11.5px Inter">${p.n}</b><div class="bar" style="--c:${p.c};--h:6px"><i style="width:${pc(p)}%"></i></div><span class="m" style="text-align:right">${p.d}/${p.t}</span><span class="m" style="text-align:right">${MON[(d.getMonth()+1)%12]} ${String(d.getFullYear()).slice(2)}</span></div>`}).join('')).join('')],
['10 · Stage matrix',()=>`<div style="display:grid;grid-template-columns:78px repeat(5,1fr);gap:3px 4px;margin-top:4px;align-items:center"><span></span>${['Question','Model','Story','Numerics','Submit'].map(x=>`<span class="m" style="text-align:center">${x}</span>`).join('')}`+ALL.map(p=>`<b style="font:600 11px Inter;height:25px;display:flex;align-items:center">${p.n}</b>`+p.st.map(f=>`<div class="bar" style="--c:${p.cc};--h:17px;--r:6px"><i style="width:${f*100}%"></i></div>`).join('')).join('')+`</div>`]];
document.body.innerHTML=DES.map(d=>`<section><div class="hd"><div><b>${d[0]}</b><small>Planner · ${TD}/${TT} h done</small></div><em></em></div><div class="body"></div><div class="nav"><b>Planner</b><span>Days</span><span>Booked</span><span>Settings</span></div></section>`).join('');
const ov=[];document.querySelectorAll('section').forEach((sec,i)=>{const b=sec.querySelector('.body');b.innerHTML=DES[i][1]();sec.querySelector('.hd em').textContent=b.scrollHeight>b.clientHeight+1?'overflow '+(b.scrollHeight-b.clientHeight)+'px':'fits';ov.push(sec.querySelector('.hd em').textContent)});
</script></body></html>
