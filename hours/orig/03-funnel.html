  return `<button class="pr${park?' park':''}" data-a="${o.a||'proj'}" data-p="${p.id}" style="--c:${H.col(p)}"><b>${E(H.lab(p))}</b><span class="sbar">${bar}</span><small>${Math.round(H.pLeft(p))||'✓'}</small></button>`}).join('')}</div></div>`});return h+'</div>'}
function tray(w0,o){o=o||{};let L=H.pool(w0);if(o.dl)L=L.filter(c=>c.dl).concat(L.filter(c=>!c.dl));const pk=U.pk||'',bp=pk.startsWith('b:');
 return `<div class="tray${bp?' back':''}"${bp?' data-a="back"':''}>${bp?'<span class="ib" style="background:#17181C">↩</span>':''}`+L.map(c=>`<button class="tc${pk===H.ck(c)?' on':''}${c.k==='q'?' q':''}${c.dl?' tri':''}" data-a="${o.a||'pick'}" data-v="${H.ck(c)}" style="--c:${H.col(c.p)}"><i class="k"></i><b>${E(c.n)}</b><small>${E(H.lab(c.p))} ${H.fq(c.h)}</small></button>`).join('')+'</div>'}
function oh(d){return `<div class="ohr">${H.OH().map(p=>`<button class="oc2" data-a="log" data-p="${p.id}" data-h=".25" data-d="${d}" style="--c:${H.col(p)}"><b>${E(p.name)}</b><small>${H.fq(H.hOn(d,H.fP(p.id)))} h</small><i>+</i></button>`).join('')}</div>`}
function day(d,o){o=o||{};const B=H.S.bk.filter(b=>b.d===d),Q=(H.S.qk||[]).filter(q=>(!q.at||q.at===d)&&!B.some(b=>b.q===q.id));
 const rows=B.map(b=>{const p=H.P(b.p);return `<button class="qr${b.ok?' ok':''}" data-a="tickb" data-b="${b.id}" style="--c:${H.col(p)}"><i class="k s"></i><b>${E(b.n)}</b><small>${E(H.lab(p))} <span>· ${H.fq(b.h)}h</span></small></button>`}).join('')+(o.q===false?'':Q.map(q=>{const p=H.P(q.p);return `<button class="qr${q.at?' ok':''}" data-a="qtick" data-q="${q.id}" style="--c:${H.col(p)}"><i class="k"></i><b>${E(q.n)}</b><small>${E(H.lab(p))} <span>· ${H.fq(q.h)}h</span></small></button>`}).join(''));
 return (o.oh===false?'':oh(d))+`<div class="ql">${rows||'<div class="ft2">○</div>'}</div>`}
function qin(){const p=H.P(U.qp)||H.OH()[0];return `<div class="qi"><input data-i="qn" data-enter="qadd2" placeholder="New task for ${E(p.name)}" value="${E(U.qn||'')}" aria-label="Quick task">${[.25,.5,1].map(h=>`<button data-a="qadd2" data-h="${h}">${H.fq(h)}</button>`).join('')}</div>`}
const qpill=()=>{const p=H.P(U.qp)||H.OH()[0];return `<button class="ib" data-a="qpick" style="--c:${H.col(p)}"><i></i>${E(p.name)} ▾</button>`};
function spread(tid){const f=H.findT(tid);if(!f||!f.t.dl)return 0;let need=H.left(f.t)-H.sum(H.S.bk.filter(b=>b.t===tid&&b.d>=H.td()&&!b.ok),b=>b.h),n=0;const ds=[];for(let d=H.td();d<=f.t.dl;d=H.add(d,1))if(H.dow(d)<5)ds.push(d);ds.sort((a,b)=>H.resFree(b)-H.resFree(a)||(a<b?-1:1));for(const d of ds){if(need<.25)break;const h=Math.min(2,H.rq(need));H.S.bk.push({id:H.uid(),d,h,p:f.p.id,n:f.t.n,t:tid});need-=h;n++}return n}
function bestDay(w0){const T=H.td();return [0,1,2,3,4].map(i=>H.add(w0,i)).filter(d=>d>=T).sort((a,b)=>(H.resFree(b)-H.sum(H.S.bk.filter(x=>x.d===b&&H.isRes(H.P(x.p))),x=>x.h))-(H.resFree(a)-H.sum(H.S.bk.filter(x=>x.d===a&&H.isRes(H.P(x.p))),x=>x.h)))[0]||H.nextWork(T)}
const act={
 qpick:()=>H.sheet(()=>H.shHead('Project')+`<div class="shb">${H.row10({sel:U.qp,a:'qp2'})}</div>`),
 qp2:d=>{U.qp=d.p;H.close();H.draw()},
 qadd2:d=>{const n=(U.qn||'').trim();if(!n)return H.toast('Type a task first');const p=H.P(U.qp)||H.OH()[0];U.qn='';H.act('Quick: '+n,()=>{H.S.qk.unshift({id:H.uid(),n,h:+d.h||.25,d:0,p:p.id})})},
 slot:d=>{U.sd=d.d;H.sheet(()=>H.shHead(H.fd(U.sd))+`<div class="shb">${tray(H.mon(U.sd),{a:'pto'})}</div>`)},
 pto:d=>{const c=H.cand(d.v);if(!c)return;H.close();H.act('→ '+H.fwd(U.sd)+' '+H.lab(c.p),()=>H.place(c,U.sd))},
 spread:d=>{let n=0;H.act('▲ spread',()=>{n=spread(d.t)});},
 send:d=>{const p=H.P(d.p),c=H.cur(p);if(!c)return H.toast('No open task');const day=bestDay(H.fw0());H.act('→ '+H.fwd(day)+' '+H.lab(p),()=>H.place({k:'t',id:c.t.id,p,n:c.t.n,h:H.left(c.t)},day))}};
return{hd,pills,ib,wnav,auto,wsub,week,long,plan,tray,oh,day,qin,qpill,spread,act}})();
</script><script>
H.start({key:'ho-funnel',name:'Funnel',wk:'w',tabs:[{id:'p',l:'Planner',ic:'plan'},{id:'w',l:'Days',ic:'week'},{id:'d',l:'Today',ic:'day'}],act:Object.assign({},C.act),
 render(tab){const U=H.U,T=H.td();
  if(tab==='d')return{hd:C.hd('Today',H.fd(T)),mn:C.day(T)};
  const w0=H.fw0();if(tab==='w')return{hd:C.hd('Days',C.wsub(w0),C.wnav()+C.auto()),mn:C.week(w0),ft:C.tray(w0)};
  return{hd:C.hd('Planner','tap → week '+H.wkno(w0),C.wnav()),mn:C.week(w0).replace('class="gp','class="gp mini')+C.plan({a:'send'})}}});
</script></body></html>
