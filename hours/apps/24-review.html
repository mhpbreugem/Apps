</style><script>const KEY='hours-a24';

  t:(p.st||[]).filter(s=>!s.q).flatMap(s=>(s.t||[]).filter(t=>!t.mx).map(t=>({id:t.id,n:t.n,s:s.n,h:+t.h||0,d:Math.min(+t.d||0,+t.h||0),dl:t.dl||null})))})),
 q:(o.qk||[]).filter(q=>q.d<q.h).map(q=>({id:q.id,n:q.n,h:+q.h||.25,p:q.p,dl:q.dl||null})),log:[],wk:{}}}
const SEED={bud:{Research:14,Teaching:12,'Chair & Admin':10,Personal:4},p:[

 {id:'b',name:'TSI',cat:'Research',c:'#3E9E62',st:[{n:'Question',t:[{id:'b1',n:'Set up the economy',h:20,d:0}]}]},
 {id:'c',name:'BT',cat:'Teaching',c:'#C8682F',st:[{n:'Prepare',t:[{id:'c1',n:'Plan the sessions',h:8,d:2,dl:'2026-12-04'},{id:'c2',n:'Slides',h:16,d:0}]}]},
 {id:'d',name:'Recruitment',cat:'Chair & Admin',c:'#2F6FB5',st:[{n:'Profile',t:[{id:'d1',n:'Profile',h:3,d:0}]}]},
 {id:'e',name:'Admin',cat:'Chair & Admin',c:'#8E9096',er:1,st:[]},{id:'f',name:'Sport',cat:'Personal',c:'#7C8B7A',st:[{n:'Ongoing',t:[{id:'f1',n:'Training',h:100,d:0}]}]}],
 qk:[{id:'q1',n:'Reply to Linda',h:.25,d:0,p:'e'},{id:'q2',n:'Sign contracts',h:.5,d:0,p:'e'}]};
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}try{const o=localStorage.getItem(OLD);if(o)return fromOld(JSON.parse(o))}catch(e){}return fromOld(SEED)})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let UH=[];const snap=()=>{UH.push(JSON.stringify(S));if(UH.length>40)UH.shift()};
const P=id=>S.p.find(p=>p.id===id),left=p=>sum(p.t,t=>t.h-t.d),doneP=p=>sum(p.t,t=>t.d),cur=p=>p.t.find(t=>t.d<t.h);
const pDL=p=>p.t.filter(t=>t.d<t.h&&t.dl).map(t=>t.dl).sort()[0]||(left(p)>0?p.dl:null);
function logH(pid,h,qid){const p=P(pid);if(!p)return;S.log.push({d:td(),p:pid,h,q:qid||undefined});let r=h;
 if(h>0){for(const t of p.t){if(r<=0)break;const k=Math.min(r,t.h-t.d);t.d+=k;r-=k}}
 else{r=-h;for(let i=p.t.length-1;i>=0&&r>0;i--){const t=p.t[i],k=Math.min(r,t.d);t.d-=k;r-=k}}}
const wk0=()=>iso(mon(new Date()));
const doneWk=f=>sum(S.log.filter(l=>l.d>=wk0()&&f(l)),l=>l.h);
const dots=(c,h,d,sz)=>{let o='';const n=Math.ceil(h-1e-9);for(let i=0;i<n;i++){const f=Math.max(0,Math.min(1,d-i)),cap=Math.min(1,h-i);o+='<i class="dt" style="--c:'+c+';--s:'+(sz||14)+'px;'+(cap<1?'transform:scale(.8);':'')+(f>=cap?'background:'+c:f>0?'background:conic-gradient('+c+' 0 '+(f*100)+'%,transparent 0)':'')+'"></i>'}return o};

const openP=()=>S.p.filter(p=>!p.er&&left(p)>0);

<style>
:root{--bg:#F1F4F8;--hd:#F1F4F8;--hf:#16202E;--hs:#66738A;--hbb:#16202e12;--ink:#16202E;--mu:#66738A}

<script>
const U={s:0};S.plan=S.plan||{};
const lastWk=()=>{const a=iso(addD(mon(new Date()),-7)),b=wk0();return S.log.filter(l=>l.d>=a&&l.d<b&&P(l.p))};
const CC={Research:'#2E7D4F',Teaching:'#C8682F','Chair & Admin':'#2F6FB5',Personal:'#7C8B7A'};
function plan(){const k=wk0();if(!S.plan[k]){const o={};CATS.forEach(c=>{const ps=openP().filter(p=>p.cat===c),b=+S.bud[c]||0;ps.forEach((p,i)=>o[p.id]=Math.floor(b/ps.length)+(i<b%ps.length?1:0))});S.plan[k]=o}return S.plan[k]}
function draw(){const s=U.s,N=4;$('hd').innerHTML='<div class="tt"><h1>Weekly review</h1><small>Week '+wkNo(new Date())+' · four short steps</small></div>'+undoB();
 let h='<div class="stp">'+[0,1,2,3].map(i=>'<i class="'+(i<=s?'on':'')+'"></i>').join('')+'</div>';
 if(s===0){const L=lastWk(),tot=sum(L,l=>l.h),bud=sum(CATS,c=>+S.bud[c]||0);h+='<h2 class="t">How did last week go?</h2><div class="sub">'+qf(tot)+' of '+bud+' hours</div>'+CATS.map(c=>{const a=sum(L.filter(l=>P(l.p).cat===c),l=>l.h),b=+S.bud[c]||0;return '<div class="cr" style="--c:'+CC[c]+'"><b>'+esc(c)+'</b><em class="'+(a<b*.8?'u':a>=b?'o':'')+'">'+qf(a)+' / '+b+'</em><div class="br"><i style="width:'+Math.min(100,b?a/b*100:0)+'%"></i></div></div>'}).join('')}
 if(s===1){const T=pd(td()),L=[];S.p.forEach(p=>{p.t.forEach(t=>{if(t.dl&&t.d<t.h){const d=(pd(t.dl)-T)/864e5;if(d<=21)L.push({p,t,d})}});});L.sort((a,b)=>a.d-b.d);
  h+='<h2 class="t">What is due soon?</h2><div class="sub">▲ deadlines in the next three weeks</div>'+(L.map(x=>'<div class="dl"><span class="n" style="color:'+(x.d<0?'#C0532A':x.p.c)+'">'+Math.round(x.d)+'<small>days</small></span><b>'+esc(x.t.n)+'<small>'+esc(x.p.n)+' · '+qf(x.t.h-x.t.d)+' h left · ▲ '+fdt(x.t.dl)+'</small></b></div>').join('')||'<div class="sub">Nothing due. Good moment for deep work.</div>')}
 if(s===2){const P_=plan();h+='<h2 class="t">Plan this week</h2><div class="sub">'+sum(Object.values(P_))+' hours planned · budget '+sum(CATS,c=>+S.bud[c]||0)+'</div>'+openP().map(p=>'<div class="pl" style="--c:'+p.c+'"><i></i><b>'+esc(p.n)+'</b><button data-a="pm" data-p="'+p.id+'" data-k="-1">−</button><em>'+(P_[p.id]||0)+'</em><button data-a="pm" data-p="'+p.id+'" data-k="1">+</button></div>').join('')}
 if(s===3){const P_=plan(),top=Object.entries(P_).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);h+='<h2 class="t">Your week</h2><div class="big">'+sum(Object.values(P_))+' h</div><div class="sub" style="margin-top:6px">Focus on</div>'+top.slice(0,5).map(([id,v])=>{const p=P(id);return '<div class="dl"><span class="n" style="color:'+p.c+'">'+v+'<small>hours</small></span><b>'+esc(p.n)+'<small>'+esc(cur(p).n)+'</small></b></div>'}).join('')+'<div class="sub" style="margin-top:10px">Done this week so far: '+qf(doneWk(()=>1))+' h</div>'}
 h+='<div class="nav"><button class="g" data-a="bk"'+(s?'':' disabled style="opacity:.4"')+'>Back</button><button data-a="nx">'+(s<N-1?'Next':'Start again')+'</button></div>';
 $('mn').innerHTML=h;save()}
bind({nx(){U.s=U.s<3?U.s+1:0;draw()},bk(){if(U.s)U.s--;draw()},pm(e){snap();const P_=plan();P_[e.dataset.p]=Math.max(0,(P_[e.dataset.p]||0)+ +e.dataset.k);draw()}});

</script>
