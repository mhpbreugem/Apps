</style><script>const KEY='hours-a02';

 q:(o.qk||[]).filter(q=>q.d<q.h).map(q=>({id:q.id,n:q.n,h:+q.h||.25,p:q.p,dl:q.dl||null})),log:[],wk:{}}}

 {id:'b',name:'TSI',cat:'Research',c:'#3E9E62',st:[{n:'Question',t:[{id:'b1',n:'Set up the economy',h:20,d:0}]}]},
 {id:'c',name:'BT',cat:'Teaching',c:'#C8682F',st:[{n:'Prepare',t:[{id:'c1',n:'Plan the sessions',h:8,d:2,dl:'2026-12-04'},{id:'c2',n:'Slides',h:16,d:0}]}]},
 {id:'d',name:'Recruitment',cat:'Chair & Admin',c:'#2F6FB5',st:[{n:'Profile',t:[{id:'d1',n:'Profile',h:3,d:0}]}]},
 {id:'e',name:'Admin',cat:'Chair & Admin',c:'#8E9096',er:1,st:[]},{id:'f',name:'Sport',cat:'Personal',c:'#7C8B7A',st:[{n:'Ongoing',t:[{id:'f1',n:'Training',h:100,d:0}]}]}],
 qk:[{id:'q1',n:'Reply to Linda',h:.25,d:0,p:'e'},{id:'q2',n:'Sign contracts',h:.5,d:0,p:'e'}]};
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}try{const o=localStorage.getItem(OLD);if(o)return fromOld(JSON.parse(o))}catch(e){}return fromOld(SEED)})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const pDL=p=>p.t.filter(t=>t.d<t.h&&t.dl).map(t=>t.dl).sort()[0]||(left(p)>0?p.dl:null);

 else{r=-h;for(let i=p.t.length-1;i>=0&&r>0;i--){const t=p.t[i],k=Math.min(r,t.d);t.d-=k;r-=k}}}

<script>
const U={off:0,c:null};
const days=()=>{const m=addD(mon(new Date()),7*U.off);return [0,1,2,3,4,5,6].map(i=>iso(addD(m,i)))};
const val=(p,d)=>sum(S.log.filter(l=>l.p===p&&l.d===d),l=>l.h);
function addAt(p,d,h){if(h<0)h=-Math.min(-h,val(p,d));if(!h)return;logH(p,h);S.log[S.log.length-1].d=d}
function draw(){const ds=days(),T=td(),ps=S.p.filter(p=>!p.er||S.log.some(l=>l.p===p.id));
 $('hd').innerHTML='<button class="hb" data-a="wk" data-k="-1">‹</button><div class="tt" style="text-align:center"><h1>Week '+wkNo(pd(ds[0]))+'</h1><small>'+fdt(ds[0])+' – '+fdt(ds[6])+' · timesheet</small></div>'+undoB()+'<button class="hb" data-a="wk" data-k="1">›</button>';
 let h='<table><tr><th class="d">day</th>'+ps.map(p=>'<th class="c" style="--c:'+p.c+'">'+esc(p.n.slice(0,5))+'</th>').join('')+'<th>Σ</th></tr>';
 ds.forEach((d,i)=>{h+='<tr><td class="d'+(d===T?' to':'')+'">'+WD[i].slice(0,2)+' '+pd(d).getDate()+'</td>'+ps.map(p=>{const v=val(p.id,d),k=p.id+'|'+d;return '<td class="v'+(d===T?' to':'')+(U.c===k?' on':'')+'" data-a="cell" data-k="'+k+'" style="--c:'+p.c+'">'+(v?'<b>'+qf(v)+'</b>':'·')+'</td>'}).join('')+'<td><b>'+(qf(sum(ps,p=>val(p.id,d)))||'·')+'</b></td></tr>'});
 h+='<tr class="tot"><td class="d">Σ</td>'+ps.map(p=>'<td>'+(qf(sum(ds,d=>val(p.id,d)))||'·')+'</td>').join('')+'<td>'+qf(sum(ds,d=>sum(ps,p=>val(p.id,d))))+'</td></tr></table>';
 const sel=U.c&&U.c.split('|');h+='<div class="info">'+(sel?'> '+esc(P(sel[0]).n)+' · '+fdt(sel[1])+' = '+qf(val(sel[0],sel[1]))+' h':'> tap a cell, then add hours')+' · target '+sum(CATS,c=>+S.bud[c]||0)+' h/wk</div>';
 h+='<div class="pad">'+[['−1','-1'],['−¼','-.25'],['+¼','.25'],['+½','.5'],['+1','1'],['+2','2']].map(([l,v])=>'<button class="'+(+v>0?'k':'')+'" data-a="add" data-v="'+v+'">'+l+'</button>').join('')+'</div>';
 $('mn').innerHTML=h;save()}
