<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Hours · Scoreboard</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

</style><script>const KEY='hours-a11';
const OLD='hours-v4',CATS=['Research','Teaching','Chair & Admin','Personal'];
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9),sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},td=()=>iso(new Date());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fdt=s=>{const d=pd(s);return d.getDate()+' '+MO[d.getMonth()]};
const qf=x=>{x=Math.round((+x||0)*4)/4;const w=Math.floor(x),f=x-w,q=f===.25?'¼':f===.5?'½':f===.75?'¾':'';return (w||!q?w:'')+q};
const wkNo=d=>{const t=new Date(d);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)};
function fromOld(o){return{v:1,bud:Object.assign({Research:14,Teaching:12,'Chair & Admin':10,Personal:4},o.bud||{}),
 p:(o.p||[]).filter(p=>!p.dt).map(p=>({id:p.id,n:p.name,c:p.c||'#111',cat:CATS.includes(p.cat)?p.cat:'Personal',er:!!p.er,dl:p.aim||null,w:2,
  t:(p.st||[]).filter(s=>!s.q).flatMap(s=>(s.t||[]).filter(t=>!t.mx).map(t=>({id:t.id,n:t.n,s:s.n,h:+t.h||0,d:Math.min(+t.d||0,+t.h||0),dl:t.dl||null})))})),
 q:(o.qk||[]).filter(q=>q.d<q.h).map(q=>({id:q.id,n:q.n,h:+q.h||.25,p:q.p,dl:q.dl||null})),log:[],wk:{}}}
const SEED={bud:{Research:14,Teaching:12,'Chair & Admin':10,Personal:4},p:[
 {id:'a',name:'MIZN',cat:'Research',c:'#2E7D4F',aim:'2027-03-01',st:[{n:'Question',t:[{id:'a1',n:'Write the claim in one sentence',h:10,d:3}]},{n:'Model',t:[{id:'a2',n:'Set up the economy',h:17,d:0},{id:'a3',n:'Solve the baseline',h:17,d:0}]}]},
 {id:'b',name:'TSI',cat:'Research',c:'#3E9E62',st:[{n:'Question',t:[{id:'b1',n:'Set up the economy',h:20,d:0}]}]},
 {id:'c',name:'BT',cat:'Teaching',c:'#C8682F',st:[{n:'Prepare',t:[{id:'c1',n:'Plan the sessions',h:8,d:2,dl:'2026-12-04'},{id:'c2',n:'Slides',h:16,d:0}]}]},
 {id:'d',name:'Recruitment',cat:'Chair & Admin',c:'#2F6FB5',st:[{n:'Profile',t:[{id:'d1',n:'Profile',h:3,d:0}]}]},
 {id:'e',name:'Admin',cat:'Chair & Admin',c:'#8E9096',er:1,st:[]},{id:'f',name:'Sport',cat:'Personal',c:'#7C8B7A',st:[{n:'Ongoing',t:[{id:'f1',n:'Training',h:100,d:0}]}]}],
 qk:[{id:'q1',n:'Reply to Linda',h:.25,d:0,p:'e'},{id:'q2',n:'Sign contracts',h:.5,d:0,p:'e'}]};
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}try{const o=localStorage.getItem(OLD);if(o)return fromOld(JSON.parse(o))}catch(e){}return fromOld(SEED)})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let UH=[];const snap=()=>{UH.push(JSON.stringify(S));if(UH.length>40)UH.shift()};
const P=id=>S.p.find(p=>p.id===id),left=p=>sum(p.t,t=>t.h-t.d),doneP=p=>sum(p.t,t=>t.d),cur=p=>p.t.find(t=>t.d<t.h);
const pDL=p=>p.t.filter(t=>t.d<t.h&&t.dl).map(t=>t.dl).sort()[0]||(left(p)>0?p.dl:null);
function logH(pid,h,qid){const p=P(pid);if(!p)return;S.log.push({d:td(),p:pid,h,q:qid||undefined});let r=h;
 if(h>0){for(const t of p.t){if(r<=0)break;const k=Math.min(r,t.h-t.d);t.d+=k;r-=k}}
 else{r=-h;for(let i=p.t.length-1;i>=0&&r>0;i--){const t=p.t[i],k=Math.min(r,t.d);t.d-=k;r-=k}}}
const wk0=()=>iso(mon(new Date()));
const doneWk=f=>sum(S.log.filter(l=>l.d>=wk0()&&f(l)),l=>l.h);
const dots=(c,h,d,sz)=>{let o='';const n=Math.ceil(h-1e-9);for(let i=0;i<n;i++){const f=Math.max(0,Math.min(1,d-i)),cap=Math.min(1,h-i);o+='<i class="dt" style="--c:'+c+';--s:'+(sz||14)+'px;'+(cap<1?'transform:scale(.8);':'')+(f>=cap?'background:'+c:f>0?'background:conic-gradient('+c+' 0 '+(f*100)+'%,transparent 0)':'')+'"></i>'}return o};
let TT;function toast(t){const x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>x.classList.remove('on'),1600)}
function open(h){$('shi').innerHTML=h;$('sh').classList.add('on')}function close(){$('sh').classList.remove('on')}
const undoB=()=>'<button class="hb" data-a="undo" aria-label="Undo"'+(UH.length?'':' disabled')+'>↶</button>';
const baseA={undo(){if(!UH.length)return;S=JSON.parse(UH.pop());draw()}};
function bind(A){A=Object.assign({},baseA,A);document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b,e);else if(e.target.id==='sh')close()});return A}
const openP=()=>S.p.filter(p=>!p.er&&left(p)>0);
const pName=p=>p?p.n:'?';
</script></head><body>
<style>

<script>
const wkSum=(w,f)=>{const a=iso(addD(mon(new Date()),-7*w)),b=iso(addD(mon(new Date()),-7*w+7));return sum(S.log.filter(l=>l.d>=a&&l.d<b&&f(l)),l=>l.h)};
function draw(){const bud=sum(CATS,c=>+S.bud[c]||0),wk=wkSum(0,()=>1);
 $('hd').innerHTML='<div class="tt"><h1>Scoreboard</h1><small>Week '+wkNo(new Date())+' · beat your weekly target</small></div>'+undoB();
 let hs='';for(let w=6;w>=1;w--){const v=wkSum(w,()=>1);hs+='<i class="'+(v>=bud?'w':v>0?'l':'')+'">'+(v>=bud?'W':v>0?'L':'–')+'</i>'}
 let h='<div class="sb"><small>Hours this week</small><div class="big">'+qf(wk)+'<span>/'+bud+'</span></div><small>Last six weeks</small><div class="hist">'+hs+'</div></div>';
 CATS.forEach(c=>{const b=+S.bud[c]||0,v=wkSum(0,l=>P(l.p)&&P(l.p).cat===c),ps=S.p.filter(p=>p.cat===c);
  h+='<div class="tm"><h3>'+esc(c)+'<span>'+qf(v)+' / '+b+'</span></h3><div class="br"><i style="width:'+Math.min(100,b?v/b*100:0)+'%"></i></div>'+ps.map((p,i)=>{const pv=wkSum(0,l=>l.p===p.id);return '<div class="pl"><span class="no" style="--c:'+p.c+'">'+(i+1)+'</span><b>'+esc(p.n)+'<small>'+(cur(p)&&!p.er?esc(cur(p).n):'')+'</small></b><em>'+qf(pv)+'</em><button data-a="sc" data-p="'+p.id+'">+1</button></div>'}).join('')+'</div>'});
 $('mn').innerHTML=h+'<div class="ver">Hours · Scoreboard</div>';save()}
bind({sc(e){snap();logH(e.dataset.p,1);toast('Score! +1 h '+P(e.dataset.p).n);draw()}});
