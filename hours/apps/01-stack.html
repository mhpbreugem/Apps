<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Hours · Stack</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#F7F6F2;--ink:#17181C;--mu:#6B6C72;--ln:#E4E2DC;--sf:#fff;--ch:#EEECE6;--hl:#FFF1A8;--top:max(env(safe-area-inset-top),38px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 14px/1.35 var(--ff,Inter),system-ui,sans-serif;font-feature-settings:'tnum' 1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}input{font:inherit}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
header{background:var(--hd,#17181C);color:var(--hf,#fff);padding:var(--top) 14px 12px;display:flex;align-items:flex-end;gap:8px;flex:none}
header .tt{flex:1;min-width:0}header h1{margin:0;font:var(--hw,800) 22px/1.1 var(--hff,Inter);letter-spacing:-.02em}header small{display:block;color:var(--hs,#ffffff99);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{height:34px;min-width:34px;padding:0 10px;border-radius:var(--hr,10px);background:var(--hbb,#ffffff24);color:var(--hf,#fff);font-weight:700;font-size:13px;flex:none}.hb:disabled{opacity:.3}
main{flex:1;overflow:auto;padding:10px 14px 40px}
.dt{display:inline-block;width:var(--s);height:var(--s);border-radius:50%;box-shadow:inset 0 0 0 2px var(--c);vertical-align:middle;margin:1px}
.sq{display:inline-block;border-radius:24%}
.gh{font:700 11.5px Inter;color:var(--mu);margin:18px 0 6px}
.tri{font-size:10px}.late{color:#C8402A}
#sh{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}#sh.on{display:flex}
#shi{background:var(--sf);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
#shi h2{margin:0;font:800 18px Inter}#shi .m{color:var(--mu);font-size:12.5px}
.btn{display:block;width:100%;height:46px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;margin-top:8px}.btn.g{background:var(--ch);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#17181C;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap}#toast.on{opacity:1}
.ver{text-align:center;color:#bbb;font-size:11px;margin-top:22px}
</style><script>const KEY='hours-a01';
const OLD='hours-v4',CATS=['Research','Teaching','Chair & Admin','Personal'];
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9),sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},td=()=>iso(new Date());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fdt=s=>{const d=pd(s);return d.getDate()+' '+MO[d.getMonth()]};
const qf=x=>{x=Math.round((+x||0)*4)/4;const w=Math.floor(x),f=x-w,q=f===.25?'¼':f===.5?'½':f===.75?'¾':'';return (w||!q?w:'')+q};
const wkNo=d=>{const t=new Date(d);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)};
function fromOld(o){return{v:1,bud:Object.assign({Research:14,Teaching:12,'Chair & Admin':10,Personal:4},o.bud||{}),
 p:(o.p||[]).filter(p=>!p.dt).map(p=>({id:p.id,n:p.name,c:p.c||'#111',cat:CATS.includes(p.cat)?p.cat:'Personal',er:!!p.er,dl:p.aim||null,w:2,
  t:(p.st||[]).filter(s=>!s.q).flatMap(s=>(s.t||[]).filter(t=>!t.mx).map(t=>({id:t.id,n:t.n,s:s.n,h:+t.h||0,d:Math.min(+t.d||0,+t.h||0),dl:t.dl||null})))})),
 q:(o.qk||[]).filter(q=>q.d<q.h).map(q=>({id:q.id,n:q.n,h:+q.h||.25,p:q.p,dl:q.dl||null})),log:[],wk:{}}}
const SEED={bud:{Research:14,Teaching:12,'Chair & Admin':10,Personal:4},p:[
 {id:'a',name:'MIZN',cat:'Research',c:'#2E7D4F',aim:'2027-03-01',st:[{n:'Question',t:[{id:'a1',n:'Write the claim in one sentence',h:10,d:3}]},{n:'Model',t:[{id:'a2',n:'Set up the economy',h:17,d:0},{id:'a3',n:'Solve the baseline',h:17,d:0}]}]},
 {id:'b',name:'TSI',cat:'Research',c:'#3E9E62',st:[{n:'Question',t:[{id:'b1',n:'Set up the economy',h:20,d:0}]}]},
 {id:'c',name:'BT',cat:'Teaching',c:'#C8682F',st:[{n:'Prepare',t:[{id:'c1',n:'Plan the sessions',h:8,d:2,dl:'2026-12-04'},{id:'c2',n:'Slides',h:16,d:0}]}]},
 {id:'d',name:'Recruitment',cat:'Chair & Admin',c:'#2F6FB5',st:[{n:'Profile',t:[{id:'d1',n:'Profile',h:3,d:0}]}]},
 {id:'e',name:'Admin',cat:'Chair & Admin',c:'#8E9096',er:1,st:[]},{id:'f',name:'Sport',cat:'Personal',c:'#7C8B7A',st:[{n:'Ongoing',t:[{id:'f1',n:'Training',h:100,d:0}]}]}],
 qk:[{id:'q1',n:'Reply to Linda',h:.25,d:0,p:'e'},{id:'q2',n:'Sign contracts',h:.5,d:0,p:'e'}]};
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}try{const o=localStorage.getItem(OLD);if(o)return fromOld(JSON.parse(o))}catch(e){}return fromOld(SEED)})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let UH=[];const snap=()=>{UH.push(JSON.stringify(S));if(UH.length>40)UH.shift()};
const P=id=>S.p.find(p=>p.id===id),left=p=>sum(p.t,t=>t.h-t.d),doneP=p=>sum(p.t,t=>t.d),cur=p=>p.t.find(t=>t.d<t.h);
const pDL=p=>p.t.filter(t=>t.d<t.h&&t.dl).map(t=>t.dl).sort()[0]||(left(p)>0?p.dl:null);
function logH(pid,h,qid){const p=P(pid);if(!p)return;S.log.push({d:td(),p:pid,h,q:qid||undefined});let r=h;
 if(h>0){for(const t of p.t){if(r<=0)break;const k=Math.min(r,t.h-t.d);t.d+=k;r-=k}}
 else{r=-h;for(let i=p.t.length-1;i>=0&&r>0;i--){const t=p.t[i],k=Math.min(r,t.d);t.d-=k;r-=k}}}
const wk0=()=>iso(mon(new Date()));
const doneWk=f=>sum(S.log.filter(l=>l.d>=wk0()&&f(l)),l=>l.h);
const dots=(c,h,d,sz)=>{let o='';const n=Math.ceil(h-1e-9);for(let i=0;i<n;i++){const f=Math.max(0,Math.min(1,d-i)),cap=Math.min(1,h-i);o+='<i class="dt" style="--c:'+c+';--s:'+(sz||14)+'px;'+(cap<1?'transform:scale(.8);':'')+(f>=cap?'background:'+c:f>0?'background:conic-gradient('+c+' 0 '+(f*100)+'%,transparent 0)':'')+'"></i>'}return o};
let TT;function toast(t){const x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>x.classList.remove('on'),1600)}
function open(h){$('shi').innerHTML=h;$('sh').classList.add('on')}function close(){$('sh').classList.remove('on')}
const undoB=()=>'<button class="hb" data-a="undo" aria-label="Undo"'+(UH.length?'':' disabled')+'>↶</button>';
const baseA={undo(){if(!UH.length)return;S=JSON.parse(UH.pop());draw()}};
function bind(A){A=Object.assign({},baseA,A);document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b,e);else if(e.target.id==='sh')close()});return A}
const openP=()=>S.p.filter(p=>!p.er&&left(p)>0);
const pName=p=>p?p.n:'?';
</script></head><body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap');
:root{--bg:#EFE8DA;--hd:#EFE8DA;--hf:#2A2418;--hs:#7A6F58;--hbb:#2A241814;--hff:Fraunces;--ink:#2A2418;--mu:#7A6F58}
main{display:flex;flex-direction:column;align-items:center;padding:16px 18px 30px}
.deck{position:relative;width:100%;height:380px;margin-top:6px}
.cd{position:absolute;inset:0;background:#FFFCF5;border-radius:26px;box-shadow:0 1px 0 #0000000d,0 10px 30px #2a241826;padding:22px 22px 18px;display:flex;flex-direction:column;border-top:10px solid var(--c);transition:transform .25s}
.cd.b1{transform:translateY(14px) scale(.95);opacity:.8;z-index:0}.cd.b2{transform:translateY(26px) scale(.9);opacity:.5;z-index:-1}.cd.t{z-index:1}
.cd .pj{font:700 13px Inter;color:var(--c)}.cd .st{color:var(--mu);font-size:12.5px;margin-top:2px}
.cd h2{font:800 30px/1.08 Fraunces,serif;margin:14px 0 12px;letter-spacing:-.01em}
.cd .dl{font-weight:600;font-size:13px;margin-top:auto}
.cd .dts{line-height:0}
.btns{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;width:100%;margin-top:40px}
.btns button{height:60px;border-radius:30px;font:800 15px Inter;background:#FFFCF5;box-shadow:0 2px 8px #2a24181a}
.btns .main{background:#2A2418;color:#FFFCF5;font-size:17px}
.cnt{margin-top:16px;color:var(--mu);font-size:12.5px;text-align:center}
</style>
<div id="app"><header id="hd"></header><main id="mn"></main></div>
<script>
let ORD=null;
function order(){const T=td();const L=openP().map(p=>{const dl=pDL(p),days=dl?(pd(dl)-pd(T))/864e5:999,b=+S.bud[p.cat]||0,need=b?(b-doneWk(l=>P(l.p)&&P(l.p).cat===p.cat))/b:0;return{p,s:need*10+(days<30?30-days:0)}}).sort((a,b)=>b.s-a.s).map(x=>x.p.id);
 if(!ORD)ORD=L;else{ORD=ORD.filter(id=>L.includes(id));L.forEach(id=>{if(!ORD.includes(id))ORD.push(id)})}return ORD}
function card(p,cls){const t=cur(p),dl=pDL(p);return '<div class="cd '+cls+'" style="--c:'+p.c+'"><div class="pj">'+esc(p.n)+'</div><div class="st">'+esc(t.s)+' · '+qf(t.h-t.d)+' of '+qf(t.h)+' h left</div><h2>'+esc(t.n)+'</h2><div class="dts">'+dots(p.c,Math.min(t.h,30),Math.min(t.d,30),15)+'</div><div class="dl">'+(dl?'<span class="tri">▲</span> '+fdt(dl):'No deadline')+' · '+qf(left(p))+' h in project</div></div>'}
function draw(){const o=order(),T=td(),dT=sum(S.log.filter(l=>l.d===T&&l.h>0),l=>l.h);
 $('hd').innerHTML='<div class="tt"><h1>Stack</h1><small>'+qf(dT)+' h today · one card at a time</small></div>'+undoB();
 if(!o.length){$('mn').innerHTML='<div class="cnt">The stack is empty. Everything is done.</div>';return save()}
 const ps=o.slice(0,3).map(P);
 $('mn').innerHTML='<div class="deck">'+ps.map((p,i)=>card(p,['t','b1','b2'][i])).reverse().join('')+'</div><div class="btns"><button data-a="later">Later</button><button class="main" data-a="did">Did 1 hour</button><button data-a="fin">Task done</button></div><div class="cnt">Card 1 of '+o.length+' · Later puts it at the bottom of the stack</div><div class="ver">Hours · Stack</div>';save()}
bind({later(){ORD.push(ORD.shift());draw()},did(){snap();const id=ORD[0];logH(id,1);toast('+1 h '+P(id).n);draw()},
 fin(){snap();const p=P(ORD[0]),t=cur(p);logH(p.id,t.h-t.d);toast('Task done');ORD.push(ORD.shift());draw()}});
draw();
</script>
<div id="sh"><div id="shi"></div></div><div id="toast"></div></body></html>
