<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#17181C"><title>Hours · River</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#F7F6F2;--ink:#17181C;--mu:#6B6C72;--ln:#E4E2DC;--sf:#fff;--ch:#EEECE6;--hl:#FFF1A8;--top:max(env(safe-area-inset-top),38px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 14px/1.35 Inter,system-ui,sans-serif;font-feature-settings:'tnum' 1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}input{font:inherit}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
header{background:#17181C;color:#fff;padding:var(--top) 14px 12px;display:flex;align-items:flex-end;gap:8px;flex:none}
header .tt{flex:1;min-width:0}header h1{margin:0;font:800 22px/1.1 Inter;letter-spacing:-.02em}header small{display:block;color:#ffffff99;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{height:34px;min-width:34px;padding:0 10px;border-radius:10px;background:#ffffff24;color:#fff;font-weight:700;font-size:13px;flex:none}.hb:disabled{opacity:.3}
main{flex:1;overflow:auto;padding:10px 14px 40px}
.dt{display:inline-block;width:var(--s);height:var(--s);border-radius:50%;box-shadow:inset 0 0 0 2px var(--c);vertical-align:middle;margin:1px}
.sq{display:inline-block;border-radius:24%}
.gh{font:700 11.5px Inter;color:var(--mu);margin:18px 0 6px}
.tri{font-size:10px}.late{color:#C8402A}
#sh{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}#sh.on{display:flex}
#shi{background:var(--sf);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
#shi h2{margin:0;font:800 18px Inter}#shi .m{color:var(--mu);font-size:12.5px}
.btn{display:block;width:100%;height:46px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;margin-top:8px}.btn.g{background:var(--ch);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#17181C;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap}#toast.on{opacity:1}
.ver{text-align:center;color:#bbb;font-size:11px;margin-top:22px}
</style><script>const KEY='hours-river';
const OLD='hours-v4',CATS=['Research','Teaching','Chair & Admin','Personal'];
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9),sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},td=()=>iso(new Date());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fdt=s=>{const d=pd(s);return d.getDate()+' '+MO[d.getMonth()]};
const qf=x=>{x=Math.round((+x||0)*4)/4;const w=Math.floor(x),f=x-w,q=f===.25?'¼':f===.5?'½':f===.75?'¾':'';return (w||!q?w:'')+q};
const wkNo=d=>{const t=new Date(d);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)};
function fromOld(o){return{v:1,bud:Object.assign({Research:14,Teaching:12,'Chair & Admin':10,Personal:4},o.bud||{}),
 p:(o.p||[]).filter(p=>!p.dt).map(p=>({id:p.id,n:p.name,c:p.c||'#111',cat:CATS.includes(p.cat)?p.cat:'Personal',er:!!p.er,dl:p.aim||null,w:2,
  t:(p.st||[]).filter(s=>!s.q).flatMap(s=>(s.t||[]).filter(t=>!t.mx).map(t=>({id:t.id,n:t.n,s:s.n,h:+t.h||0,d:Math.min(+t.d||0,+t.h||0),dl:t.dl||null})))})),
 q:(o.qk||[]).filter(q=>q.d<q.h).map(q=>({id:q.id,n:q.n,h:+q.h||.25,p:q.p,dl:q.dl||null})),log:[],wk:{}}}
const SEED={bud:{Research:14,Teaching:12,'Chair & Admin':10,Personal:4},p:[
 {id:'a',name:'MIZN',cat:'Research',c:'#2E7D4F',aim:'2027-03-01',st:[{n:'Question',t:[{id:'a1',n:'Write the claim in one sentence',h:10,d:3}]},{n:'Model',t:[{id:'a2',n:'Set up the economy',h:17,d:0},{id:'a3',n:'Solve the baseline',h:17,d:0}]}]},
 {id:'b',name:'TSI',cat:'Research',c:'#3E9E62',st:[{n:'Question',t:[{id:'b1',n:'Set up the economy',h:20,d:0}]}]},
 {id:'c',name:'BT',cat:'Teaching',c:'#C8682F',st:[{n:'Prepare',t:[{id:'c1',n:'Plan the sessions',h:8,d:2,dl:'2026-12-04'},{id:'c2',n:'Slides',h:16,d:0}]}]},
 {id:'d',name:'Recruitment',cat:'Chair & Admin',c:'#2F6FB5',st:[{n:'Profile',t:[{id:'d1',n:'Profile',h:3,d:0}]}]},
 {id:'e',name:'Admin',cat:'Chair & Admin',c:'#8E9096',er:1,st:[]},{id:'f',name:'Sport',cat:'Personal',c:'#7C8B7A',st:[{n:'Ongoing',t:[{id:'f1',n:'Training',h:100,d:0}]}]}],
 qk:[{id:'q1',n:'Reply to Linda',h:.25,d:0,p:'e'},{id:'q2',n:'Sign contracts',h:.5,d:0,p:'e'}]};
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}try{const o=localStorage.getItem(OLD);if(o)return fromOld(JSON.parse(o))}catch(e){}return fromOld(SEED)})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let UH=[];const snap=()=>{UH.push(JSON.stringify(S));if(UH.length>40)UH.shift()};
const P=id=>S.p.find(p=>p.id===id),left=p=>sum(p.t,t=>t.h-t.d),doneP=p=>sum(p.t,t=>t.d),cur=p=>p.t.find(t=>t.d<t.h);
const pDL=p=>p.t.filter(t=>t.d<t.h&&t.dl).map(t=>t.dl).sort()[0]||(left(p)>0?p.dl:null);
function logH(pid,h,qid){const p=P(pid);if(!p)return;S.log.push({d:td(),p:pid,h,q:qid||undefined});let r=h;
 if(h>0){for(const t of p.t){if(r<=0)break;const k=Math.min(r,t.h-t.d);t.d+=k;r-=k}}
 else{r=-h;for(let i=p.t.length-1;i>=0&&r>0;i--){const t=p.t[i],k=Math.min(r,t.d);t.d-=k;r-=k}}}
const wk0=()=>iso(mon(new Date()));
const doneWk=f=>sum(S.log.filter(l=>l.d>=wk0()&&f(l)),l=>l.h);
const dots=(c,h,d,sz)=>{let o='';const n=Math.ceil(h-1e-9);for(let i=0;i<n;i++){const f=Math.max(0,Math.min(1,d-i)),cap=Math.min(1,h-i);o+='<i class="dt" style="--c:'+c+';--s:'+(sz||14)+'px;'+(cap<1?'transform:scale(.8);':'')+(f>=cap?'background:'+c:f>0?'background:conic-gradient('+c+' 0 '+(f*100)+'%,transparent 0)':'')+'"></i>'}return o};
let TT;function toast(t){const x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>x.classList.remove('on'),1600)}
function open(h){$('shi').innerHTML=h;$('sh').classList.add('on')}function close(){$('sh').classList.remove('on')}
</script></head><body>
<style>
main{padding:6px 0 40px}
.rv{display:grid;grid-template-columns:58px repeat(16,1fr);align-items:center}
.wh{font:700 9.5px Inter;color:var(--mu);text-align:center;height:26px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.wh.mo{color:var(--ink)}.wh.now{background:var(--hl);border-radius:6px 6px 0 0}
.cl{grid-column:1/-1;font:700 11px Inter;color:var(--mu);padding:12px 12px 3px}
.ln{display:contents}
.nm{font:700 12px Inter;padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:34px;line-height:34px;text-align:left}
.ce{height:34px;display:flex;align-items:center;justify-content:center;position:relative;border-left:1px solid #00000008}
.ce.now{background:#FFF8D2}
.ce i{border-radius:50%;background:var(--c);display:block}
.ce i.lt{background:none;box-shadow:inset 0 0 0 1.5px var(--c)}
.ce .tri{position:absolute;top:1px;right:0;font-size:9px;line-height:1}
.ce .tri.bad{color:#C8402A}
.ce .fin{position:absolute;font:800 10px Inter;color:var(--c)}
.ln.paused .nm,.ln.paused .ce{opacity:.35}
.lg{padding:14px 12px 0;font-size:12px;color:var(--mu);line-height:1.5}
.lnb{display:contents}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--ch);padding:4px;border-radius:12px;margin-top:8px}
.seg button{height:38px;border-radius:9px;font-weight:700;font-size:13px}.seg button.on{background:var(--ink);color:#fff}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln);font-size:13.5px}.kv b{font-weight:700}
#shi label{display:block;font:700 12px Inter;color:var(--mu);margin:14px 0 4px}
#shi input[type=date]{width:100%;height:44px;border:0;border-radius:12px;background:var(--ch);padding:0 12px}
</style>
<div id="app"><header id="hd"></header><main id="mn"></main></div>
<script>
const W=16,U={};
function sim(){/* weeks of hours per project */const L={},rem={};S.p.forEach(p=>{L[p.id]=new Array(W).fill(0);rem[p.id]=p.er?0:left(p)});
 const fin={};for(let w=0;w<W;w++){CATS.forEach(c=>{let b=+S.bud[c]||0;for(let it=0;it<4&&b>1e-6;it++){const ps=S.p.filter(p=>p.cat===c&&rem[p.id]>1e-6&&p.w>0);const ws=sum(ps,p=>p.w);if(!ws)break;let used=0;ps.forEach(p=>{const g=Math.min(rem[p.id],b*p.w/ws);L[p.id][w]+=g;rem[p.id]-=g;used+=g;if(rem[p.id]<=1e-6&&fin[p.id]==null)fin[p.id]=w});b-=used}})}
 return{L,fin,rem}}
const wkD=w=>addD(mon(new Date()),7*w);
const wOf=s=>Math.floor((pd(s)-mon(new Date()))/(7*864e5));
function draw(){const R=sim(),act=S.p.filter(p=>!p.er&&left(p)>0);let late=0;
 act.forEach(p=>{const dl=pDL(p);if(dl&&(R.fin[p.id]==null||R.fin[p.id]>wOf(dl)))late++});
 $('hd').innerHTML='<div class="tt"><h1>River</h1><small>Next 16 weeks · '+act.length+' projects flowing'+(late?' · '+late+' miss a ▲ deadline':'')+'</small></div><button class="hb" data-a="undo"'+(UH.length?'':' disabled')+'>↶</button><button class="hb" data-a="bud">Budget</button>';
 let h='<div class="rv"><div class="wh"></div>';for(let w=0;w<W;w++){const d=wkD(w),m=d.getDate()<=7;h+='<div class="wh'+(m?' mo':'')+(w===0?' now':'')+'">'+(m?MO[d.getMonth()]:w%2?'':d.getDate())+'</div>'}
 CATS.forEach(c=>{const ps=S.p.filter(p=>p.cat===c&&!p.er);if(!ps.length)return;h+='<div class="cl">'+esc(c)+' · '+(+S.bud[c]||0)+' h/wk</div>';
  ps.forEach(p=>{const dl=pDL(p),dw=dl?wOf(dl):null,f=R.fin[p.id],bad=dl&&(f==null||f>dw),done=left(p)<=0;
   h+='<div class="ln'+(p.w===0?' paused':'')+'" style="--c:'+p.c+'"><button class="nm" data-a="lane" data-p="'+p.id+'">'+esc(p.n)+'</button>';
   for(let w=0;w<W;w++){const v=R.L[p.id][w],sz=v>0?Math.max(4,Math.min(24,3+v*2.4)):0;
    h+='<button class="ce'+(w===0?' now':'')+'" data-a="lane" data-p="'+p.id+'">'+(sz?'<i style="width:'+sz+'px;height:'+sz+'px"></i>':'')+(done&&w===0?'<span class="fin">✓</span>':'')+(dw===w?'<span class="tri'+(bad?' bad':'')+'">▲</span>':'')+'</button>'}
   h+='</div>'})});
 h+='</div><div class="lg">Each dot is the hours a project gets that week from its category budget; bigger dot, more hours. The lane ends where the project finishes. A red ▲ means the deadline comes before the finish. Tap a lane to change its priority or log hours.</div>';
 $('mn').innerHTML=h+'<div class="ver">Hours · River · a concept</div>';save()}
function laneSheet(p){const R=sim(),f=R.fin[p.id],dl=pDL(p),ct=cur(p);
 open('<h2 style="color:'+p.c+'">'+esc(p.n)+'</h2><div class="m">'+(ct?'Now: '+esc(ct.n):'All done')+'</div>'+
 '<div class="kv"><span>Hours left</span><b>'+qf(left(p))+'</b></div><div class="kv"><span>Finishes</span><b>'+(left(p)<=0?'done':f==null?'after '+fdt(iso(wkD(W-1))):'week of '+fdt(iso(wkD(f))))+'</b></div>'+(dl?'<div class="kv"><span><span class="tri">▲</span> Deadline</span><b class="'+(f==null||f>wOf(dl)?'late':'')+'">'+fdt(dl)+'</b></div>':'')+
 '<label>Priority within '+esc(p.cat)+'</label><div class="seg">'+[[0,'Pause'],[1,'Low'],[2,'Normal'],[4,'High']].map(([w,l])=>'<button class="'+(p.w===w?'on':'')+'" data-a="pw" data-p="'+p.id+'" data-w="'+w+'">'+l+'</button>').join('')+'</div>'+
 '<label>Log hours done</label><div class="row"><button class="btn g" style="margin:0" data-a="lg" data-p="'+p.id+'" data-h="-1">−1</button><button class="btn g" style="margin:0" data-a="lg" data-p="'+p.id+'" data-h=".25">+¼</button><button class="btn" style="margin:0" data-a="lg" data-p="'+p.id+'" data-h="1">+1</button></div>'+
 '<label><span class="tri">▲</span> Project deadline</label><input type="date" id="pdl" value="'+(p.dl||'')+'"><button class="btn" data-a="dlok" data-p="'+p.id+'">Save deadline</button>')}
const A={undo(){if(!UH.length)return;S=JSON.parse(UH.pop());draw()},
 lane(e){laneSheet(P(e.dataset.p))},
 pw(e){snap();P(e.dataset.p).w=+e.dataset.w;draw();laneSheet(P(e.dataset.p))},
 lg(e){snap();logH(e.dataset.p,+e.dataset.h);draw();laneSheet(P(e.dataset.p));toast((+e.dataset.h>0?'+':'')+qf(Math.abs(+e.dataset.h))+' h')},
 dlok(e){snap();P(e.dataset.p).dl=$('pdl').value||null;close();draw()},
 bud(){open('<h2>Hours a week</h2><div class="m">The river redraws as you change them</div>'+CATS.map(c=>'<div class="kv" style="align-items:center"><span>'+esc(c)+'</span><span class="row"><button class="btn g" style="margin:0;width:44px;height:38px" data-a="bs" data-c="'+esc(c)+'" data-k="-1">−</button><b style="min-width:28px;text-align:center">'+(+S.bud[c]||0)+'</b><button class="btn g" style="margin:0;width:44px;height:38px" data-a="bs" data-c="'+esc(c)+'" data-k="1">+</button></span></div>').join(''))},
 bs(e){snap();const c=e.dataset.c;S.bud[c]=Math.max(0,(+S.bud[c]||0)+ +e.dataset.k);draw();A.bud()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b);else if(e.target.id==='sh')close()});
draw();
</script>
<div id="sh"><div id="shi"></div></div><div id="toast"></div></body></html>
