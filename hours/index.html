<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hours</title>
<style>
:root{--bg:#F7F6F2;--ink:#17181C;--mu:#5C5D63;--ln:#E4E2DC;--sf:#fff;--ch:#F2F1ED}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#d9d8d3}
#app{max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--ln);background:var(--sf);min-height:56px}
header b{font-size:17px;display:block;line-height:1.2}header small{display:block;font-size:11.5px;color:var(--mu);margin-top:1px}
#bk{border:0;background:var(--ch);border-radius:50%;width:34px;height:34px;font-size:18px;display:none;flex:none}
main{flex:1;overflow:auto;padding-bottom:12px}main.ov{overflow:hidden}
nav{display:flex;border-top:1px solid var(--ln);background:var(--sf);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:7px 0 6px;font:600 11px Inter,system-ui;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ink)}nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}nav svg .f{fill:currentColor;stroke:none}
.tabs{display:flex;background:var(--sf);border-bottom:1px solid var(--ln);overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:10px 6px 8px;font:700 12px Inter,system-ui;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--cc)}
.pad{padding:10px 14px}.m{font-size:11.5px;color:var(--mu)}.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.dg{line-height:0;font-size:0}.d{display:inline-block;border-radius:50%;width:var(--s,10px);height:var(--s,10px);margin:var(--g,1.5px);background:var(--c);vertical-align:top}
.d.e{opacity:.3}.d.r{background:none;border:1.5px dashed var(--c);opacity:.9}.d.hl{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.fl{display:inline-flex;width:14px;height:14px;border-radius:50%;background:var(--ink);color:#fff;font:700 8.5px/14px Inter;justify-content:center;margin:-1px 1px 0 3px;vertical-align:top}
.tk{cursor:pointer}.gd{display:inline-block;width:11px;height:11px;transform:rotate(45deg);border:2px solid var(--ink);background:#fff;margin:2px 6px 0 5px;vertical-align:top}
.gd.p{background:var(--ink)}.gd.rc{border-style:dashed}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:17px;background:var(--ch);border:0;font:700 16px Inter,system-ui;color:var(--ink);padding:0 10px}
.pill.k{background:var(--ink);color:#fff}.pill.s{min-width:28px;height:28px;font-size:14px;padding:0 8px}
.chip{display:inline-block;border-radius:9px;padding:4px 9px;font:700 11px Inter,system-ui;background:var(--ch)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:11px 12px;margin:10px 14px}
.pr{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ln);background:var(--sf);cursor:pointer}
.sw{width:10px;align-self:stretch;border-radius:5px;flex:none}.pr b{font-size:14px}.bar{height:6px;border-radius:3px;background:var(--ch);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%}
.pbar{display:flex;height:28px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 2px}.pbar div{display:flex;align-items:center;justify-content:center;color:#fff;font:700 10px Inter;cursor:pointer;min-width:0}
.sg{padding:6px 14px 0}.sh .link,.sh .pill{white-space:nowrap;flex:none}.sh b{flex:1;min-width:0}.sh .sp{display:none}.sh{display:flex;align-items:center;gap:6px;padding:8px 0 3px}.sh b{font-size:13px}
.tr{display:flex;align-items:center;gap:7px;min-height:30px;padding:2px 6px;border-radius:8px;font-size:12.5px;cursor:pointer}.tr.sel{background:var(--ch);font-weight:700}
.tr .n{width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;font:700 9px/16px Inter;text-align:center;flex:none}
.add{border:0;background:none;color:var(--mu);font:600 12px Inter,system-ui;padding:6px;text-align:left}
.link{border:0;background:none;color:var(--mu);font:600 11.5px Inter,system-ui;text-decoration:underline;padding:6px 2px}
#bg{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}#bg.on{display:flex}
#sheet{background:var(--sf);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px 16px 22px;max-height:85vh;overflow:auto}
#sheet input[type=text],#sheet input[type=date],#sheet input[type=number]{width:100%;font:16px Inter,system-ui;padding:10px;border:1px solid var(--ln);border-radius:10px;margin:6px 0 10px;background:var(--bg)}
.big{width:100%;border:0;border-radius:12px;background:var(--ink);color:#fff;font:700 15px Inter,system-ui;padding:13px;margin-top:6px}.big.g{background:var(--ch);color:var(--ink)}
.ovl{padding:6px 12px}.ovl .row{margin-top:4px}.sync{font-size:11px;color:var(--mu)}
</style></head><body><div id="app"><header><button id="bk" aria-label="Back">‹</button><div><b id="ttl">Planner</b><small id="sm"></small></div></header><main id="pg"></main>
<nav id="nav"><button data-pg="0"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Settings</button><button data-pg="1"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="10" rx="1"/><rect x="16" y="4" width="4" height="13" rx="1"/></svg>Planner</button><button data-pg="2"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Dates</button><button data-pg="3"><svg viewBox="0 0 24 24"><circle class="f" cx="6" cy="6" r="1.9"/><circle class="f" cx="12" cy="6" r="1.9"/><circle class="f" cx="18" cy="6" r="1.9"/><circle class="f" cx="6" cy="12" r="1.9"/><circle class="f" cx="12" cy="12" r="1.9"/><circle class="f" cx="18" cy="12" r="1.9"/><circle class="f" cx="6" cy="18" r="1.9"/><circle class="f" cx="12" cy="18" r="1.9"/><circle class="f" cx="18" cy="18" r="1.9"/></svg>Overview</button></nav></div>
<div id="bg"><div id="sheet"></div></div><input type="file" id="fi" accept="application/json" hidden>
<script>
(function(){
const KEY='hours-v3',uid=()=>Math.random().toString(36).slice(2,9),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Research','Teaching','Chair & Admin','Personal'],CC={Research:'#2E7D4F',Teaching:'#D9822F','Chair & Admin':'#6B4FA3',Personal:'#7A7B80'};
const BUD0={Research:14,Teaching:12,'Chair & Admin':10,Personal:4};
function split(n,w){const t=sum(w,x=>x),r=w.map(x=>Math.floor(n*x/t));let left=n-sum(r,x=>x);w.map((x,i)=>[n*x/t-r[i],i]).sort((a,b)=>b[0]-a[0]).forEach((z,k)=>{if(k<left)r[z[1]]++});return r}
function mk(names,hs,tk){return names.map((n,i)=>{const h=hs[i]||0,tl=(tk&&tk[i])||[[n,1]],pt=h>0?split(h,tl.map(x=>x[1])):[];return{n,g:h>0?'open':'passed',t:h>0?tl.map((x,j)=>({id:uid(),n:x[0],h:pt[j],d:0})):[]}})}
const RN=['Question','Model','Proofs and numerics','Story','Submit and revise'];
const RT=[[['Write the claim in one sentence',1]],[['Set up the economy',1],['Solve the baseline',1]],[['Prove the main proposition',2],['Numerics and checks',2],['Review the AI output',1]],[['Introduction and positioning',2],['Write the sections',4],['Intuition and interpretation',2]],[['Polish and seminars',3],['Submit',1],['Referee rounds',6]]];
const P=(cat,name,c,names,hs,tk,x)=>Object.assign({id:uid(),cat,name,c,st:mk(names,hs,tk)},x||{});
const R=(name,c,hs,last,x)=>{const tk=RT.slice();if(last)tk[4]=last;return P('Research',name,c,RN,hs,tk,x)};
const TN=['Prepare','Teach','Exam and grading'],TTK=[[['Plan the sessions',1],['Syllabus and materials',2]],[['Lectures',1]],[['Write the exam',1],['Grade the exams',2]]];
const course=(n,c,h)=>P('Teaching',n,c,TN,h,TTK);
function demo(){return{v:3,bud:Object.assign({},BUD0),ui:{pg:1,cat:'Research',proj:null,task:null},p:[
R('MIZN','#2E7D4F',[10,25,40,75,100]),
R('TSI','#5AA469',[0,10,40,50,100]),
R('IRR','#1B5E3A',[5,20,30,45,50],0,{sub:1}),
R('KEZ','#14482C',[5,20,30,45,50],0,{sub:1}),
R('BBP','#7DBE8A',[0,0,0,0,100],[['Response letter and rewrite',5],['Numerics the referees asked for',4],['Resubmit',1]]),
R('WP0','#9BCB7C',[0,0,0,0,100],[['Revise the paper',6],['Response letter',3],['Resubmit',1]]),
R('WP1','#3C9C86',[0,0,20,30,100]),
course('BT','#D9822F',[30,25,20]),course('FMA','#E39A4B',[20,15,15]),course('EEOD','#C86F1F',[4,3,3]),
P('Teaching','Frankfurt','#C8402A',['Teach'],[90],[[['Lectures in Frankfurt',1]]],{dt:{a:'2027-01-25',b:'2027-02-09'}}),
P('Teaching','Theses','#B8651F',['Supervision','Reading','Defences'],[48,16,10]),
P('Chair & Admin','Recruitment','#6B4FA3',['Profile','Applications','Fly-outs','Decide','Offer'],[3,8,12,4,3],[0,0,[['Fly-outs and talks',2],['Hiring second candidate',1]]]),
P('Chair & Admin','Teaching allocation','#8A6BC2',['Supply and demand','Draft','Agree'],[6,7,7]),
P('Chair & Admin','New master','#53387F',['Proposal','Partner talks','Curriculum','Approval'],[8,8,10,4],[0,[['Talks with the partner',1],['Torino MSc',1]]]),
P('Chair & Admin','Staff and MT','#A38BD3',['Ongoing'],[60],[[['Staff matters',4],['MT meetings',3],['Ceremonies',1]]]),
P('Chair & Admin','Committees','#2F6FB5',['Ongoing'],[50],[[['Committee work',3],['Other admin',2]]],{admin:1}),
P('Personal','Persian','#7A7B80',['Ongoing'],[60]),P('Personal','Sport','#9A9BA1',['Ongoing'],[100]),P('Personal','Home','#5F6065',['Ongoing'],[40])]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!S||S.v!==3)S=demo();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const U=S.ui,pg=document.getElementById('pg'),bg=document.getElementById('bg'),sheet=document.getElementById('sheet');
const tasks=p=>p.st.flatMap(s=>s.t),tot=p=>sum(tasks(p),t=>t.h),dn=p=>sum(tasks(p),t=>t.d),rem=p=>tot(p)-dn(p);
const proj=id=>S.p.find(p=>p.id===id),cur=()=>U.proj?proj(U.proj):null;
const findT=(p,id)=>{for(let i=0;i<p.st.length;i++){const t=p.st[i].t.find(x=>x.id===id);if(t)return[t,i]}return[]};
function shares(cat){const ps=S.p.filter(p=>p.cat===cat&&rem(p)>0),B=Math.round(S.bud[cat]),R_=sum(ps,rem),o={};if(!R_)return o;const raw=ps.map(p=>B*rem(p)/R_),fl=raw.map(Math.floor),left=B-sum(fl,x=>x);raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach((z,k)=>{if(k<left)fl[z[1]]++});ps.forEach((p,i)=>o[p.id]=fl[i]);return o}
const dots=(n,d,c,o)=>{o=o||{};let h='';for(let k=0;k<n;k++)h+='<i class="d'+(k<d?'':(o.r?' r':' e'))+(o.hl?' hl':'')+'" style="--c:'+c+(o.s?';--s:'+o.s+'px':'')+(o.k?'" data-a="dot" data-k="'+k:'')+'"></i>';return h};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pd=s=>{const a=s.split('-');return new Date(Date.UTC(+a[0],a[1]-1,+a[2]))},fdt=s=>{const d=pd(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]},td=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
const gdi=g=>'<span class="gd'+(g==='passed'?' p':g==='recheck'?' rc':'')+'"></span>';
function head(t,s,back){document.getElementById('ttl').textContent=t;document.getElementById('sm').textContent=s||'';document.getElementById('bk').style.display=back?'block':'none'}
function stepper(a,v,extra){return '<button class="pill" data-a="'+a+'m"'+(extra||'')+'>−</button><b style="min-width:30px;text-align:center;font-size:16px">'+v+'</b><button class="pill" data-a="'+a+'p"'+(extra||'')+'>+</button>'}
/* pages */
function pSettings(){head('Settings','Weekly hours per category');let h='<div class="card"><div class="m" style="margin-bottom:6px">Hours per week, shared over the projects of a category</div>';
CATS.forEach(c=>{const ps=S.p.filter(p=>p.cat===c),R_=sum(ps,rem),w=S.bud[c];h+='<div style="padding:9px 0;border-top:1px solid var(--ln)"><div class="row"><i class="d" style="--c:'+CC[c]+';--s:12px"></i><b>'+c+'</b><span class="sp"></span>'+stepper('bud',w,' data-c="'+esc(c)+'"')+'</div><div class="m">'+R_+' dots left · about '+(w>0?Math.ceil(R_/w):'–')+' weeks at this budget</div></div>'});
h+='<div class="m" style="margin-top:6px">Total '+sum(CATS,c=>S.bud[c])+' h per week. Research stages have no dates; the numbers are information, not deadlines.</div></div>';
h+='<div class="card"><b>Data</b><div class="m" style="margin:4px 0 8px">Saved on this phone. Export a copy or import one.</div><div class="row"><button class="big g" data-a="exp">Export</button><button class="big g" data-a="imp">Import</button></div><button class="link" data-a="reset" style="margin-top:8px">'+(U.rs?'Tap again to reset every project to the starting plan':'Reset to the starting plan')+'</button></div>';
return h}
function pList(){const c=U.cat,sh=shares(c),ps=S.p.filter(p=>p.cat===c);head('Planner',c+' · '+S.bud[c]+' h per week');
let h='<div class="tabs" style="--cc:'+CC[c]+'">'+CATS.map(n=>'<button data-a="cat" data-c="'+esc(n)+'" class="'+(n===c?'on':'')+'" style="--cc:'+CC[n]+'">'+n+'</button>').join('')+'</div>';
h+='<div class="pad"><div class="m">'+c+' budget · '+S.bud[c]+' h per week</div><div class="dg" style="margin:5px 0;--s:13px;--g:1.5px">';
ps.forEach(p=>{const k=sh[p.id]||0;h+=dots(k,k,p.c)});h+='</div><div class="row m" style="flex-wrap:wrap;gap:4px 10px">'+ps.filter(p=>sh[p.id]).map(p=>'<span style="color:'+p.c+';font-weight:700">'+esc(p.name)+' '+sh[p.id]+'</span>').join('')+'</div></div>';
ps.forEach(p=>{const T=tot(p),D=dn(p);h+='<div class="pr" data-a="open" data-p="'+p.id+'"><span class="sw" style="background:'+p.c+'"></span><div style="flex:1;min-width:0"><div class="row"><b>'+esc(p.name)+'</b>'+(p.sub?'<span class="chip">sub-top</span>':'')+(p.dt?'<span class="chip">'+fdt(p.dt.a)+' – '+fdt(p.dt.b)+'</span>':'')+'<span class="sp"></span><span class="m"><b style="color:var(--ink)">'+D+'</b> / '+T+'</span></div><div class="bar"><i style="width:'+(T?100*D/T:0)+'%;background:'+p.c+'"></i></div></div></div>'});
h+='<div class="pad"><button class="big g" data-a="newp">＋ New project</button></div>';return h}
function pProj(p){const T=tot(p),D=dn(p),sh=shares(p.cat)[p.id]||0,s0=T>220?9:T>140?10:11;
head(p.name,p.cat+(p.sub?' · sub-top':'')+' · '+(sh?sh+' of '+S.bud[p.cat]+' h per week':'under 1 h per week')+' · '+D+' of '+T+' dots'+(sh&&T-D?' · about '+Math.ceil((T-D)/sh)+' weeks at this pace':''),1);
let h='<div class="sg"><div class="pbar">';p.st.forEach((s,i)=>{const H=sum(s.t,t=>t.h);if(H)h+='<div data-a="stg" data-i="'+i+'" style="flex:'+H+';background:'+p.c+';opacity:'+(.55+.45*(i+1)/p.st.length)+'">'+H+'</div>'});
h+='</div><div class="row m" style="gap:0">';p.st.forEach(s=>{const H=sum(s.t,t=>t.h);if(H)h+='<span style="flex:'+H+';text-align:center;font-size:8.5px;overflow:hidden;white-space:nowrap">'+esc(s.n.split(' ')[0])+'</span>'});
h+='</div></div><div class="pad"><div class="dg" style="--s:'+s0+'px">';let n=0;
p.st.forEach((s,i)=>{s.t.forEach(t=>{n++;h+='<span class="tk" data-a="sel" data-t="'+t.id+'"><b class="fl">'+n+'</b>'+dots(t.h,t.d,p.c,{s:s0,hl:t.id===U.task,r:t.rp})+'</span>'});if(s.t.length||s.g==='recheck')h+=gdi(s.g)});
h+='</div></div>';
const [t,si]=U.task?findT(p,U.task):[];
if(t){h+='<div class="card" style="border:2px solid var(--ink)"><div class="row"><b style="font-size:14px;flex:1">'+esc(t.n)+'</b><span class="m">'+esc(p.st[si].n)+'</span></div><div class="row" style="margin:6px 0"><span class="m">Budget</span><span class="sp"></span>'+stepper('th',t.h)+'</div><div class="dg" style="--s:15px;--g:2px;margin:2px 0 6px">'+dots(t.h,t.d,p.c,{k:1,r:t.rp})+'</div><div class="row"><span class="m">'+t.d+' done · '+(t.h-t.d)+' to go</span><span class="sp"></span><button class="pill k" data-a="logm">−1</button><button class="pill k" data-a="logp">Log 1 h</button></div><div class="row" style="margin-top:4px"><button class="link" data-a="ren">Rename</button><button class="link" data-a="deltask">'+(U.dl===t.id?'Tap again to delete':'Delete')+'</button></div></div>'}
else h+='<div class="m pad">Tap a task to log hours on it.</div>';
n=0;p.st.forEach((s,i)=>{h+='<div class="sg"><div class="sh">'+gdi(s.g)+'<b>'+esc(s.n)+'</b><span class="m">'+sum(s.t,t=>t.d)+' / '+sum(s.t,t=>t.h)+(s.g==='recheck'?' · to re-check':'')+'</span><span class="sp"></span><button class="link" data-a="gap" data-i="'+i+'">Found a gap</button><button class="pill s" data-a="gate" data-i="'+i+'">'+(s.g==='passed'?'Reopen':s.g==='recheck'?'Pass':'Pass gate')+'</button></div>';
s.t.forEach(t=>{n++;h+='<div class="tr'+(t.id===U.task?' sel':'')+'" data-a="sel" data-t="'+t.id+'"><span class="n">'+n+'</span><span style="flex:1">'+esc(t.n)+(t.rp?' <span class="m">(repair)</span>':'')+'</span><span class="m">'+t.d+'/'+t.h+'</span></div>'});
h+='<button class="add" data-a="addt" data-i="'+i+'">＋ Task</button></div>'});
h+='<div class="pad row"><button class="link" data-a="dates">'+(p.dt?'Dates: '+fdt(p.dt.a)+' – '+fdt(p.dt.b):'Add dates')+'</button><span class="sp"></span><button class="link" data-a="delp">'+(U.dp===p.id?'Tap again to delete project':'Delete project')+'</button></div>';return h}
function pDates(){head('Dates','Only things with a real date');const L=S.p.filter(p=>p.dt);let h='';if(!L.length)return'<div class="card m">Nothing has a date. Add dates on a project page when something is fixed, such as a course.</div>';
const today=td();L.forEach(p=>{const days=[];for(let d=pd(p.dt.a);d<=pd(p.dt.b);d=new Date(+d+864e5))if(d.getUTCDay()!==0)days.push(d);const T=tot(p),D=dn(p),pt=split(T,days.map(()=>1));let c=0;
h+='<div class="card"><div class="row"><span class="sw" style="background:'+p.c+';align-self:auto;height:16px"></span><b>'+esc(p.name)+'</b><span class="sp"></span><span class="m">'+fdt(p.dt.a)+' – '+fdt(p.dt.b)+' · no Sundays</span></div><div class="m" style="margin:4px 0">'+T+' dots over '+days.length+' days, spread evenly until the real schedule is known</div>';
days.forEach((d,i)=>{const iso=d.toISOString().slice(0,10);const k=pt[i],dd=Math.max(0,Math.min(k,D-c));c+=k;h+='<div class="row" style="border-top:1px solid var(--ln);padding:3px 0;'+(iso===today?'background:var(--ch);border-radius:6px;':'')+'"><span class="m" style="width:74px;white-space:nowrap">'+WD[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]+'</span><div class="dg" style="--s:9px;--g:1px">'+dots(k,dd,p.c)+'</div></div>'});h+='</div>'});return h}
function pOver(){head('Overview','All dots · '+sum(S.p,tot)+' in total · '+sum(S.p,dn)+' done');return'<div class="ovl" id="ov"></div>'}
function fitOv(){const el=document.getElementById('ov');if(!el)return;const W=pg.clientWidth-24,H=pg.clientHeight-12;let best=3;
const N=CATS.map(c=>sum(S.p.filter(p=>p.cat===c),tot));for(let s=16;s>=3;s--){const g=s+2,cols=Math.floor(W/g),rows=sum(N,n=>Math.ceil(n/cols)),lab=CATS.length*(20+8);if(rows*g+lab<=H){best=s;break}}
let h='';CATS.forEach(c=>{const ps=S.p.filter(p=>p.cat===c);h+='<div class="row m" style="margin-top:6px"><b style="color:'+CC[c]+'">'+c+'</b><span class="sp"></span>'+sum(ps,dn)+' / '+sum(ps,tot)+'</div><div class="dg" style="--s:'+best+'px;--g:1px">'+ps.map(p=>dots(tot(p),dn(p),p.c)).join('')+'</div>'});el.innerHTML=h}
function draw(){const m=U.proj&&U.pg===1&&cur()?'proj':'';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',+b.dataset.pg===U.pg));pg.className=U.pg===3?'ov':'';
pg.innerHTML=U.pg===0?pSettings():U.pg===2?pDates():U.pg===3?pOver():(m?pProj(cur()):pList());if(U.pg===3)fitOv();if(U.pg===1&&!m)head('Planner',U.cat+' · '+S.bud[U.cat]+' h per week');if(U.pg===0)head('Settings','Weekly hours per category');save()}
/* sheets */
const open=h=>{sheet.innerHTML=h;bg.classList.add('on')},close=()=>bg.classList.remove('on'),val=id=>document.getElementById(id).value;
let DT=null;
function detourSheet(){const p=cur(),i=DT.i;let h='<b style="font-size:16px">Found a gap in '+esc(p.st[i].n)+'</b><div class="m" style="margin:4px 0 8px">Guess the dots to repair it and to get back to where you were. They sit as outline dots, not deadlines. Later gates reopen to re-check.</div><input type="text" id="dn" placeholder="What is missing?" value="'+esc(DT.note)+'">';
for(let j=i;j<p.st.length;j++)h+='<div class="row" style="padding:5px 0;border-top:1px solid var(--ln)"><span style="flex:1;font-size:13px">'+(j===i?'Fix in ':'Re-check ')+esc(p.st[j].n)+'</span>'+stepper('dv',DT.v[j],' data-j="'+j+'"')+'</div>';
h+='<button class="big" data-a="dok">Start detour</button>';open(h)}
/* actions */
const A={
cat(e){U.cat=e.dataset.c;U.proj=null;draw()},open(e){U.proj=e.dataset.p;U.task=null;U.dl=U.dp=null;draw()},
sel(e){U.task=e.dataset.t;U.dl=null;draw()},stg(e){const s=cur().st[+e.dataset.i];if(s.t[0])U.task=s.t[0].id;draw()},
dot(e){const[t]=findT(cur(),U.task),k=+e.dataset.k;t.d=t.d===k+1?k:k+1;draw()},
thm(){const[t]=findT(cur(),U.task);t.h=Math.max(Math.max(t.d,0),t.h-1);draw()},thp(){const[t]=findT(cur(),U.task);t.h++;draw()},
logp(){const[t]=findT(cur(),U.task);t.d=Math.min(t.h,t.d+1);draw()},logm(){const[t]=findT(cur(),U.task);t.d=Math.max(0,t.d-1);draw()},
ren(){const[t]=findT(cur(),U.task);open('<b>Rename task</b><input type="text" id="v1" value="'+esc(t.n)+'"><button class="big" data-a="renok">Save</button>')},
renok(){const[t]=findT(cur(),U.task);t.n=val('v1').trim()||t.n;close();draw()},
deltask(){if(U.dl!==U.task){U.dl=U.task;return draw()}const p=cur();p.st.forEach(s=>s.t=s.t.filter(t=>t.id!==U.task));U.task=null;U.dl=null;draw()},
addt(e){U.ai=+e.dataset.i;open('<b>New task in '+esc(cur().st[U.ai].n)+'</b><input type="text" id="v1" placeholder="Task name"><div class="m">Dots</div><input type="number" id="v2" value="5" min="1"><button class="big" data-a="addok">Add</button>')},
addok(){const n=val('v1').trim(),h=Math.max(1,parseInt(val('v2'))||1);if(n){const p=cur(),t={id:uid(),n,h,d:0};p.st[U.ai].t.push(t);if(p.st[U.ai].g==='passed')p.st[U.ai].g='open';U.task=t.id}close();draw()},
gate(e){const s=cur().st[+e.dataset.i];if(s.g==='open')s.g='passed';else if(s.g==='passed')s.g='open';else{s.g='passed';s.t.forEach(t=>{if(t.rp)t.h=t.d});s.t=s.t.filter(t=>t.h>0)}draw()},
gap(e){const p=cur(),i=+e.dataset.i;DT={i,note:'',v:p.st.map((s,j)=>j===i?4:0)};detourSheet()},
dvm(e){DT.note=val('dn');const j=+e.dataset.j;DT.v[j]=Math.max(0,DT.v[j]-1);detourSheet()},dvp(e){DT.note=val('dn');DT.v[+e.dataset.j]++;detourSheet()},
dok(){const p=cur(),i=DT.i,note=val('dn').trim();DT.v.forEach((v,j)=>{if(j<i)return;const s=p.st[j];if(v>0)s.t.push({id:uid(),n:j===i?(note||'Repair'):'Re-check: '+(note||p.st[i].n),h:v,d:0,rp:1});s.g=j===i?'open':(s.g==='passed'?'recheck':s.g)});close();draw()},
budm(e){const c=e.dataset.c;S.bud[c]=Math.max(0,S.bud[c]-1);draw()},budp(e){const c=e.dataset.c;S.bud[c]++;draw()},
newp(){open('<b>New '+U.cat+' project</b><input type="text" id="v1" placeholder="Name"><div class="m">Total dots</div><input type="number" id="v2" value="100" min="1"><button class="big" data-a="newok">Add</button>')},
newok(){const n=val('v1').trim(),h=Math.max(1,parseInt(val('v2'))||1);if(!n)return close();const cols=['#3C9C86','#8A6BC2','#C86F1F','#9A9BA1'],c=U.cat==='Research'?'#2E7D4F':CC[U.cat],p=U.cat==='Research'?R(n,c,split(h,[5,15,25,25,30])):P(U.cat,n,c,['Work'],[h]);S.p.push(p);U.proj=p.id;U.task=null;close();draw()},
delp(){const p=cur();if(U.dp!==p.id){U.dp=p.id;return draw()}S.p=S.p.filter(x=>x.id!==p.id);U.proj=null;U.dp=null;draw()},
dates(){const p=cur();open('<b>Dates for '+esc(p.name)+'</b><div class="m">First day</div><input type="date" id="v1" value="'+(p.dt?p.dt.a:'')+'"><div class="m">Last day</div><input type="date" id="v2" value="'+(p.dt?p.dt.b:'')+'"><button class="big" data-a="datok">Save</button><button class="big g" data-a="datno">Remove dates</button>')},
datok(){const a=val('v1'),b=val('v2');if(a&&b&&a<=b)cur().dt={a,b};close();draw()},datno(){delete cur().dt;close();draw()},
exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='hours-'+td()+'.json';a.click()},
imp(){document.getElementById('fi').click()},
reset(){if(!U.rs){U.rs=1;return draw()}try{localStorage.setItem(KEY,JSON.stringify(demo()))}catch(e){}location.reload()}};
document.addEventListener('click',e=>{if(e.target===bg)return close();const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el);return}const nb=e.target.closest('nav button');if(nb){U.pg=+nb.dataset.pg;draw()}});
document.getElementById('bk').onclick=()=>{U.proj=null;U.task=null;draw()};
document.getElementById('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.v===3){localStorage.setItem(KEY,JSON.stringify(o));location.reload()}}catch(x){}};r.readAsText(f)};
window.addEventListener('resize',()=>{if(U.pg===3)fitOv()});draw();window.H={S,draw,U};
})();
</script></body></html>
