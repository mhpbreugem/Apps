function bucket(a,n){let h='',tot=0,cap=0,nm=[];CATS.forEach((c,ci)=>{const L=LD[ci].slice(a-A,a-A+n).filter(Boolean);if(!L.length)return;const cp=Math.round(bud(c[0])*L.length/5),parts=[],fx=sum(L,o=>o.t);if(fx>.05)parts.push([FIX,fx,'Fixed']);S.goals.filter(g=>g.cat===c[0]).forEach(g=>{const v=sum(L,o=>o.g[g.id]||0);if(v>.05)parts.push([g.c,v,g.name])});let cum=0,k=0,d='';parts.forEach(([col,v,nn])=>{cum+=v;const m=Math.round(cum)-k;for(let i=0;i<m;i++,k++)d+='<i class="d'+(k>=cp?' o':'')+'" style="--c:'+col+'"></i>';nm.push(nn+' '+Math.round(v*10)/10+' h')});for(let i=k;i<cp;i++)d+='<i class="d f"></i>';tot+=cum;cap+=cp;if(d)h+='<span style="display:inline-block;margin-right:7px">'+d+'</span>'});return{h,tot,cap,nm}}
