<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kāshi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F4;--surface:#FFFFFF;--surface2:#EFEFEC;--ink:#111113;--muted:#7C7C80;--line:rgba(17,17,19,.08);
  --ok:#1F9D6B;--mid:#D99A00;--bad:#E5484D;--accent:#111113;--on-accent:#FFFFFF;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fa:"Vazirmatn",Tahoma,"Noto Naskh Arabic",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0C;--surface:#161618;--surface2:#1F1F22;--ink:#EDEDEF;--muted:#8E8E93;--line:rgba(255,255,255,.08);
  --ok:#3DD68C;--mid:#F5C842;--bad:#FF6369;--accent:#EDEDEF;--on-accent:#0B0B0C;}}
:root[data-theme="dark"]{
  --bg:#0B0B0C;--surface:#161618;--surface2:#1F1F22;--ink:#EDEDEF;--muted:#8E8E93;--line:rgba(255,255,255,.08);
  --ok:#3DD68C;--mid:#F5C842;--bad:#FF6369;--accent:#EDEDEF;--on-accent:#0B0B0C;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);letter-spacing:-.006em;min-height:100%;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.fa{font-family:var(--fa);direction:rtl}
/* header */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:620px;margin:0 auto;padding:14px 20px 12px;display:flex;align-items:baseline;justify-content:space-between}
.mark{font-weight:700;font-size:17px;letter-spacing:-.02em}
.mark span{font:500 15px var(--fa);color:var(--muted);margin-left:8px}
.topline{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:2px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--ink);transition:width .4s ease}
main{max-width:620px;margin:0 auto;padding:8px 20px 32px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:620px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
/* shared */
.eyebrow{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:28px 4px 10px}
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.muted{color:var(--muted)}
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:15px;cursor:pointer;background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--on-accent);width:100%}
.btn.primary:focus-visible{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 18%,transparent)}
.btn:disabled{opacity:.35;cursor:default}
.link{border:0;background:none;color:var(--muted);font-weight:500;font-size:14px;padding:10px 12px;cursor:pointer}
.link:hover{color:var(--ink)}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
/* study */
.study{min-height:calc(100vh - 220px);display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.chiprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.chip{font-size:12px;font-weight:500;color:var(--muted);background:var(--surface2);padding:5px 10px;border-radius:999px}
.prompt{font-size:clamp(30px,8.5vw,44px);font-weight:600;letter-spacing:-.03em;line-height:1.12;margin:0 0 36px}
.answer{width:100%;border:0;border-bottom:1.5px solid var(--line);background:none;color:var(--ink);font:500 30px/1.4 var(--fa);direction:rtl;text-align:right;padding:6px 0 10px;border-radius:0;outline:none;transition:border-color .2s}
.answer:focus{border-bottom-color:var(--ink)}
.answer:focus-visible{outline:none}
.answer::placeholder{color:var(--muted);opacity:.5}
.answer.ok{border-bottom-color:var(--ok)}
.answer.bad{border-bottom-color:var(--bad)}
.hint{font-size:14px;color:var(--muted);min-height:22px;margin-top:10px}
.fb{display:none;margin-top:18px}
.fb.show{display:block;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.verdict::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.fb.ok .verdict{color:var(--ok)}.fb.near .verdict{color:var(--mid)}.fb.bad .verdict{color:var(--bad)}
.big{font:700 40px/1.35 var(--fa);direction:rtl;text-align:right;margin-top:6px}
.tr{color:var(--muted);text-align:right;font-size:15px}
.alt,.yours{color:var(--muted);font-size:13px;margin-top:8px;text-align:right}
.alt span,.yours span{font:500 16px var(--fa);color:var(--ink)}
.acts{margin-top:32px}
.acts .links{display:flex;justify-content:center;gap:8px;margin-top:6px}
.done{text-align:center;padding:72px 12px}
.done .ring{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;margin:0 auto 18px}
.done svg{width:26px;height:26px;stroke:var(--ok);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.done h2{font-size:22px;letter-spacing:-.02em;margin:0 0 6px}
.done p{color:var(--muted);margin:0 auto 24px;max-width:34ch}
/* map */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 12px}
.kpi b{display:block;font-size:24px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;white-space:nowrap;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi span::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c)}
.pages{display:flex;gap:6px;overflow-x:auto;margin:18px -20px 0;padding:0 20px 2px;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.pages button{flex:none;border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;background:var(--surface);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.pages button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.maphead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 2px 10px}
.maphead small{color:var(--muted);font-size:12px}
.zoom{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:3px}
.zoom button{width:30px;height:30px;border:0;border-radius:50%;background:none;font-size:18px;line-height:1;cursor:pointer}
.zoom button:disabled{opacity:.3}
.zoom input{width:84px;accent-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap,3px);background:var(--surface);border-radius:var(--r);padding:12px;touch-action:pan-x pan-y}
.t{border:0;padding:0;margin:0;border-radius:3px;cursor:pointer;aspect-ratio:1;background:var(--c);min-width:0}
.b3{--c:var(--ok)}.b2{--c:var(--mid)}.b1{--c:var(--bad)}
.b0{--c:color-mix(in srgb,var(--bad) 22%,var(--surface))}
.t.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.lbl1 .t,.lbl2 .t{aspect-ratio:auto;min-height:46px;border-radius:8px;padding:6px 7px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:2px;
  background:color-mix(in srgb,var(--c) 16%,var(--surface));box-shadow:inset 3px 0 0 var(--c);overflow:hidden}
.lbl1 .b0,.lbl2 .b0{background:var(--surface2);box-shadow:inset 3px 0 0 var(--line)}
.lbl1 .t.sel,.lbl2 .t.sel{box-shadow:inset 3px 0 0 var(--c),0 0 0 2px var(--ink)}
.te{font-size:10.5px;line-height:1.2;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tf{display:none;font:500 17px/1.3 var(--fa);direction:rtl;text-align:right}
.lbl2 .t{min-height:72px;padding:9px 10px}
.lbl2 .te{font-size:13px;-webkit-line-clamp:2}
.lbl2 .tf{display:block}
.gridnote{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.sheet{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;padding:0 12px 10px;pointer-events:none}
.sheet-in{max-width:596px;margin:0 auto;background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 0 1px var(--line);pointer-events:auto;animation:rise .2s ease}
.sheet[hidden]{display:none}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet .en{font-weight:600;font-size:17px;letter-spacing:-.01em}
.sheet .fa1{font:700 30px/1.35 var(--fa);direction:rtl;text-align:right;margin-top:4px}
.sheet .meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.x{border:0;background:var(--surface2);width:28px;height:28px;border-radius:50%;cursor:pointer;flex:none;font-size:15px;line-height:1}
/* words */
.deckrow{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:14px}
.deckrow b{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.search{width:100%;border:0;border-radius:12px;background:var(--surface);color:var(--ink);font:15px var(--sans);padding:13px 16px}
.search::placeholder{color:var(--muted)}
.wl .row{padding:12px 16px}
.wl .e{font-weight:500}
.wl .s{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center}
.wl .f{font:500 19px var(--fa);direction:rtl;text-align:right}
/* grammar */
details{background:var(--surface);border-radius:var(--r);margin-bottom:8px}
summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .2s;flex:none}
details[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.gbody{padding:0 16px 14px}
.gbody p{margin:0 0 10px;color:var(--muted);max-width:62ch}
.ex{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ex span:last-child{font:500 18px var(--fa);direction:rtl}
/* settings */
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--surface2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--ok)}
.sw:checked::after{transform:translateX(18px)}
select{font:15px var(--sans);border:0;background:var(--surface2);color:var(--ink);border-radius:8px;padding:6px 10px}
.note{color:var(--muted);font-size:13px;margin:10px 4px 0;max-width:60ch}
.danger{color:var(--bad);background:none;border:0;font-weight:500;padding:14px 16px;width:100%;text-align:left;cursor:pointer}
.tabs button{position:relative}
.tabs button.todo::after{content:"";position:absolute;top:7px;left:calc(50% + 9px);width:7px;height:7px;border-radius:50%;background:var(--bad)}
.spintro{padding:20px 0}
.spbadge{display:inline-block;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface2);padding:5px 10px;border-radius:999px}
.sph{font-size:clamp(30px,8vw,40px);letter-spacing:-.035em;line-height:1.1;margin:14px 0 8px}
.spintro>p.muted{margin:0;max-width:44ch}
.skrow .s{font-size:12px;margin-top:2px}
.skbar{display:flex;align-items:center;gap:10px;flex:none}
.skbar .bar{width:72px}
.skbar .num{min-width:38px}
.sptop{position:sticky;top:57px;z-index:4;background:var(--bg);padding:8px 0 4px}
.tbar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ink);transition:width .2s linear}
.spmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.spmeta #tcombo{color:var(--ok);font-weight:600}
.sprint{min-height:auto;justify-content:flex-start;padding-top:28px}
.sprint .chiprow{margin-bottom:20px;gap:8px;flex-wrap:wrap}
.sprint .prompt{margin-bottom:28px}
.tip{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:18px}
.tip b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.newchip{display:inline-flex;align-items:baseline;gap:6px;font-size:13px;background:color-mix(in srgb,var(--mid) 16%,var(--surface));padding:5px 10px;border-radius:999px}
.newchip em{font-style:normal;font-weight:600;color:var(--mid)}
.newchip .fa{font-size:16px;font-weight:600}
.introw{margin:-12px 0 18px}
.target{font-size:13px;color:var(--muted);margin:-22px 0 22px}
.target b{color:var(--ink);font-weight:600}
.gls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-top:12px}
.gl{font-size:12px;color:var(--muted);background:var(--surface);border-radius:8px;padding:4px 8px}
.gl .fa{font-size:15px;color:var(--ink);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="mark">Kāshi<span>کاشی</span></div><div class="topline" id="topline"></div></div><div class="prog"><i id="prog" style="width:0"></i></div></header>
<main id="view"></main>
<div class="sheet" id="sheet" hidden></div>
<nav class="tabs" id="nav" aria-label="Sections"><div class="tabs-in">
  <button data-v="sprint" aria-current="page"><svg viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg>Sprint</button>
  <button data-v="study"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="13" height="14" rx="2.5"/><path d="M8 3.5h9.5A2.5 2.5 0 0 1 20 6v10.5"/></svg>Study</button>
  <button data-v="map"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Map</button>
  <button data-v="deck"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Words</button>
  <button data-v="grammar"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>Grammar</button>
  <button data-v="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>Settings</button>
</div></nav>

function norm(s){

function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);

function grade(card,input){
  const x=norm(input); if(!x)return"empty";
  if(card.fa.some(f=>norm(f)===x))return"ok";
  if(card.fa.some(f=>{const y=norm(f);return y.length>=4&&lev(x,y)===1;}))return"near";
  return"bad";
}

function genFor(skill,ctx){

   case"demo":return GEN.demo(ctx);case"plural":return GEN.plural(ctx);case"poss":return GEN.poss(ctx);
   case"be":return GEN.be(ctx);
   case"neg":return Math.random()<.4?GEN.be(ctx,{neg:true}):GEN.verb(ctx,ctx.has("past")&&Math.random()<.4?"past":"pres",true);
   case"pres":return GEN.verb(ctx,"pres",ctx.has("neg")&&Math.random()<.2);
   case"ra":return GEN.verb(ctx,["pres","past","prog","fut"].filter(t=>ctx.has(t)||t==="pres")[Math.floor(Math.random()*4)]||"pres",false,"ra");
   case"to":return GEN.verb(ctx,ctx.has("past")&&Math.random()<.4?"past":"pres",false,"to");

   case"prog":case"fut":case"pastprog":case"perf":case"pluperf":case"pastsubj":return GEN.verb(ctx,skill,false);

// enumerate accepted answers
function accepts(seqs){const out=new Set();

    acc.forEach(x=>out.add(norm(x)));}
  return out;}
function canon(seqs){return seqs[0].map(s=>s[0]).filter(Boolean).join(" ").replace(/\s+/g," ").trim();}

function sAcc(k){const r=gs(k).r;return r.length?r.reduce((a,b)=>a+b,0)/r.length:null;}
function unlockedLv(){

    const ks=Object.keys(SKILLS).filter(k=>SK_LV(k)===L);
    const n=ks.reduce((a,k)=>a+gs(k).n,0),r=ks.flatMap(k=>gs(k).r);

let SP=null; // running sprint
function chooseSkill(lv,lastK){

  const w=ks.map(k=>{const s=gs(k),a=sAcc(k);let x=s.n<8?3:.6+2.5*(1-a);if(SK_LV(k)===lv&&lv>0)x*=1.5;return x;});

function makeItem(){
  const lv=unlockedLv();

    const pool=Object.keys(S.p).filter(id=>BYID[id]&&DECKS.includes(BYID[id].deck)&&!SP.tw.has(id));
    pool.sort((a,b)=>(S.p[a].due-S.p[b].due)||(S.p[a].l-S.p[b].l));
    for(const id of pool.slice(0,30).sort(()=>Math.random()-.5).slice(0,6)){
      const q=askFor(id,lv);if(q&&!SP.seen.has(q.en)&&q.skills.length){SP.tw.add(id);SP.seen.add(q.en);return{...q,newId:null,retry:false};}}

    const r=genFor(k,ctx);

function spCheck(giveUp){

function verbFormsOf(card){ // -> array of verb objects usable by gen.js form functions
  const out=[];
  for(const alt of card.fa){
    const toks=alt.trim().split(/\s+/),inf=toks[toks.length-1];
    if(!inf.endsWith("ن")||/[()]/.test(alt)||["از","با","به","بر"].includes(inf))continue;
    const sv=SV[inf];if(!sv)continue;
    const pre=[...toks.slice(0,-1),sv.pre].filter(Boolean).join(" ");

    if(pre){v.pre=pre;if(inf==="کردن"){v.sub="کن";delete v.sub2;}}

      case"which":n=qn(()=>true);return n&&{en:`which ${n[1]}?`,seqs:[[["کدام","کدوم"],fa(n[0])]],skills:["ques"],words:[id,n[0]]};
      case"here":case"there":n=qn(()=>true);return n&&{en:`The ${n[1]} is ${k}`,seqs:[[fa(n[0]),k==="here"?["اینجاست","اینجا است","اینجاس","اینجا هست"]:["آنجاست","آنجا است","اونجاست","اونجاس","اونجا هست"]]],skills:["be"],words:[id,n[0]]};
      case"this":case"that":n=qn(()=>true);return n&&{en:`${k} ${n[1]}`,seqs:[[k==="this"?["این"]:["آن","اون"],fa(n[0])]],skills:["demo"],words:[id,n[0]]};
      case"and":case"or":{const a=qn(n=>/food|drink/.test(n[3]));const b=qn(n=>/food|drink/.test(n[3])&&a&&n[0]!==a[0]);
        return a&&b&&{en:`${a[1]} ${k} ${b[1]}`+(k==="or"?"?":""),seqs:[[fa(a[0]),k==="and"?["و"]:["یا"],fa(b[0])]],skills:[],words:[id,a[0],b[0]]};}
      case"with":case"without":n=qn(n=>/person|food|drink|thing/.test(n[3]));return n&&{en:`${k} ${k==="with"?"the ":""}${n[1]}`,seqs:[[k==="with"?["با"]:["بدون","بی"],fa(n[0])]],skills:["prep"],words:[id,n[0]]};
    }return null;});}
  return out;}
// phrases containing the word
function phraseFor(id){
  const ok=PHR.filter(x=>x.ids.includes(id)&&x.ids.every(o=>o===id||known(o)));
  if(!ok.length)return null;const x=rnd(ok);
  return{en:x.c.en,seqs:x.c.fa.map(f=>[[f]]),skills:[],words:x.ids,phrase:true};}
// build a question for a target word
function askFor(id,lv){
  const has=k=>!SKILLS[k]||SK_LV(k)<=lv;
  const fr=framesFor(id,has).sort(()=>Math.random()-.5);
  if(Math.random()<.3){const p=phraseFor(id);if(p)fr.unshift(()=>p);}
  for(const f of fr){const r=f();if(r&&r.seqs)return{...r,target:id,acc:accepts(r.seqs),canon:canon(r.seqs),newId:known(id)?null:id};}
  const p=phraseFor(id);if(p)return{...p,target:id,acc:accepts(p.seqs),canon:canon(p.seqs),newId:known(id)?null:id};
  return null;}
