n its territory if its use is in the interest of public health or patient safety or health. The Commission may extend such an authorisation to the whole Union in exceptional cases.|Art. 59\nWhat is a certificate of free sale?|For export, at the manufacturer's or AR's request, the Member State of its registered place of business issues a certificate declaring that it is properly registered and that the CE-marked device may be legally placed on the Union market. Valid for at most five years and never beyond the device's certificate.|Art. 60\n#VI|Chapter VI|Clinical evaluation and clinical investigations|Art. 61–82\nOn what must confirmation of conformity with the GSPR be based (Art. 61(1))?|On clinical data providing sufficient clinical evidence, including relevant PMS data (Annex III). The manufacturer specifies and justifies the level of clinical evidence needed, appropriate to the characteristics and intended purpose of the device, and plans, conducts and documents a clinical evaluation per Art. 61 and Annex XIV Part A.|Art. 61(1), (3)\nBefore its clinical evaluation, whom may the manufacturer of a class III or class IIb drug-delivery device consult?|An expert panel, to review its intended clinical development strategy and proposals for clinical investigation. The manufacturer must give due consideration to the panel's views.|Art. 61(2)\nFor which devices are clinical investigations required by default?|Implantable devices and class III devices, unless an exemption in Art. 61(4)–(6) applies.|Art. 61(4)\nWhen can a class III or implantable device be exempt from a new clinical investigation based on equivalence?|When it modifies a device already marketed by the same manufacturer, equivalence is demonstrated and endorsed by the notified body and the clinical evaluation suffices; or when it is equivalent to another manufacturer's marketed device and a contract explicitly allows full, ongoing access to that technical documentation, with the original clinical evaluation done per the MDR.|Art. 61(4)–(5)\nWhich other cases are exempt from mandatory clinical investigations under Art. 61(6)?|(a) Devices lawfully placed on the market under the former directives whose clinical evaluation is based on sufficient clinical data and complies with product-specific CS where available; (b) sutures, staples, dental fillings, dental braces, tooth crowns, screws, wedges, plates, wires, pins, clips and connectors, with sufficient clinical data and compliance with CS where available.|Art. 61(6)\nWhen may conformity be shown without clinical data (Art. 61(10))?|Where clinical data are not deemed appropriate, with adequate justification based on the risk management results and the device-body interaction, the intended clinical performance and the manufacturer's claims. The adequacy of non-clinical methods alone (performance evaluation, bench testing, pre-clinical evaluation) must be substantiated in the technical documentation.|Art. 61(10)\nWhat are the three kinds of characteristics compared to demonstrate equivalence?|Technical (design, conditions of use, specifications and properties, deployment methods, principles of operation, critical performance requirements, software algorithms); biological (same materials or substances in contact with the same tissues or body fluids for similar duration and release characteristics); clinical (same clinical condition or purpose, same site in the body, similar population, same kind of user, similar critical performance). There must be no clinically significant difference in safety and clinical performance.|Annex XIV Part A 3\nHow is the clinical evaluation documented and kept current?|In a clinical evaluation report (CER), part of the technical documentation. The evaluation is updated throughout the device's life cycle with data from the PMCF plan and the PMS plan; for class III and implantable devices, the PMCF evaluation report (and SSCP if indicated) is updated at least annually.|Art. 61(11)–(12)\nList the five stages of the clinical evaluation process in Annex XIV Part A.|(1) Establish and update a clinical evaluation plan; (2) identify available clinical data and gaps through a systematic scientific literature review; (3) appraise all relevant clinical data for suitability; (4) generate any new or additional clinical data needed through properly designed clinical investigations; (5) analyse all relevant data to reach conclusions on safety and clinical performance, including clinical benefits.|Annex XIV Part A 1\nName five items a clinical evaluation plan must contain.|The GSPR requiring clinical data; the intended purpose; target groups with indications and contra-indications; intended clinical benefits with clinical outcome parameters; methods to examine clinical safety (residual risks, side-effects); parameters for benefit-risk acceptability based on the state of the art; how benefit-risk of specific components is addressed; a clinical development plan from exploratory to confirmatory investigations and PMCF, with milestones and acceptance criteria.|Annex XIV Part A 1(a)\nFor which three purposes are clinical investigations conducted under Art. 62(1)?|(a) To establish and verify that the device achieves its intended performance under normal conditions of use; (b) to establish and verify the clinical benefits specified by the manufacturer; (c) to establish and verify clinical safety, determine undesirable side-effects, and assess whether they are acceptable risks weighed against the benefits.|Art. 62(1)\nWhat must a sponsor established outside the EU do?|Ensure that a natural or legal person is established in the Union as its legal representative, responsible for ensuring the sponsor's obligations and acting as addressee of all communications. Member States may waive this for investigations only on their territory, if a contact person is established there.|Art. 62(2)\nWhat ethical review requirements apply to clinical investigations?|They are subject to scientific and ethical review; the ethical review is performed by an ethics committee under national law, and at least one lay person takes part. The investigation may not proceed if the ethics committee has issued a negative opinion valid for the whole Member State.|Art. 62(3)–(4)\nName five conditions for conducting a clinical investigation under Art. 62(4).|Authorisation by the Member State(s); no negative ethics committee opinion; sponsor or legal representative in the Union; protection of vulnerable subjects; anticipated benefits justify foreseeable risks (monitored constantly); informed consent; rights to integrity, privacy and data protection safeguarded; as little pain, discomfort and fear as possible; medical care under a qualified doctor (or dentist); no undue influence, incl. financial; device conforms to the GSPR apart from aspects under investigation.|Art. 62(4)\nWhat must informed consent include?|Written, dated and signed by the interviewer and the subject (or legally designated representative) after being informed of: the nature, objectives, benefits, implications, risks and inconveniences; the subject's rights, incl. to refuse and withdraw at any time without detriment or justification; the conditions and expected duration; possible treatment alternatives; the compensation system; the EU-wide unique identification number of the investigation; and availability of results. The subject receives a copy.|Art. 63\nWhich subject groups receive special protection in clinical investigations?|Incapacitated subjects (Art. 64), minors (Art. 65), pregnant or breastfeeding women (Art. 66); Member States may add measures for persons in military service, deprived of liberty, excluded by judicial decision, or in residential care (Art. 67); and there are special rules for emergency situations (Art. 68).|Art. 64–68\nHow is damage to subjects compensated?|Member States ensure systems for compensation of damage suffered by a subject from participation in a clinical investigation on their territory, in the form of insurance, a guarantee or an equivalent arrangement appropriate to the nature and extent of the risk.|Art. 69\nWhat are the validation timelines for a clinical investigation application?|The sponsor applies via Eudamed with the Annex XV Chapter II documentation. Within 10 days the Member State notifies whether the investigation is in scope and the application complete. If not, the sponsor has up to 10 days to complete it (extendable by up to 20 days).|Art. 70(1)–(3)\nWhen may a clinical investigation start after validation?|For class I or non-invasive class IIa/IIb investigational devices: immediately after the validation date, unless national law provides otherwise and provided no negative ethics committee opinion was issued. For other devices: once the Member State has authorised it, which it must decide within 45 days of the validation date (extendable by 20 days for expert consultation).|Art. 70(7)\nWhat is required for a PMCF investigation with a CE-marked device used within its intended purpose?|If subjects undergo additional procedures that are invasive or burdensome, the sponsor notifies the Member States concerned via Eudamed at least 30 days before it starts. Using a CE-marked device outside its intended purpose triggers the full Art. 62–81 regime.|Art. 74\nWhat is the procedure for a substantial modification to a clinical investigation?|The sponsor notifies the Member States via Eudamed within one week, with updated documentation. It may implement the change at the earliest 38 days after notification, unless the Member State refuses or an ethics committee issues a negative opinion; the Member State may extend the period by 7 days to consult experts.|Art. 75\nWhat must the sponsor report at the end, temporary halt or early termination of an investigation?|Inform the Member States within 15 days of a temporary halt or early termination (within 24 hours if for safety reasons) and within 15 days of the end. Submit the clinical investigation report, with a summary understandable to the intended user, within one year of the end, or within three months of early termination or a temporary halt, regardless of the outcome.|Art. 77\nWhen does the coordinated assessment procedure for multinational investigations become mandatory?|It is voluntary for Member States until 26 May 2027 and applies to all Member States from 27 May 2027. A coordinating Member State leads the assessment of a single application.|Art. 78(14)\nWhich events must the sponsor record, and which must it report without delay?|Record: adverse events identified as critical in the CIP, serious adverse events, device deficiencies that might have led to an SAE, and new findings. Report without delay via Eudamed: SAEs with a causal relationship to the device, comparator or procedure (or where one is reasonably possible), device deficiencies that might have led to an SAE, and new findings on these.|Art. 80(1)–(2)\nWhat rules apply to clinical investigations not done for conformity assessment purposes?|Art. 82: they must meet core requirements of Art. 62 (e.g. ethics, protection of subjects, consent, qualified investigators) and any additional national rules Member States adopt.|Art. 82\nWhat are the requirements for investigators and investigation sites?|The investigator must practise a profession recognised in the Member State as qualifying for that role, with the necessary scientific knowledge and patient-care experience; other staff must be suitably qualified. Facilities must be suitable and similar to those where the device is intended to be used.|Art. 62(6)–(7)\n#VII|Chapter VII|Post-market surveillance, vigilance and market surveillance|Art. 83–100\nWhat is the manufacturer's post-market surveillance system (Art. 83)?|For each device, a PMS system planned, established, documented, implemented, maintained and updated in proportion to the risk class and type of device, as an integral part of the QMS. It actively and systematically gathers, records and analyses data on quality, performance and safety throughout the device's lifetime, to draw conclusions and to determine, implement and monitor preventive and corrective actions.|Art. 83(1)–(2)\nName five uses of PMS data under Art. 83(3).|Update the benefit-risk determination and risk management; update design and manufacturing information, instructions for use and labelling; update the clinical evaluation; update the SSCP; identify needs for preventive, corrective or field safety corrective action; identify options to improve usability, performance and safety; contribute to PMS of other devices; detect and report trends (Art. 88).|Art. 83(3)\nWhat is the PMS plan and where is it described?|The plan on which the PMS system is based (Art. 84). Its requirements are in Annex III section 1.1, and for devices other than custom-made it is part of the technical documentation.|Art. 84\nWhich classes need a PMS report and which a PSUR?|Class I: a PMS report (Art. 85), updated when necessary and made available to the competent authority on request. Class IIa, IIb and III: a periodic safety update report (PSUR, Art. 86).|Art. 85–86\nHow often must the PSUR be updated?|Class IIb and class III: at least annually. Class IIa: when necessary and at least every two years.|Art. 86(1)\nWhat must a PSUR contain?|A summary of the results and conclusions of PMS data analysis with the rationale and description of preventive and corrective actions, plus: conclusions of the benefit-risk determination; main PMCF findings; and sales volume with an estimate of the size and characteristics of the population using the device and, where practicable, its usage frequency.|Art. 86(1)\nHow is the PSUR handled for class III and implantable devices?|The manufacturer submits it via Eudamed to the notified body involved in conformity assessment; the notified body reviews it and adds its evaluation, with details of any action taken, to Eudamed. For other devices, the PSUR is made available to the notified body and, on request, competent authorities.|Art. 86(2)–(3)\nWhat must manufacturers report under Art. 87(1)?|(a) Any serious incident involving devices made available on the Union market, except expected side-effects clearly documented in the product information, quantified in the technical documentation and subject to trend reporting; (b) any FSCA for devices made available on the Union market, including FSCAs in third countries for devices also legally on the Union market, unless the reason is limited to the third-country device.|Art. 87(1)\nWhat are the reporting deadlines for serious incidents?|Immediately after establishing a causal relationship (or that one is reasonably possible), and at most 15 days after becoming aware. Serious public health threat: at most 2 days. Death or unanticipated serious deterioration in health: at most 10 days. An initial incomplete report may be followed by a complete one.|Art. 87(3)–(5)\nWhen must an FSCA be reported?|In advance of the FSCA being undertaken, except in urgent cases where the manufacturer must act immediately.|Art. 87(8)\nWhat are periodic summary reports?|For similar serious incidents with the same device or device type whose root cause is identified or for which an FSCA is implemented, or that are common and well documented, the manufacturer may submit periodic summary reports instead of individual reports, if the coordinating competent authority agrees the format, content and frequency.|Art. 87(9)\nWhat must be reported under trend reporting (Art. 88)?|Any statistically significant increase in the frequency or severity of incidents that are not serious incidents, or of expected undesirable side-effects, that could significantly affect the benefit-risk analysis and has led or may lead to unacceptable risks. The comparison is to the foreseeable frequency or severity in the technical documentation; the method and observation period are set in the PMS plan.|Art. 88\nWhat must the manufacturer do after reporting a serious incident?|Investigate without delay, including a risk assessment of the incident and any FSCA; cooperate with competent authorities and the notified body; and not alter the device or a sample of the batch in a way that could affect evaluation of the causes before informing the competent authorities.|Art. 89(1)\nWhat must a field safety notice contain and how is it handled?|It is sent without delay to users in the required languages. Except in urgent cases, the draft goes to the competent authority for comments. It must identify the devices (incl. UDIs) and the manufacturer (incl. SRN), explain clearly, without understating the risk, the reasons for the FSCA, and state all actions users must take. It is published in Eudamed.|Art. 89(8)\nWhat is the coordinating competent authority in vigilance?|For serious incidents or FSCAs affecting more than one Member State, a coordinating competent authority leads the assessment, by default that of the Member State where the manufacturer (or its authorised representative) has its registered place of business.|Art. 89(9)\nHow are healthcare professionals and patients involved in vigilance?|Member States encourage and enable healthcare professionals, users and patients to report suspected serious incidents to competent authorities (e.g. via information campaigns and standard web forms). Authorities record these reports centrally and inform the manufacturer.|Art. 87(10)–(11)\nWhat does the Eudamed vigilance and PMS system collect?|Manufacturers' serious incident and FSCA reports, periodic summary reports, trend reports, PSURs, field safety notices, and information exchanged between competent authorities and with the Commission.|Art. 92(1)\nName five market surveillance powers or duties of competent authorities.|Check conformity and performance, incl. document reviews and physical or laboratory checks on samples; draw up annual surveillance activity plans with adequate resources; require documentation from economic operators; enter premises and carry out announced and, if necessary, unannounced inspections; obtain samples free of charge; destroy or render inoperable devices presenting an unacceptable risk or falsified devices; review their surveillance activities at least every four years.|Art. 93\nWhat happens when a device presents an unacceptable risk (Art. 95)?|The competent authority requires the economic operators to take appropriate corrective action without delay: bring the device into compliance, restrict its making available, impose specific requirements, withdraw or recall it within a defined period. It notifies the Commission, other Member States and the notified body via Eudamed; if operators fail to act, it takes provisional measures, which may trigger the Union procedure.|Art. 95\nHow are non-compliances without unacceptable risk handled (Art. 97)?|E.g. incorrect CE marking, missing declaration of conformity, missing registration or technical documentation: the competent authority requires the economic operator to end the non-compliance within a reasonable, proportionate period. If it persists, the Member State restricts or prohibits making the device available or ensures recall or withdrawal.|Art. 97\nWhat are preventive health protection measures (Art. 98)?|Where a Member State's evaluation shows a potential risk related to a device or a category or group of devices, it may take justified transitional measures to prohibit, restrict or set requirements for their making available, or to withdraw or recall them. The Commission may then adopt Union-wide implementing measures.|Art. 98\nWhich principles of good administrative practice apply to authority measures?|Each measure states its exact grounds, is notified without delay to the operator with information on remedies, and, unless urgent, the operator may first make submissions. Measures are withdrawn or amended promptly once the operator shows effective action.|Art. 99\nWhat does the Eudamed market surveillance system collect?|Summaries of market surveillance results, final inspection reports, information on devices presenting unacceptable risks, on non-compliance, on preventive health protection measures, and summaries of reviews of market surveillance activities.|Art. 100\n#VIII|Chapter VIII|Cooperation, MDCG, expert panels and registers|Art. 101–108\nWhat must Member States do regarding competent authorities (Art. 101)?|Designate the competent authority or authorities for implementing the MDR, give them the necessary powers, resources, equipment and knowledge, and communicate their names and contact details to the Commission, which publishes a list.|Art. 101\nWhat does Art. 102 require on cooperation?|Competent authorities cooperate with each other and with the Commission, which organises the exchange of information needed for uniform application. Member States take part in international initiatives (e.g. IMDRF) on cooperation between regulators.|Art. 102\nWhat is the composition of the Medical Device Coordination Group (MDCG)?|Each Member State appoints one member and one alternate with expertise in medical devices, and one member and one alternate with expertise in IVDs (one person may cover both). Members serve three-year renewable terms. A Commission representative chairs without voting. The MDCG may set up sub-groups.|Art. 103\nName four tasks of the MDCG.|Contribute to assessing conformity assessment bodies and notified bodies; contribute to guidance for harmonised implementation (MDCG guidance documents), e.g. on notified bodies, GSPR, clinical evaluation and investigation, and vigilance; monitor technical progress; assist authorities in coordinating clinical investigation and vigilance; advise the Commission on implementation; contribute to standards and common specifications.|Art. 105\nWhat do expert panels do under the MDR?|Designated by the Commission in relevant medical fields, they give scientific opinions in the clinical evaluation consultation procedure (Art. 54), advise manufacturers on clinical development strategy (Art. 61(2)), and advise on common specifications and guidance. Since 2022 the EMA provides their secretariat (Regulation (EU) 2022/123).|Art. 106\nWhat conflict-of-interest rules apply to MDCG members and experts?|They must have no financial or other interests in the medical device industry that could affect their impartiality, must act in the public interest and independently, and must declare their direct and indirect interests, keep the declaration up to date, and have it published on the Commission website.|Art. 107\nWhat does Art. 108 say about device registers?|The Commission and Member States encourage registers and databanks for specific types of devices, with common principles for comparable data, to support independent evaluation of long-term safety and performance and the traceability of implantable devices.|Art. 108\nWhat support does the Commission give the MDCG (Art. 104)?|It supports cooperation between national competent authorities, organises exchanges of experience, and provides technical, scientific and logistic support to the MDCG and its sub-groups.|Art. 104\n#IX|Chapter IX|Confidentiality, data protection, funding and penalties|Art. 109–113\nWhich three interests does the MDR's confidentiality rule protect?|(a) Personal data; (b) commercially confidential information and trade secrets, including intellectual property rights, unless disclosure is in the public interest; (c) the effective implementation of the MDR, in particular inspections, investigations and audits.|Art. 109(1)\nWhich data protection law applies to processing under the MDR?|Member States apply EU data protection law (Directive 95/46/EC, now the GDPR, Regulation (EU) 2016/679); the Commission applies Regulation (EC) 45/2001 (now Regulation (EU) 2018/1725).|Art. 110\nMay Member States charge fees for MDR activities?|Yes, if the fees are set transparently and on cost-recovery principles. Member States inform the Commission and other Member States at least three months before adopting the fee structure and level, and make it publicly available on request.|Art. 111\nWho pays for the joint assessment of notified bodies?|The Commission covers the costs of joint assessment activities and sets the scale and structure of recoverable fees by implementing acts.|Art. 112\nWhat does the MDR require regarding penalties?|Member States lay down penalties for infringements of the MDR and ensure they are implemented. Penalties must be effective, proportionate and dissuasive. Member States notified their rules to the Commission by 25 February 2020.|Art. 113\n#X|Chapter X|Final provisions, transition and amendments|Art. 114–123\nWhich committee assists the Commission under the MDR?|The Committee on Medical Devices, a comitology committee under Regulation (EU) 182/2011. The examination procedure applies to implementing acts; if the committee gives no opinion, the Commission does not adopt the draft.|Art. 114\nHow do delegated acts under the MDR work?|The Commission's power to adopt delegated acts was conferred for five years from 25 May 2017, tacitly extended; the Parliament or Council can revoke it, and a delegated act enters into force only if neither objects within three months (extendable by three).|Art. 115\nWhich other EU acts did the MDR amend?|Directive 2001/83/EC on medicinal products (Art. 117, device part of drug-device combinations), Regulation (EC) 178/2002 on food (Art. 118, devices are not food) and Regulation (EC) 1223/2009 on cosmetics (Art. 119, borderline decisions by the Commission).|Art. 117–119\nWhich MDR requirements apply to legacy devices during the transition?|The MDR requirements on post-market surveillance, market surveillance, vigilance and registration of economic operators and devices apply instead of the corresponding requirements of the directives.|Art. 120(3)\nUntil when may legacy devices be placed on the market under Regulation (EU) 2023/607?|Until 31 December 2027 for class III devices and class IIb implantable devices (except WET items such as sutures, staples, dental fillings, braces, crowns, screws, wedges, plates, wires, pins, clips and connectors); until 31 December 2028 for other class IIb devices, class IIa devices, and class I devices that are sterile or have a measuring function.|Art. 120(3a)\nWhat conditions must a legacy device meet to use the extended transition?|It continues to comply with the relevant directive; no significant changes in design or intended purpose; no unacceptable risk to health or safety; the manufacturer had an MDR QMS (Art. 10(9)) by 26 May 2024; and the manufacturer lodged a formal application with a notified body by 26 May 2024 and signed a written agreement with it by 26 September 2024.|Art. 120(3c)\nWhich directive certificates benefit from the 2023/607 extension?|Certificates issued under the directives from 25 May 2017 that were still valid on 26 May 2021 and not withdrawn later. Certificates that expired before 20 March 2023 also qualify if, before expiry, the manufacturer had signed an agreement with a notified body, or a competent authority granted a derogation (Art. 59) or required the conformity assessment (Art. 97).|Art. 120(2)\nWhat happened to the \"sell-off\" date for legacy devices?|The original Art. 120(4) allowed devices already placed on the market to be made available until 27 May 2025. Regulation (EU) 2023/607 deleted this sell-off date, so devices lawfully placed on the market can remain available without a time limit.|Art. 120(4)\nWhat did Regulation (EU) 2020/561 do?|Adopted in April 2020 in response to COVID-19, it postponed the MDR's date of application by one year, from 26 May 2020 to 26 May 2021, and allowed Union-wide derogations from conformity assessment.|Reg. 2020/561\nWhat did Regulation (EU) 2024/1860 change?|It allowed a gradual, module-by-module roll-out of Eudamed; introduced Art. 10a (advance notice of supply interruption or discontinuation, applicable from 10 January 2025); and extended the IVDR transition periods.|Reg. 2024/1860\nWhen must the Commission evaluate the MDR?|By 27 May 2027, the Commission assesses the application of the MDR and produces an evaluation report on progress towards its objectives.|Art. 121\nWhich provisions applied before 26 May 2021?|The notified body provisions (Art. 35–50) and Art. 101 and 103 (competent authorities, MDCG) from 26 November 2017; Art. 102 (cooperation) from 26 May 2018.|Art. 123(3)\n#AI|Annex I|General safety and performance requirements (GSPR)|Annex I\nHow is Annex I structured?|Chapter I: general requirements (sections 1–9); Chapter II: requirements regarding design and manufacture (sections 10–22); Chapter III: requirements regarding the information supplied with the device, i.e. label and instructions for use (section 23).|Annex I\nWhat does GSPR 1 require?|Devices achieve the performance intended by the manufacturer and are designed and manufactured so that, in normal conditions of use, they are suitable for their intended purpose. They are safe and effective and do not compromise the clinical condition or safety of patients or the safety and health of users or others, provided risks are acceptable when weighed against the benefits to the patient and compatible with a high level of protection, taking into account the generally acknowledged state of the art.|Annex I 1\nWhat does \"reduce risks as far as possible\" mean in GSPR 2?|Reducing risks as far as possible without adversely affecting the benefit-risk ratio.|Annex I 2\nList the risk management steps in GSPR 3.|(a) Establish and document a risk management plan for each device; (b) identify and analyse known and foreseeable hazards; (c) estimate and evaluate risks during intended use and reasonably foreseeable misuse; (d) eliminate or control those risks per GSPR 4; (e) evaluate the impact of production and PMS information on hazards, risks, overall risk, benefit-risk ratio and acceptability; (f) amend control measures if necessary. It is a continuous iterative process over the whole life cycle.|Annex I 3\nIn which order of priority must risk control measures be applied (GSPR 4)?|(a) Eliminate or reduce risks as far as possible through safe design and manufacture; (b) where appropriate, take adequate protection measures, incl. alarms if necessary, for risks that cannot be eliminated; (c) provide information for safety (warnings, precautions, contra-indications) and, where appropriate, training to users. Users must be informed of any residual risks.|Annex I 4\nWhat does GSPR 5 require regarding use error?|Reduce as far as possible the risks related to the ergonomic features of the device and its use environment (design for patient safety), and take into account the technical knowledge, experience, education, training and use environment, and the medical and physical conditions of intended users (design for lay, professional, disabled or other users).|Annex I 5\nWhat do GSPR 6 and 7 require?|GSPR 6: characteristics and performance must not be adversely affected, to the point of compromising health or safety, during the lifetime indicated by the manufacturer under the stresses of normal use and proper maintenance. GSPR 7: design, manufacture and packaging must ensure transport and storage (e.g. temperature and humidity fluctuations) do not adversely affect characteristics and performance.|Annex I 6–7\nWhat does GSPR 8 require?|All known and foreseeable risks and any undesirable side-effects are minimised and acceptable when weighed against the evaluated benefits to the patient and/or user arising from the device's achieved performance during normal conditions of use.|Annex I 8\nHow does GSPR 9 apply the safety requirements to Annex XVI products?|For products without an intended medical purpose, sections 1 and 8 mean the device, used as intended, presents no risk at all, or no more than the maximum acceptable risk related to the product's use consistent with a high level of protection of health and safety.|Annex I 9\nWhat limit applies to CMR and endocrine-disrupting substances in certain devices (GSPR 10.4.1)?|Invasive devices in direct contact with the body, or devices that (re)administer or transport or store medicines, body liquids or other substances, may contain CMR substances of category 1A or 1B or endocrine-disrupting substances in a concentration above 0.1% weight by weight only if justified per section 10.4.2.|Annex I 10.4.1\nWhat must the justification for CMR or endocrine-disrupting substances above 0.1% w/w cover?|An analysis and estimation of patient or user exposure; an analysis of possible alternative substances, materials or designs and their availability (incl. independent research, peer-reviewed studies and scientific committee opinions); why substitutes or design changes are inappropriate for functionality, performance and benefit-risk, incl. for children and pregnant or breastfeeding women; and the latest relevant scientific committee guidelines (SCHEER).|Annex I 10.4.2\nWhat labelling applies when CMR or endocrine-disrupting substances exceed 0.1% w/w?|Their presence is labelled on the device and/or the packaging of each unit or the sales packaging, with the list of substances. If use includes children, pregnant or breastfeeding women or other vulnerable groups, a specific justification is in the technical documentation and the IFU gives information on residual risks and precautionary measures.|Annex I 10.4.5\nWhat do the GSPR require for nanomaterials?|Devices are designed and manufactured to reduce as far as possible the risks related to the size and properties of particles, incl. nanomaterials, released or releasable into the patient's or user's body, unless they contact only intact skin. Special care applies where internal exposure potential is high or medium (see Rule 19).|Annex I 10.6\nWhat do the GSPR require for software (section 17)?|Repeatability, reliability and performance in line with intended use, with means to reduce risks in a single fault condition (17.1); development per the state of the art, considering the development life cycle, risk management incl. information security, verification and validation (17.2); account of mobile platform features and external factors (17.3); manufacturers set minimum requirements for hardware, IT network characteristics and IT security measures, incl. protection against unauthorised access (17.4).|Annex I 17\nWhat do the GSPR require for devices used by lay persons (section 22)?|Appropriate performance considering lay persons' skills and means and the variation in their technique and environment; information and instructions easy to understand and apply; reduced risk of error in handling, preparation and interpretation; and, where reasonably possible, a way for the lay person to verify that the device works as intended and to be warned if it failed to give a valid result.|Annex I 22\nName eight items that must appear on the label (GSPR 23.2).|Device name or trade name; details to identify the device, its content and intended purpose; manufacturer name and address; authorised representative name and address (if outside the EU); medicinal substance, blood/plasma derivative or tissue content; CMR/ED labelling; lot or serial number; UDI carrier; use-by date (at least year and month) or date of manufacture; storage and handling conditions; sterile state and method; warnings and precautions; single use; reprocessed single-use status and cycles; \"custom-made device\"; indication that it is a medical device; composition for absorbed substances; \"exclusively for clinical investigation\".|Annex I 23.2\nWhen may instructions for use be omitted or provided electronically?|IFU may be omitted for class I and IIa devices that can be used safely without them. IFU may be provided electronically instead of on paper only as allowed by Commission Implementing Regulation (EU) 2021/2226 on electronic instructions for use, which is limited to devices for professional users.|Annex I 23.1(d), (f)\n#AII|Annex II–III|Technical documentation and PMS documentation|Annex II–III\nWhat are the six main sections of the technical documentation in Annex II?|(1) Device description and specification, incl. variants and accessories; (2) information to be supplied by the manufacturer (labels, IFU); (3) design and manufacturing information; (4) general safety and performance requirements (GSPR checklist with methods, standards and CS); (5) benefit-risk analysis and risk management; (6) product verification and validation (pre-clinical and clinical data).|Annex II\nWhat belongs in the device description section of the technical documentation (Annex II 1)?|Product or trade name and general description, intended purpose and users; Basic UDI-DI; intended patient population, indications, contra-indications and warnings; principles of operation and mode of action; qualification as a device; risk class and classification rule; novel features; accessories and other devices used in combination; variants and configurations; key components, materials and specifications; previous and similar generations of the device.|Annex II 1\nWhat does product verification and validation in Annex II section 6 include?|Pre-clinical and clinical data: results of tests (engineering, laboratory, simulated use, animal), biocompatibility, physical, chemical and microbiological characterisation, electrical safety and EMC, software verification and validation, stability and shelf life, performance and safety; the clinical evaluation report, PMCF plan and PMCF evaluation report. Section 6.2 adds information for specific cases (medicinal substance, human or animal tissue, absorbed substances, CMR/ED, sterile, measuring function, connected devices).|Annex II 6\nWhat does Annex III require for the PMS plan? Name five elements.|Collection of information (serious incidents, PSUR data, FSCAs, non-serious incidents and side-effects, trend reporting, literature, databases and registers, user, distributor and importer feedback and complaints, public information on similar devices); methods to assess data; indicators and thresholds for benefit-risk reassessment; complaint investigation tools; trend reporting methodology and observation period; communication with authorities, notified bodies, operators and users; procedures for Art. 83, 84 and 86; procedures for corrective action; traceability tools; and a PMCF plan or a justification why none is needed.|Annex III 1.1\nWhat does section 1.2 of Annex III cover?|The periodic safety update report (Art. 86) and the post-market surveillance report (Art. 85) as part of the technical documentation on post-market surveillance.|Annex III 1.2\n#AIV|Annex IV–VI|Declaration of conformity, CE marking, registration and UDI|Annex IV–VI\nName six elements of the EU declaration of conformity (Annex IV).|Manufacturer (and AR) name, registered trade name or mark, SRN and address; statement that it is issued under the manufacturer's sole responsibility; Basic UDI-DI; product and trade name, product code or other reference and intended purpose; risk class; statement of conformity with the MDR and other relevant Union legislation; references to common specifications used; notified body name and number, procedure and certificate(s); additional information; place and date of issue, signatory's name and function, signature.|Annex IV\nWhat are the design rules for the CE marking (Annex V)?|The initials \"CE\" in the prescribed form; if reduced or enlarged, the proportions of the graduated drawing must be respected; the components must have substantially the same vertical dimension, at least 5 mm (this minimum may be waived for small-scale devices).|Annex V\nHow is Annex VI structured?|Part A: information submitted when registering devices and economic operators (Art. 29(4), 31); Part B: core data elements for the UDI database with the UDI-DI (Art. 28, 29); Part C: the UDI system (definitions, general requirements, UDI-DI, UDI-PI, UDI carrier, specific rules e.g. for software and systems).|Annex VI\nWhen does a change require a new UDI-DI?|Whenever a change could lead to misidentification of the device or ambiguity in its traceability, in particular a change of: name or trade name, version or model, labelled as single use, packaged sterile, need for sterilisation before use, quantity of devices in a package, critical warnings or contra-indications (e.g. latex or DEHP).|Annex VI Part C 3.9\nWhen does software need a new UDI-DI rather than a new UDI-PI?|A new UDI-DI is needed for modifications that change the original performance, the safety or intended use, or the interpretation of data (e.g. new or modified algorithms, database structures, operating platform, architecture, user interfaces or interoperability channels). Minor revisions (bug fixes, usability enhancements not for safety, security patches, operating efficiency) need only a new UDI-PI.|Annex VI Part C 6.5\n#AVIII|Annex VIII|Classification rules|Annex VIII\nHow many classification rules are there and how are they grouped?|22 rules: non-invasive devices (Rules 1–4), invasive devices (Rules 5–8), active devices (Rules 9–13) and special rules (Rules 14–22).|Annex VIII Ch. III\nDefine transient, short-term and long-term use.|Transient: normally intended for continuous use for less than 60 minutes. Short-term: between 60 minutes and 30 days. Long-term: more than 30 days.|Annex VIII 1.1–1.3\nWhich rule applies if several classification rules apply to one device?|The strictest rule and sub-rule, giving the higher class.|Annex VIII 3.5\nHow are accessories and software classified?|Accessories are classified in their own right, separately from the device they are used with. Software that drives or influences the use of a device has the same class as that device; standalone software is classified in its own right.|Annex VIII 3.2–3.3\nState Rule 1.|All non-invasive devices are class I, unless one of the other rules applies.|Annex VIII Rule 1\nState Rule 2.|Non-invasive devices for channelling or storing blood, body liquids, cells or tissues, liquids or gases for eventual infusion, administration or introduction into the body are class IIa if they may be connected to a class IIa, IIb or III active device, or if used for channelling or storing blood or other body liquids or storing organs, parts of organs or body cells and tissues; blood bags are class IIb. Otherwise class I.|Annex VIII Rule 2\nState Rule 3.|Non-invasive devices modifying the biological or chemical composition of human tissues or cells, blood, other body liquids or other liquids intended for implantation or administration into the body are class IIb, or class IIa if the treatment is filtration, centrifugation or exchange of gas or heat. Substances used in vitro in direct contact with human cells, tissues or organs, or with embryos, before implantation or administration are class III.|Annex VIII Rule 3\nState Rule 4.|Non-invasive devices contacting injured skin or mucous membrane: class I as a mechanical barrier, for compression or for absorption of exudates; class IIb if mainly for wounds that breach the dermis or mucous membrane and can only heal by secondary intent; class IIa if mainly to manage the micro-environment of injured skin or mucous membrane; class IIa in all other cases.|Annex VIII Rule 4\nState Rule 5.|Invasive devices via body orifices (not surgically invasive), not connected to an active device or connected to a class I active device: transient use class I; short-term class IIa (class I in the oral cavity up to the pharynx, ear canal up to the eardrum, or nasal cavity); long-term class IIb (class IIa in those cavities if not absorbable by the mucous membrane). If connected to a class IIa, IIb or III active device: class IIa.|Annex VIII Rule 5\nState Rule 6.|Surgically invasive devices for transient use are class IIa, unless: reusable surgical instruments (class I); specifically to control, diagnose, monitor or correct a defect of the heart or central circulatory system by direct contact, or in direct contact with the heart, central circulatory system or central nervous system (class III); supply ionising radiation energy (class IIb); have a biological effect or are wholly or mainly absorbed (class IIb); administer medicinal products in a potentially hazardous way (class IIb).|Annex VIII Rule 6\nState Rule 7.|Surgically invasive devices for short-term use are class IIa, unless: for the heart or central circulatory system by direct contact, or in direct contact with the heart, central circulatory system or central nervous system (class III); supply ionising radiation (class IIb); have a biological effect or are wholly or mainly absorbed (class III); undergo chemical change in the body, except in the teeth, or administer medicines (class IIb).|Annex VIII Rule 7\nState Rule 8.|Implantable and long-term surgically invasive devices are class IIb, unless: placed in the teeth (class IIa); in direct contact with the heart, central circulatory system or central nervous system (class III); biological effect or wholly or mainly absorbed (class III); chemical change in the body (except teeth) or administering medicines (class III); active implantable devices or their accessories, breast implants, surgical meshes, total or partial joint replacements, spinal disc replacements or implants contacting the spinal column (class III; ancillary screws, wedges, plates and instruments excepted).|Annex VIII Rule 8\nState Rule 9.|Active therapeutic devices administering or exchanging energy are class IIa, or class IIb if they do so in a potentially hazardous way (nature, density and site of the energy). Devices controlling, monitoring or directly influencing class IIb active therapeutic devices, or emitting ionising radiation for therapy (and their controllers), are class IIb. Devices controlling, monitoring or directly influencing active implantable devices are class III.|Annex VIII Rule 9\nState Rule 10.|Active diagnostic and monitoring devices are class IIa if they supply energy absorbed by the body (class I if only illuminating the body in the visible spectrum), image in vivo distribution of radiopharmaceuticals, or allow direct diagnosis or monitoring of vital physiological processes. Class IIb if monitoring vital parameters whose variations could result in immediate danger, or for diagnosis when the patient is in immediate danger. Devices emitting ionising radiation for diagnostic or interventional radiology are class IIb.|Annex VIII Rule 10\nState Rule 11 (software).|Software providing information used to take decisions for diagnosis or therapy is class IIa, unless the decisions may cause death or irreversible deterioration of health (class III), or serious deterioration of health or a surgical intervention (class IIb). Software monitoring physiological processes is class IIa, or class IIb if monitoring vital parameters whose variations could result in immediate danger. All other software is class I.|Annex VIII Rule 11\nState Rule 12.|Active devices intended to administer and/or remove medicinal products, body liquids or other substances to or from the body are class IIa, or class IIb if done in a potentially hazardous way (nature of the substances, part of the body, mode of application).|Annex VIII Rule 12\nState Rule 13.|All other active devices are class I.|Annex VIII Rule 13\nState Rule 14.|Devices incorporating, as an integral part, a substance that used separately would be a medicinal product (incl. one derived from human blood or plasma), with an action ancillary to that of the device, are class III.|Annex VIII Rule 14\nState Rule 15.|Devices used for contraception or to prevent the transmission of sexually transmitted diseases are class IIb, or class III if implantable or long-term invasive.|Annex VIII Rule 15\nState Rule 16.|Devices specifically for disinfecting, cleaning, rinsing or hydrating contact lenses are class IIb. Devices specifically for disinfecting or sterilising medical devices are class IIa, or class IIb if they are disinfecting solutions or washer-disinfectors for disinfecting invasive devices as the end point of processing. Not for devices cleaning other devices (than contact lenses) by physical action only.|Annex VIII Rule 16\nState Rule 17.|Devices specifically intended for recording diagnostic images generated by X-ray radiation are class IIa.|Annex VIII Rule 17\nState Rule 18.|Devices manufactured utilising non-viable (or rendered non-viable) tissues or cells of human or animal origin, or their derivatives, are class III, unless made from animal tissues or derivatives and intended to contact intact skin only.|Annex VIII Rule 18\nState Rule 19.|Devices incorporating or consisting of nanomaterial are class III if the potential for internal exposure is high or medium, class IIb if low, and class IIa if negligible.|Annex VIII Rule 19\nState Rule 20.|Invasive devices via body orifices (not surgically invasive) intended to administer medicinal products by inhalation are class IIa, or class IIb if their mode of action has an essential impact on the efficacy and safety of the medicine or they treat life-threatening conditions.|Annex VIII Rule 20\nState Rule 21.|Substance-based devices introduced via a body orifice or applied to the skin and absorbed or locally dispersed: class III if they or their metabolites are systemically absorbed to achieve the intended purpose, or act in the stomach or lower GI tract and are systemically absorbed; class IIa if applied to the skin or in the nasal or oral cavity up to the pharynx and acting there; class IIb in all other cases.|Annex VIII Rule 21\nState Rule 22.|Active therapeutic devices with an integrated or incorporated diagnostic function that significantly determines patient management by the device, such as closed-loop systems or automated external defibrillators, are class III.|Annex VIII Rule 22\nClassify: a short-term urinary catheter, not connected to an active device.|Class IIa: invasive via a body orifice, not surgically invasive, short-term use (Rule 5).|Annex VIII Rule 5\nClassify: a tongue depressor.|Class I: invasive via a body orifice for transient use (Rule 5).|Annex VIII Rule 5\nClassify: a reusable scalpel.|Class I (Ir): a reusable surgical instrument (Rule 6). A notified body assesses only the reuse aspects.|Annex VIII Rule 6\nClassify: a blood bag.|Class IIb (Rule 2).|Annex VIII Rule 2\nClassify: a dressing for a deep wound that can only heal by secondary intent.|Class IIb (Rule 4).|Annex VIII Rule 4\nClassify: a dental filling.|Class IIa: an implantable device placed in the teeth (Rule 8).|Annex VIII Rule 8\nClassify: a breast implant, a hip joint replacement and a heart valve.|All class III (Rule 8): breast implants and total or partial joint replacements are named explicitly; a heart valve is in direct contact with the heart or central circulatory system.|Annex VIII Rule 8\nClassify: a condom.|Class IIb: prevention of sexually transmitted disease and contraception (Rule 15).|Annex VIII Rule 15\nClassify: a disinfecting solution for contact lenses.|Class IIb (Rule 16).|Annex VIII Rule 16\nClassify: an automated external defibrillator (AED).|Class III: an active therapeutic device with an integrated diagnostic function that significantly determines patient management (Rule 22).|Annex VIII Rule 22\nClassify: software that supports diagnosis where a wrong decision could cause a serious deterioration of health.|Class IIb (Rule 11); class III if the decision could cause death or irreversible deterioration; class IIa otherwise.|Annex VIII Rule 11\nClassify: a digital X-ray detector that records diagnostic images.|Class IIa (Rule 17).|Annex VIII Rule 17\nClassify: corrective spectacle lenses.|Class I: non-invasive, no other rule applies (Rule 1).|Annex VIII Rule 1\n#AIX|Annex IX–XI|Conformity assessment procedures|Annex IX–XI\nHow is Annex IX structured?|Chapter I: quality management system (application, QMS assessment, surveillance assessment); Chapter II: assessment of the technical documentation (section 4) and specific additional procedures (section 5: CECP, medicinal substances, tissues or cells of human or animal origin, absorbed substances); Chapter III: administrative provisions (e.g. keeping documentation available).|Annex IX\nHow often must the notified body carry out surveillance audits and unannounced audits?|Surveillance audits and assessments at least once every 12 months, to check the manufacturer applies the approved QMS and PMS plan. Unannounced audits at random, at least once every five years, at the manufacturer's and where appropriate its suppliers' or subcontractors' premises, with sampling and testing of devices.|Annex IX 3.3–3.4\nHow does a notified body handle a device with an ancillary medicinal substance (Annex IX 5.2)?|It seeks a scientific opinion on the quality and safety of the substance, incl. the benefit-risk of incorporating it, from a national medicines authority or the EMA (the EMA is mandatory for substances derived from human blood or plasma or in the centralised procedure's scope). The opinion is due within 210 days of receiving valid documentation. The notified body must not issue the certificate if the opinion is unfavourable.|Annex IX 5.2\nWhat is type-examination (Annex X)?|The procedure by which a notified body ascertains and certifies that a device, incl. its technical documentation, relevant life-cycle processes and a representative sample of production, meets the MDR. It results in an EU type-examination certificate and must be combined with Annex XI.|Annex X 1\nWhat is the difference between Annex XI Part A and Part B?|Part A (production quality assurance): the manufacturer operates a QMS for production, audited by the notified body, ensuring devices conform to the type or technical documentation. Part B (product verification): the notified body examines and tests products (individually or by statistical batch sampling) to verify conformity, and issues an EU product verification certificate.|Annex XI\n#AXII|Annex XII–XIII|Certificates and custom-made devices|Annex XII–XIII\nWhich types of certificates do notified bodies issue under the MDR?|EU quality management system certificates (Annex IX Ch. I), EU technical documentation assessment certificates (Annex IX Ch. II), EU type-examination certificates (Annex X), EU production quality assurance certificates (Annex XI Part A) and EU product verification certificates (Annex XI Part B).|Annex XII\nName six items a notified body certificate must contain (Annex XII).|Notified body name, address and number; manufacturer (and AR) name and address and SRN; unique certificate number; dates of issue and expiry; data to identify the devices, incl. Basic UDI-DI; reference to any previous certificate; reference to the MDR and Annex; examinations and tests performed; surveillance information; conclusions of the assessment; conditions or limitations; legally binding signature.|Annex XII Ch. II\nWhat must the statement for a custom-made device contain (Annex XIII)?|Manufacturer name and address and all manufacturing sites; AR if applicable; data identifying the device; that it is for the exclusive use of a particular patient or user (name, acronym or code); the prescriber's name and, where applicable, the health institution; the specific characteristics per the prescription; that it conforms to the Annex I GSPR, or which GSPR are not fully met and why; and whether it contains a medicinal substance or tissues or cells of human or animal origin. It is made available to the patient or user.|Annex XIII 1\nHow long must custom-made device documentation be kept?|At least 10 years after the device has been placed on the market; 15 years for implantable devices.|Annex XIII 4\n#AXIV|Annex XIV–XV|Clinical evaluation, PMCF and clinical investigations|Annex XIV–XV\nWhat is post-market clinical follow-up (PMCF)?|A continuous er the last device is placed on the market; 15 years for implantable devices.|Annex XV Ch. III 3\n#AXVI|Annex XVI–XVII|Products without a medical purpose; correlation table|Annex XVI–XVII\nName the six groups of products without an intended medical purpose in Annex XVI.|(1) Contact lenses or other items introduced into or onto the eye; (2) products introduced into the body by surgically invasive means to modify the anatomy or fix body parts (except tattoos and piercings); (3) substances or items for facial or other dermal or mucous membrane filling by injection (except tattooing); (4) equipment to reduce, remove or destroy adipose tissue (liposuction, lipolysis, lipoplasty); (5) high-intensity electromagnetic radiation equipment (lasers, IPL) for skin resurfacing, tattoo or hair removal or other skin treatment; (6) brain stimulation equipment applying currents or fields that penetrate the cranium.|Annex XVI\nWhich implementing acts apply to Annex XVI products?|Commission Implementing Regulation (EU) 2022/2346 sets the common specifications for the Annex XVI groups (applicable from 22 June 2023, with transitional periods), and Implementing Regulation (EU) 2022/2347 reclassifies certain active products without an intended medical purpose.|Art. 1(2), 9\nWhat is Annex XVII?|The correlation table between the provisions of Directives 90/385/EEC and 93/42/EEC and the MDR.|Annex XVII";
const DECKS=[],CARDS=[];

function rollDay(){if(S.d.day!==today())S.d={day:today(),newDone:0,reviewed:0};}
function buildQueue(){
  rollDay();

  const room=Math.max(0,S.s.npd-S.d.newDone);
  const fresh=CARDS.filter(c=>inDecks(c)&&!st(c.id)).slice(0,room); // new cards in the order of the regulation
  Q=rev.slice(0,400);

  if(S.st.last!==d){S.st.streak=S.st.last===d-1?(S.st.streak||0)+1:1;S.st.last=d;S.st.best=Math.max(S.st.best||0,S.st.streak);}

// result: "ok" | "near" | "bad"
function schedule(card,result){
  const isNew=!st(card.id);let p=st(card.id)||{l:0,due:today(),n:0,w:0};p.n++;
  if(isNew)S.d.newDone++;else if(!lapsed.has(card.id))S.d.reviewed++;
  if(result==="bad"){p.w=(p.w||0)+1;if(!isNew){p.s=(p.s||0)+1;if(p.s>=2){p.l=0;p.s=0;}else p.l=Math.max(0,p.l-3);}else p.l=0;
    p.due=today();lapsed.add(card.id);Q.splice(Math.min(3,Q.length),0,card);}
  else if(result==="near"){p.l=Math.max(1,Math.min(p.l,MAXL));p.due=today()+1;p.s=0;lapsed.delete(card.id);}
  else if(lapsed.has(card.id)||hinted){p.l=Math.max(p.l,1);p.due=today()+1;p.s=0;lapsed.delete(card.id);}
  else{p.l=Math.min(MAXL,p.l+1);p.due=today()+INTERVALS[p.l];p.s=0;}
  S.p[card.id]=p;logDay(result!=="bad");save();}
function counts(deck){

  return{total:cs.length,n,learn,mast,due:d};}
// mastery of the included cards: every card at its top interval = 100%
function mastery(deck){const cs=CARDS.filter(c=>deck?c.deck===deck:inDecks(c));if(!cs.length)return 0;
  let v=0;cs.forEach(c=>{const p=st(c.id);if(p)v+=Math.min(p.l,MASTER)/MASTER;});return v/cs.length;}

const AI_SCHEMA={type:"object",properties:{v:{type:"string",enum:["right","partial","wrong"]},tip:{type:"string"}},required:["v","tip"],additionalProperties:false};
function aiPrompt(card,answer){
  return`You grade a flashcard answer from a student of the EU Medical Device Regulation (MDR, Regulation (EU) 2017/745, as amended by Regulations 2020/561, 2023/607 and 2024/1860).
Question: ${card.q}
Reference answer: ${card.a}
Source: ${card.ref}
Student's answer: ${answer}
Grade on meaning, not wording: paraphrases, abbreviations, other order and short notes are fine. If the question asks for a number of items ("name five"), that many correct items is enough. Do not penalise missing detail that the question did not ask for.
"right" = the essential points (or the requested number of items) are present and nothing material is wrong.
"partial" = some essential points are right, but an important one is missing or slightly inaccurate.
"wrong" = mostly missing, or contradicts the regulation (for example a wrong class, deadline, number or actor).
Reply with JSON only: {"v":"right"|"partial"|"wrong","tip":"<at most 30 words in English: what was missing or wrong, or a short confirmation>"}`;}
async function aiJudge(card,answer){
  if(!AI.key)return null;
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);
  const body={model:AI.model,max_tokens:1024,output_config:{effort:"low"},messages:[{role:"user",content:aiPrompt(card,answer)}]};
  if(!AI.noFmt)body.output_config.format={type:"json_schema",schema:AI_SCHEMA};
  try{
    let r=await post(body,ctl);
    if(r.status===400&&!AI.noFmt){AI.noFmt=true;delete body.output_config.format;r=await post(body,ctl);} // older setups: plain JSON in the text
    if(!r.ok)return{err:r.status===401?"Key rejected. Check it in Settings.":r.status===429?"Rate or spend limit reached.":"Haiku error "+r.status};
    const j=await r.json();aiUse(j.usage);
    if(j.stop_reason==="refusal")return{err:"Haiku declined to grade this answer."};
    const b=(j.content||[]).find(x=>x.type==="text"),t=b?b.text:"";
    const m=t.match(/\{[\s\S]*\}/);if(!m)return{err:"No verdict returned."};
    const o=JSON.parse(m[0]);const v=["right","partial","wrong"].includes(o.v)?o.v:"wrong";
    return{v,tip:String(o.tip||"").slice(0,240)};
  }catch(e){return{err:e.name==="AbortError"?"Haiku timed out.":"Network error."};}
  finally{clearTimeout(to);}}

function rChapters(){
  const c=counts(),grp=(t,ann)=>{const ds=DECKS.filter(d=>d.annex===ann);
    return`<div class="eyebrow ehead">${ic(ann?"list":"book","s")}${t}<span class="chips sm"><button data-all="${ann?1:0}" aria-label="Include all">All</button><button data-none="${ann?1:0}" aria-label="Exclude all">None</button></span></div><div class="group">${ds.map(deckRow).join("")}</div>`;};
  V.innerHTML=`<div class="kpis">
      <div class="kpi" style="--c:var(--mid)">${ic("flame")}<b>${S.st.streak&&S.st.last>=today()-1?S.st.streak:0}</b>${tx("Day streak")}</div>
      <div class="kpi" style="--c:var(--ok)">${ic("trophy")}<b>${c.mast}</b>${tx("Mastered")}</div>
      <div class="kpi" style="--c:var(--ink)">${ic("stack")}<b>${c.due}</b>${tx("Due now")}</div></div>
    <div class="note">${ic("check","s")}<span>Switch chapters and annexes on or off. Only included ones are studied and counted.</span></div>
    ${grp("Chapters",false)}${grp("Annexes",true)}
    <div class="eyebrow">${ic("calendar","s")}Cards studied per week</div>${calHTML(10)}`;
  V.querySelectorAll(".chrow").forEach(r=>r.onclick=()=>{const id=r.dataset.d,cur_=DECKS.map(d=>d.id).filter(included);
    setInc(included(id)?cur_.filter(x=>x!==id):[...cur_,id]);rChapters();topline();});
  V.querySelectorAll("[data-all],[data-none]").forEach(b=>b.onclick=e=>{e.stopPropagation();const ann=(b.dataset.all||b.dataset.none)==="1",grpIds=DECKS.filter(d=>d.annex===ann).map(d=>d.id);
    const cur_=DECKS.map(d=>d.id).filter(included);setInc(b.dataset.all!=null?[...new Set([...cur_,...grpIds])]:cur_.filter(x=>!grpIds.includes(x)));rChapters();topline();});}
// ---------- all cards ----------
function rCards(){
  V.innerHTML=`<label class="search" style="margin-top:12px">${ic("search","s")}<input id="q" placeholder="Search questions and answers" aria-label="Search"></label>
    <div class="chips fl" id="flt"><button data-f="inc" aria-pressed="true">Included</button><button data-f="all" aria-pressed="false">All</button><button data-f="weak" aria-pressed="false">Often missed</button></div>
    <div class="group wl" id="list" style="margin-top:10px"></div>`;
  let f="inc";const q=document.getElementById("q"),L=document.getElementById("list");
  const draw=()=>{const s=q.value.trim().toLowerCase();
    let rows=CARDS.filter(c=>f==="all"||inDecks(c));if(f==="weak")rows=rows.filter(c=>st(c.id)&&st(c.id).w>0).sort((a,b)=>st(b.id).w-st(a.id).w);
    if(s)rows=rows.filter(c=>(c.q+" "+c.a+" "+c.ref).toLowerCase().includes(s));
    const n=rows.length;rows=rows.slice(0,150);
    L.innerHTML=rows.map(c=>{const p=st(c.id);return`<button class="row crow" data-id="${c.id}"><div><div class="e">${esc(c.q)}</div><div class="s"><span class="badge">${esc(DK[c.deck].lab)}</span><span>${esc(c.ref)}</span>${p?meter(p.l):""}</div></div></button>`;}).join("")
      +(n>150?`<div class="row muted">${n-150} more, refine the search</div>`:"")||`<div class="row muted">–</div>`;};
  q.oninput=draw;
  document.getElementById("flt").onclick=e=>{const b=e.target.closest("button");if(!b)return;f=b.dataset.f;document.querySelectorAll("#flt button").forEach(x=>x.setAttribute("aria-pressed",x===b));draw();};
  L.onclick=e=>{const b=e.target.closest(".crow");if(b)openSheet(BYID[b.dataset.id]);};
  draw();}
function openSheet(c){
  const p=st(c.id);
  SHEET.innerHTML=`<div class="sheet-in"><div class="sheet-top"><div class="en">${esc(c.q)}</div><button class="x" id="sx" aria-label="Close">${ic("close","s")}</button></div>
    <div class="sa">${esc(c.a)}</div>
    <div class="meta"><span class="badge">${esc(DK[c.deck].lab)}</span><span>${esc(c.ref)}</span>${p?meter(p.l):`${ic("spark","s")} new`}${p&&p.n?`<span>${ic("check","s")} ${p.n-(p.w||0)}/${p.n}</span>`:""}${p&&p.due>today()?`<span>${ic("calendar","s")} in ${p.due-today()} d</span>`:""}</div></div>`;
  SHEET.hidden=false;document.getElementById("sx").onclick=closeSheet;}
function closeSheet(){SHEET.hidden=true;SHEET.innerHTML="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!SHEET.hidden)closeSheet();});

// ---------- settings ----------
function toast(m){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}
function rSettings(){
  const th=[["auto","auto"],["light","sun"],["dark","moon"]].map(([v,i])=>`<button data-t="${v}" aria-pressed="${S.s.theme===v}" aria-label="${v}">${ic(i,"s")}</button>`).join("");
  const sp=aiSpend();
  V.innerHTML=`<div class="group" style="margin-top:12px">
    <div class="row"><span class="lab">${ic("spark")}${tx("New cards per day")}</span><div class="stepper"><button id="n-" aria-label="Fewer">${ic("minus","s")}</button><b id="npd">${S.s.npd}</b><button id="n+" aria-label="More">${ic("plus","s")}</button></div></div>
    <div class="row"><span class="lab">${ic("sun")}${tx("Theme")}</span><div class="chips" id="thc">${th}</div></div>
  </div>
  <div class="eyebrow">${ic("spark","s")}Answer check by Claude Haiku</div>
  <div class="group">
    <div class="row"><span class="lab">${ic("key")}${tx(AI.key?(AI.shared?"Anthropic key (shared with Kāshi)":"Anthropic key"):"Anthropic API key")}</span>
      <div class="ghbox">${AI.key?`<span class="muted" style="font-size:12px">Haiku 5.5</span><button class="ibtn sm" id="aitest" aria-label="Test key">${ic("play","s")}</button><button class="ibtn sm" id="aioff" aria-label="Remove key">${ic("x","s")}</button>`
        :`<input id="aik" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" aria-label="Anthropic API key">`}</div></div>
    ${AI.key?`<div class="row"><span class="lab">${ic("timer")}${tx("AI spend this month (estimate)")}</span><span class="num">${usd(sp.usd)} · ${sp.n}×</span></div>`:""}
  </div>
  <div class="note">${ic("spark","s")}<span>With a key, type an answer and Haiku grades it against the regulation text: right, partly or not right, with a short tip. The key stays in this browser and is sent only to api.anthropic.com. Get one at console.anthropic.com. Without a key you grade yourself.</span></div>
  <div class="eyebrow">${ic("cloud","s")}Progress</div>
  <div class="group">
    <div class="row"><span class="lab">${ic("cloud")}${tx("Save progress online (GitHub token, gist scope)")}<span id="ghs">${GH.tok?ghIcon():""}</span></span>
      <div class="ghbox">${GH.tok?`<button class="ibtn sm" id="ghsync" aria-label="Sync now">${ic("repeat","s")}</button><button class="ibtn sm" id="ghoff" aria-label="Disconnect">${ic("x","s")}</button>`
        :`<input id="ght" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_…" aria-label="GitHub token">`}</div></div>
    <div class="row"><span class="lab">${ic("download")}${tx("Backup: export / import")}</span><div class="chips">
      <button id="exp" aria-label="Export">${ic("download","s")}</button><button id="imp" aria-label="Import">${ic("upload","s")}</button><input type="file" id="impf" accept=".json,application/json" hidden></div></div>
  </div>
  <div class="group" style="margin-top:12px"><button class="danger" id="reset" aria-label="Erase progress">${ic("trash")}${tx("Erase all progress")}<span id="rst"></span></button></div>
  <div class="note">${ic("book","s")}<span>${CARDS.length} cards on Regulation (EU) 2017/745, as amended by 2020/561, 2023/607 and 2024/1860. A study aid, not legal advice: check the consolidated text on EUR-Lex.</span></div>`;
  const NP=[5,10,15,20,30,50];
  document.getElementById("n-").onclick=()=>{S.s.npd=NP[Math.max(0,NP.indexOf(S.s.npd)-1)]??5;save();topline();rSettings();};
  document.getElementById("n+").onclick=()=>{S.s.npd=NP[Math.min(NP.length-1,NP.indexOf(S.s.npd)+1)]??15;save();topline();rSettings();};
  document.getElementById("thc").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.s.theme=b.dataset.t;applyTheme();save();rSettings();};
  const ak=document.getElementById("aik");
  if(ak){const set=()=>{const v=ak.value.trim();if(v.length<20){toast("That key looks too short.");return;}AI.key=v;AI.shared=false;try{localStorage.setItem("mdr-ai",v);localStorage.removeItem("mdr-ai-off");}catch(e){}rSettings();};
    ak.addEventListener("change",set);ak.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();set();}});}
  const ao=document.getElementById("aioff");if(ao)ao.onclick=()=>{const sh=AI.shared;AI.key=null;AI.shared=false;try{localStorage.removeItem("mdr-ai");if(sh)localStorage.setItem("mdr-ai-off","1");}catch(e){}toast(sh?"Key removed here; Kāshi keeps its own.":"Key removed.");rSettings();};
  const at=document.getElementById("aitest");if(at)at.onclick=async()=>{at.innerHTML=ic("repeat","s");
    const r=await aiJudge({q:"Which class are all non-invasive devices by default?",a:"Class I (Rule 1), unless another rule applies.",ref:"Annex VIII Rule 1"},"class I");
    at.innerHTML=ic(r&&!r.err?"check":"x","s");toast(r&&!r.err?"Haiku works: "+r.v:(r?r.err:"No key"));};
  const t=document.getElementById("ght");
  if(t){const set=()=>{const v=t.value.trim();if(v.length<20)return;GH.tok=v;GH.id=null;try{localStorage.setItem("mdr-gh",v);localStorage.removeItem("mdr-gist");localStorage.removeItem("mdr-gh-off");}catch(e){}rSettings();ghSync();};
    t.addEventListener("change",set);t.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();set();}});}
  const gs_=document.getElementById("ghsync");if(gs_)gs_.onclick=()=>ghSync();
  const go_=document.getElementById("ghoff");if(go_)go_.onclick=()=>{GH.tok=null;GH.id=null;GH.state="off";try{localStorage.removeItem("mdr-gh");localStorage.removeItem("mdr-gist");localStorage.setItem("mdr-gh-off","1");}catch(e){}rSettings();};
  document.getElementById("exp").onclick=exportProgress;
  const f=document.getElementById("impf");document.getElementById("imp").onclick=()=>f.click();
  f.onchange=()=>{if(!f.files[0])return;importProgress(f.files[0],ok=>{toast(ok?"Progress imported.":"Not an MDR progress file.");topline();if(ok)ghSchedule();});};
  const r=document.getElementById("reset");
  r.onclick=()=>{if(!r.classList.contains("arm")){r.classList.add("arm");document.getElementById("rst").innerHTML=ic("question","s");setTimeout(()=>{r.classList.remove("arm");const x=document.getElementById("rst");if(x)x.innerHTML="";},4000);return;}
    const th_=S.s.theme,inc=S.inc;S=SDEF();S.s.theme=th_;S.inc=inc;save();buildQueue();topline();rSettings();toast("Progress erased.");};}
// ---------- merge two saves without losing progress on either side ----------
function mergeStates(a,b){
  if(!a)return b;if(!b)return a;
  const n=(a.t||0)>=(b.t||0)?a:b,o=n===a?b:a,out=mergeS(JSON.parse(JSON.stringify(n)));
  out.t=Math.max(a.t||0,b.t||0);
  for(const id in o.p||{}){const p=o.p[id],q=out.p[id];if(!q||(p.n||0)>(q.n||0))out.p[id]=p;}
  const so=o.st||{},sn=out.st;sn.best=Math.max(sn.best||0,so.best||0);if((so.last||0)>(sn.last||0)){sn.last=so.last;sn.streak=so.streak;}
  for(const d in so.hist||{}){const h=sn.hist[d],g=so.hist[d];sn.hist[d]=!h?g:{n:Math.max(h.n||0,g.n||0),ok:Math.max(h.ok||0,g.ok||0)};}
  if(o.d&&o.d.day===out.d.day){out.d.newDone=Math.max(out.d.newDone,o.d.newDone);out.d.reviewed=Math.max(out.d.reviewed,o.d.reviewed);}
  return out;}
// ---------- cloud sync via a secret GitHub gist (a Kāshi token on the same site is reused) ----------
const GHF="mdr-progress.json";
const GH={tok:null,id:null,state:"off",busy:false,again:false};
try{GH.tok=localStorage.getItem("mdr-gh")||(localStorage.getItem("mdr-gh-off")?null:localStorage.getItem("kashi-gh"));GH.id=localStorage.getItem("mdr-gist");}catch(e){}
async function gh(path,opt={}){
  const r=await fetch("https://api.github.com"+path,Object.assign({cache:"no-store"},opt,{headers:Object.assign({"Authorization":"Bearer "+GH.tok,"Accept":"application/vnd.github+json"},opt.body?{"Content-Type":"application/json"}:{})}));
  if(!r.ok){const e=new Error(r.status);e.status=r.status;throw e;}return r.status===204?null:r.json();}
function ghIcon(){return{ok:`<span style="color:var(--ok)">${ic("check","s")}</span>`,busy:`<span class="spin">${ic("repeat","s")}</span>`,err:`<span style="color:var(--bad)">${ic("x","s")}</span>`}[GH.state]||"";}
function ghSet(s){GH.state=s;const el=document.getElementById("ghs");if(el)el.innerHTML=ghIcon();}
async function ghFind(){
  if(GH.id)return GH.id;
  for(let page=1;page<=10;page++){const l=await gh(`/gists?per_page=100&page=${page}`);const g=l.find(x=>x.files&&x.files[GHF]);
    if(g){GH.id=g.id;try{localStorage.setItem("mdr-gist",g.id);}catch(e){}break;}if(l.length<100)break;}
  return GH.id;}
async function ghRead(){const id=await ghFind();if(!id)return null;const g=await gh("/gists/"+id);const f=g.files[GHF];if(!f)return null;
  let t=f.content;if(f.truncated)t=await(await fetch(f.raw_url,{cache:"no-store"})).text();return mergeS(JSON.parse(t));}
async function ghWrite(){const body={description:"MDR flashcards progress",files:{[GHF]:{content:JSON.stringify(S)}}};
  if(GH.id)await gh("/gists/"+GH.id,{method:"PATCH",body:JSON.stringify(body)});
  else{const g=await gh("/gists",{method:"POST",body:JSON.stringify(Object.assign(body,{public:false}))});GH.id=g.id;try{localStorage.setItem("mdr-gist",g.id);}catch(e){}}}
async function ghSync(){
  if(!GH.tok)return;if(GH.busy){GH.again=true;return;}GH.busy=true;ghSet("busy");
  try{const remote=await ghRead();
    if(remote){const before=JSON.stringify(S),m=mergeStates(S,remote);
      if(JSON.stringify(m)!==before){S=m;try{localStorage.setItem(LSK,JSON.stringify(S));}catch(e){}applyTheme();if(!(view==="study"&&cur)){if(view==="study")buildQueue();render();}else topline();}}
    if(!remote||JSON.stringify(remote)!==JSON.stringify(S))await ghWrite();
    ghSet("ok");}
  catch(e){if(e.status===404){GH.id=null;try{localStorage.removeItem("mdr-gist");}catch(x){}}ghSet("err");}
  GH.busy=false;if(GH.again){GH.again=false;setTimeout(ghSync,500);}}
let ghT=null;
function ghSchedule(){if(!GH.tok)return;clearTimeout(ghT);ghT=setTimeout(ghSync,5000);}
document.addEventListener("visibilitychange",()=>{if(!GH.tok)return;if(document.visibilityState==="visible")ghSync();else{clearTimeout(ghT);ghSync();}});
// ---------- export / import ----------
function exportProgress(){const b=new Blob([JSON.stringify(S)],{type:"application/json"});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="mdr-progress-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function importProgress(file,done){const r=new FileReader();r.onload=()=>{let ok=false;try{const x=mergeS(JSON.parse(r.result));if(x){S=mergeStates(S,x);save();applyTheme();buildQueue();ok=true;}}catch(e){}done(ok);};r.readAsText(file);}
// ---------- start ----------
function registerSW(){try{if("serviceWorker"in navigator&&location.protocol==="https:"&&!window.claude)navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}}
document.addEventListener("pointerover",e=>{const b=e.target.closest&&e.target.closest("[aria-label]:not([title])");if(b)b.title=b.getAttribute("aria-label");});
buildQueue();render();if(GH.tok)ghSync();registerSW();

</script>
