<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>MDR</title>
<meta name="description" content="Flashcards on the EU Medical Device Regulation (EU) 2017/745, with optional answer checking by Claude Haiku.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F4;--surface:#FFFFFF;--surface2:#EFEFEC;--ink:#111113;--muted:#7C7C80;--line:rgba(17,17,19,.08);
  --ok:#1F9D6B;--mid:#D99A00;--bad:#E5484D;--accent:#111113;--on-accent:#FFFFFF;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tf:var(--sans);--tdir:ltr;--r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0C;--surface:#161618;--surface2:#1F1F22;--ink:#EDEDEF;--muted:#8E8E93;--line:rgba(255,255,255,.08);
  --ok:#3DD68C;--mid:#F5C842;--bad:#FF6369;--accent:#EDEDEF;--on-accent:#0B0B0C;}}
:root[data-theme="dark"]{
  --bg:#0B0B0C;--surface:#161618;--surface2:#1F1F22;--ink:#EDEDEF;--muted:#8E8E93;--line:rgba(255,255,255,.08);
  --ok:#3DD68C;--mid:#F5C842;--bad:#FF6369;--accent:#EDEDEF;--on-accent:#0B0B0C;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);letter-spacing:-.006em;min-height:100%;
  padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
svg.i.s{width:16px;height:16px}svg.i.l{width:30px;height:30px}
.tg{font-family:var(--tf);direction:var(--tdir)}
/* header */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:620px;margin:0 auto;padding:10px 16px 10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.langbtn{display:flex;align-items:center;gap:8px;border:0;background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-weight:600}
.flag{font-size:22px;line-height:1}
.langbtn .tg{font-size:15px}
.topline{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.prog{height:2px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--ink);transition:width .4s ease}
main{max-width:620px;margin:0 auto;padding:8px 20px 32px}
/* tab bar: icons only */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:620px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:none;padding:13px 0 14px;display:flex;justify-content:center;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg.i{width:25px;height:25px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--ink)}
.tabs button.todo::after{content:"";position:absolute;top:10px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
/* shared */
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:28px 4px 10px}
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .lab{display:flex;align-items:center;gap:12px;color:var(--ink)}
.row .lab svg{color:var(--muted)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:15px;cursor:pointer;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--on-accent);width:100%}
.btn.primary:focus-visible{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 18%,transparent)}
.btn:disabled{opacity:.35;cursor:default}
.ibtn{border:0;background:var(--surface);color:var(--muted);width:48px;height:48px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer}
.ibtn:hover{color:var(--ink)}
.ibtn.on{color:var(--mid)}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);padding:5px 10px;border-radius:999px}
.badge.new{background:color-mix(in srgb,var(--mid) 18%,var(--surface));color:var(--mid)}
/* study */
.study{min-height:calc(100vh - 210px);display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.chiprow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.prompt{font-size:clamp(30px,8.5vw,44px);font-weight:600;letter-spacing:-.03em;line-height:1.12;margin:0 0 14px}
.target{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin:0 0 26px}
.target b{color:var(--ink);font-weight:600}
.intro{display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;background:color-mix(in srgb,var(--mid) 14%,var(--surface));padding:8px 14px;border-radius:14px;margin:0 0 20px}
.intro svg{color:var(--mid)}
.intro .tg{font-size:20px;font-weight:600}
.answer{width:100%;border:0;border-bottom:1.5px solid var(--line);background:none;color:var(--ink);font:500 30px/1.4 var(--tf);direction:var(--tdir);text-align:start;padding:6px 0 10px;border-radius:0;outline:none;transition:border-color .2s}
.answer:focus{border-bottom-color:var(--ink)}
.answer:focus-visible{outline:none}
.answer::placeholder{color:var(--muted);opacity:.45}
.answer.ok{border-bottom-color:var(--ok)}
.answer.bad{border-bottom-color:var(--bad)}
.hint{font-size:15px;color:var(--muted);min-height:24px;margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint .tg{color:var(--ink);font-size:18px}
.fb{display:none;margin-top:18px}
.fb.show{display:block;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff}
.verdict svg.i{width:20px;height:20px;stroke-width:2.6}
.fb.ok .verdict{background:var(--ok)}.fb.near .verdict{background:var(--mid)}.fb.bad .verdict{background:var(--bad)}
.big{font:700 38px/1.35 var(--tf);direction:var(--tdir);text-align:start;margin-top:8px}
.tr{color:var(--muted);font-size:15px;margin-top:2px}
.alt,.yours{color:var(--muted);font-size:14px;margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alt .tg,.yours .tg{font-size:17px;color:var(--ink)}
.yours .tg{text-decoration:line-through;text-decoration-color:var(--bad)}
.acts{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:12px}
.acts .icons{display:flex;justify-content:center;gap:14px}
.gls{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gl{font-size:12px;color:var(--muted);background:var(--surface);border-radius:8px;padding:4px 8px;display:inline-flex;gap:6px;align-items:baseline}
.gl .tg{font-size:15px;color:var(--ink);font-weight:500}
.done{text-align:center;padding:64px 12px}
.ring{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;margin:0 auto 22px;color:var(--ok)}
.ring svg.i{width:34px;height:34px;stroke-width:2.2}
/* sprint */
.hero{text-align:center;padding:28px 0 8px}
.hero .clock{width:120px;height:120px;border-radius:50%;background:var(--surface);display:grid;place-items:center;margin:0 auto 8px}
.hero .clock svg.i{width:48px;height:48px;stroke-width:1.6}
.hero .min{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.kpi b{font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.kpi svg.i{color:var(--c,var(--muted))}
.sq{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--c)}
.sptop{position:sticky;top:51px;z-index:4;background:var(--bg);padding:6px 0 4px}
.race{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.clockring{position:relative;width:50px;height:50px;display:grid;place-items:center}
.clockring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.clockring circle{fill:none;stroke-width:4}
.clockring .rbg{stroke:var(--surface2)}
.clockring .rfg{stroke:var(--ink);stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:0;transition:stroke-dashoffset .2s linear}
.clockring b{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clockring.hurry .rfg{stroke:var(--bad)}.clockring.hurry b{color:var(--bad);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.race .combo{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:700;color:var(--mid)}
.score{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.score b{font-size:30px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score b.beat{color:var(--mid)}
.score b.pop{animation:pop .3s ease}
@keyframes pop{40%{transform:scale(1.18)}}
.score span{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.score span i{font-style:normal}
.tbar{height:3px;border-radius:2px;background:var(--surface2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ink);transition:width .2s linear}
.spmeta{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums;font-weight:600}
.spmeta span{display:flex;align-items:center;gap:5px}
.spmeta .combo{color:var(--mid)}
.sprint{min-height:auto;justify-content:flex-start;padding-top:26px}
.tip{display:flex;gap:10px;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:18px}
.tip svg{color:var(--mid);margin-top:1px}
.tip b{display:block;color:var(--ink);font-weight:600}
.skrow .s{font-size:12px;margin-top:2px;color:var(--muted)}
.skbar{display:flex;align-items:center;gap:10px;flex:none}
.skbar .bar{width:72px}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
/* map */
.pages{display:flex;gap:6px;overflow-x:auto;margin:6px -20px 0;padding:0 20px 2px;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.pages button{flex:none;border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;background:var(--surface);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.pages button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.maphead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 2px 10px}
.pinfo{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pinfo span{display:flex;align-items:center;gap:4px}
.zoom{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:3px}
.zoom button{width:32px;height:32px;border:0;border-radius:50%;background:none;cursor:pointer;display:grid;place-items:center}
.zoom button:disabled{opacity:.3}
.zoom input{width:80px;accent-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap,3px);background:var(--surface);border-radius:var(--r);padding:12px;touch-action:pan-x pan-y}
.t{border:0;padding:0;margin:0;border-radius:3px;cursor:pointer;aspect-ratio:1;background:var(--c);min-width:0}
.b3{--c:var(--ok)}.b2{--c:var(--mid)}.b1{--c:var(--bad)}
.b0{--c:color-mix(in srgb,var(--bad) 22%,var(--surface))}
.t.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.lbl1 .t,.lbl2 .t{aspect-ratio:auto;min-height:46px;border-radius:8px;padding:6px 7px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:2px;
  background:color-mix(in srgb,var(--c) 16%,var(--surface));box-shadow:inset 3px 0 0 var(--c);overflow:hidden}
.lbl1 .b0,.lbl2 .b0{background:var(--surface2);box-shadow:inset 3px 0 0 var(--line)}
.lbl1 .t.sel,.lbl2 .t.sel{box-shadow:inset 3px 0 0 var(--c),0 0 0 2px var(--ink)}
.te{font-size:10.5px;line-height:1.2;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tf{display:none;font:500 16px/1.3 var(--tf);direction:var(--tdir);text-align:end}
.lbl2 .t{min-height:72px;padding:9px 10px}
.lbl2 .te{font-size:13px;-webkit-line-clamp:2}
.lbl2 .tf{display:block}
.sheet{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:7;padding:0 12px 10px;pointer-events:none}
.sheet-in{max-width:596px;margin:0 auto;background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 0 1px var(--line);pointer-events:auto;animation:rise .2s ease}
.sheet[hidden]{display:none}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet .en{font-weight:600;font-size:17px}
.sheet .fa1{font:700 30px/1.35 var(--tf);direction:var(--tdir);margin-top:4px}
.sheet .meta{font-size:13px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.x{border:0;background:var(--surface2);width:30px;height:30px;border-radius:50%;cursor:pointer;flex:none;display:grid;place-items:center}
/* words */
.deckrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px}
.deckrow b{font-weight:700}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:0 14px;color:var(--muted)}
.search input{flex:1;border:0;background:none;color:var(--ink);font:15px var(--sans);padding:13px 0;outline:none}
.wl .row{padding:12px 16px}
.wl .e{font-weight:500}
.wl .s{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center}
.wl .f{font:500 19px var(--tf);direction:var(--tdir)}
/* grammar */
details{background:var(--surface);border-radius:var(--r);margin-bottom:8px}
summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .2s;flex:none}
details[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.gbody{padding:0 16px 14px}
.gbody p{margin:0 0 10px;color:var(--muted);max-width:62ch}
.ex{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ex .tg{font-size:17px;font-weight:500}
/* settings */
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chips button{border:0;border-radius:10px;min-width:44px;padding:8px 10px;font-weight:700;font-size:13px;background:var(--surface2);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:999px;padding:3px}
.stepper button{width:32px;height:32px;border:0;border-radius:50%;background:none;cursor:pointer;display:grid;place-items:center}
.stepper b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.danger{color:var(--bad);background:none;border:0;padding:14px 16px;width:100%;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600}
.danger.arm{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
/* language picker */
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.lt{border:0;background:var(--surface);border-radius:18px;padding:18px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative}
.lt .flag{font-size:34px}
.lt .tg{font-size:15px;font-weight:600;direction:auto}
.lt .pct{font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.lt[aria-current="true"]{box-shadow:0 0 0 2px var(--ink)}
.lt:disabled{opacity:.38;cursor:default}
.lt .soon{position:absolute;top:8px;right:8px;color:var(--muted)}
.pickhead{text-align:center;padding:26px 0 4px;color:var(--muted)}
.pickhead svg.i{width:40px;height:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.actrow{margin-top:28px;display:flex;align-items:center;gap:14px}
.actrow .btn.primary{flex:1;width:auto}
.actrow .ibtn{width:54px;height:54px;flex:none}
.ibtn.ghost{background:none;pointer-events:none}
.target .badge{margin-left:4px}
.sprint .prompt{margin-bottom:10px}
.sprint .chiprow{margin-bottom:16px}
.study .prompt{margin-bottom:10px}

/* no page scroll while answering: the screen is pinned to the visible area above the keyboard */
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
body.lock{position:fixed;inset:0;height:var(--vvh,100dvh);padding-bottom:0;display:flex;flex-direction:column}
body.lock .top{flex:none}
body.lock main{flex:1;min-height:0;width:100%;overflow:hidden;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.lock .study{flex:1;min-height:0;justify-content:flex-start;padding:14px 0 0}
body.lock .sprint{padding-top:12px}
body.lock .sptop{position:static}
body.kb main{padding-bottom:10px}
body.kb .tabs{display:none}
body.kb .chiprow,body.kb #stip{display:none}
body.kb .prompt{font-size:clamp(22px,6vw,30px);margin-bottom:6px}
body.kb .target{margin-bottom:10px}
body.kb .answer{font-size:24px;padding:2px 0 6px}
body.kb .actrow{margin-top:12px}
body.kb .actrow .ibtn{width:46px;height:46px}
body.kb .actrow .btn{padding:11px 18px}
body.kb .fb{margin-top:8px}
body.kb .big{font-size:26px;margin-top:4px}
body.kb .gls{display:none}
body.kb .hint{min-height:0;margin-top:4px}
body.kb .sptop{padding:2px 0}
body.kb .clockring{width:42px;height:42px}
body.kb .clockring b{font-size:11px}
body.kb .verdict{width:26px;height:26px}
body.kb .score b{font-size:24px}

.tr.ph{font-size:17px;color:var(--ink);opacity:.72;font-style:italic;text-align:start;margin-top:2px}
body.kb .tr.ph{font-size:15px}

/* weekly challenge calendar */
.cal{background:var(--surface);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.cw{display:grid;grid-template-columns:52px repeat(7,1fr) 34px;gap:5px;align-items:center}
.cw .cl{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.cw i{font-style:normal;aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;
  background:color-mix(in srgb,var(--ok) calc(var(--a,0)*100%),var(--surface2))}
.cw i.fut{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.cw i.now{box-shadow:0 0 0 2px var(--ink)}
.cw.ch i{background:none;aspect-ratio:auto;color:var(--muted);font-size:11px;font-weight:600}
.ct{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.ct.z{color:var(--muted);font-weight:500}
.cw.ch .ct{display:flex;justify-content:flex-end;color:var(--muted)}

.ghbox{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.ghbox input{flex:1;min-width:0;max-width:240px;border:0;border-radius:10px;background:var(--surface2);color:var(--ink);font:14px var(--sans);padding:9px 12px}
.ibtn.sm{width:36px;height:36px;background:var(--surface2)}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#ghs{display:inline-flex}

.aitip{display:flex;gap:7px;align-items:center;justify-content:center;margin-top:10px;font-size:13px;color:var(--muted);text-align:center;line-height:1.35}
.aitip svg{flex:none;color:var(--mid)}
.aitip.wait i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.3;animation:aip 1s infinite}
.aitip.wait i:nth-child(3){animation-delay:.2s}.aitip.wait i:nth-child(4){animation-delay:.4s}
@keyframes aip{50%{opacity:1}}
.btn.dis{opacity:.35;pointer-events:none}

.tabs button{flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px}
.tabs button span{font-size:10px;font-weight:600;letter-spacing:.01em}
.cp{font-size:12px;color:var(--muted);font-weight:500;line-height:1.25}
.kpi .cp{text-align:center}
.row .lab{flex-wrap:nowrap}
.row .lab .cp{max-width:150px}
.danger .cp{color:inherit;margin-left:4px}
.actrow,#sacts{padding-bottom:16px}
.actrow [aria-label],#sacts [aria-label],#acts [aria-label]{position:relative}
.actrow [aria-label]::after,#sacts [aria-label]::after,#acts [aria-label]::after{content:attr(aria-label);position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:10px;font-weight:500;color:var(--muted);white-space:nowrap;pointer-events:none;font-style:normal}
.btn.primary[aria-label]::after{color:var(--muted)}
body.kb .actrow [aria-label]::after,body.kb #sacts [aria-label]::after,body.kb #acts [aria-label]::after{display:none}

.pips{display:inline-flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--surface2)}
.pips i.on{background:var(--ok)}
.pips i.rust{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mid)}
.skbar .num{min-width:34px;text-align:right}
.gt{display:flex;align-items:center;gap:8px;font-size:14px}
.gt.y svg{color:var(--ok)}.gt.n svg{color:var(--muted)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);margin:10px 4px 0;line-height:1.4}
.note svg{flex:none;margin-top:1px}
/* ---------- speech sprint ---------- */
.spgo2{display:flex;gap:10px;align-items:center}
.spgo2 .btn.primary{flex:1;width:auto}
.btn.vgo{width:58px;height:52px;padding:0;flex:none}
.vnote{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
.voice .vs-en{font-size:17px;font-weight:500;color:var(--muted);margin:0}
.vs-target{font:700 38px/1.35 var(--tf);direction:var(--tdir);text-align:start;margin-top:6px}
.btn.vmic{gap:10px}
.btn.vmic.on{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.vlen{font-variant-numeric:tabular-nums;font-size:14px}
.vpct{font:700 30px/1.2 var(--sans);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums}
.fb.ok .vpct{color:var(--ok)}.fb.near .vpct{color:var(--mid)}.fb.bad .vpct{color:var(--bad)}
.phs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:12px}
.ph{display:inline-flex;flex-direction:column;align-items:center;min-width:26px;padding:4px 6px;border-radius:8px;font-weight:600;font-size:16px;line-height:1.2;background:var(--surface)}
.ph i{font-style:normal;font-size:11px;font-weight:500;color:var(--bad)}
.ph.ok{color:var(--ok)}
.ph.sub,.ph.del{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.ph.del{text-decoration:line-through}
.ph.ins{color:var(--muted);font-size:12px;font-weight:500;background:none}
.ipa{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px;font-size:13px;color:var(--muted);word-break:break-word}
.vtip{text-align:start;justify-content:flex-start}
.vload{margin:6px 0 18px;text-align:center;color:var(--muted);font-size:14px}
.vload .bar{margin:0 auto 12px;max-width:320px}

.svd{display:inline-flex;align-items:center;gap:2px;color:var(--ok);font-weight:600;font-size:11px;margin-left:4px}

.group details.sk{background:none;margin:0;border-radius:0;border-top:1px solid var(--line)}
.group details.sk:first-child{border-top:0}
.sk summary{padding:13px 16px;font-weight:400}
.sk summary::after{display:none}
.sk summary .s{font-size:12px;margin-top:2px;color:var(--muted)}
.sk[open] summary{padding-bottom:8px}
.sk .gbody .nx{margin:8px 0 0}

.topline{gap:10px}
.mst{display:inline-flex;align-items:center;gap:6px}
.mst b{color:var(--ink);font-size:15px;font-weight:700;letter-spacing:-.01em}
.lvb{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--ink);color:var(--bg)}
.lvb.none{background:var(--surface2);color:var(--muted)}
.tl2{display:inline-flex;align-items:center;gap:4px;font-size:13px}

/* tutor chat */
.chat{display:flex;flex-direction:column;flex:1;min-height:0}
.chathead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px;font-weight:600;font-size:14px}
.chathead>span:first-child{display:flex;gap:7px;align-items:center}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 2px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.msg{max-width:90%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.seg{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;margin:1px 3px;line-height:1.2}
.seg .sf{font-size:21px;line-height:1.35}
.seg .sp{font-size:11px;color:var(--muted);font-style:italic;white-space:normal;text-align:center}
.msg.u .seg .sp{color:inherit;opacity:.72}
.li{display:block;padding-left:2px}
.tq{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:0;scrollbar-width:none}
.tq::-webkit-scrollbar{display:none}
.tq button{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.composer{display:flex;gap:8px;align-items:flex-end;padding-top:2px}
.composer textarea{flex:1;resize:none;border:0;outline:0;background:var(--surface);color:var(--ink);border-radius:22px;padding:13px 17px;font:inherit;font-size:16px;line-height:1.35;max-height:120px}
.sendb{width:48px;height:48px;padding:0;border-radius:50%;flex:none;display:grid;place-items:center}
body.lock .chat{flex:1}
body.kb .tq{display:none}
.tabs button{min-width:0}
.tabs button span{white-space:nowrap}
.composer .btn.sendb{width:48px;min-width:48px;flex:0 0 48px;height:48px;padding:0}
.composer textarea{min-width:0;width:auto}
.tq{flex-wrap:nowrap}

.tbtns{display:inline-flex;gap:6px;align-items:center}
.ibtn.sm{width:36px;height:36px}
.tg1[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.micb{width:48px;height:48px;flex:none}
.micb.rec{background:var(--bad);color:#fff;animation:rec 1.2s infinite}
@keyframes rec{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 22%,transparent)}}
.pill{width:auto;min-width:36px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;flex:none}
.tstat{min-height:0;font-size:12px;color:var(--muted);text-align:center;display:flex;gap:6px;justify-content:center;align-items:center;padding:0 4px}
.tstat:not(:empty){min-height:20px;margin-bottom:6px}
.tstat.bad{color:var(--bad)}
.composer{align-items:center}
.composer textarea{padding:13px 15px}

/* conversation (call) mode */
.orbrow{display:none;align-items:center;justify-content:center;gap:18px;padding:8px 0 4px}
.chat.call .orbrow{display:flex}
.chat.call .composer,.chat.call .tq{display:none}
.chat.call .msg:not(:nth-last-child(-n+2)){display:none}
.chat.call .msgs{justify-content:flex-end}
.orb{width:92px;height:92px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.orb svg.i{width:34px;height:34px}
.orb.listen{background:var(--bad);color:#fff;animation:rec 1.2s infinite}
.orb.speak{background:var(--ok);color:#fff;animation:rec 1.6s infinite}
.orb.think,.orb.proc{opacity:.55}
.orb:active{transform:scale(.95)}
.tqh{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 4px}
body.kb .chat.call .orb{width:64px;height:64px}

.lsn{margin:8px auto 0;display:inline-grid;vertical-align:middle}
.fa1[data-say],.row .f[data-say],.seg[data-say]{cursor:pointer}
.fa1 svg{margin-left:8px;color:var(--muted);vertical-align:middle}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,12px);max-width:86vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;line-height:1.35;opacity:0;pointer-events:none;transition:.2s;z-index:30;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

.azform{display:flex;flex-direction:column;gap:8px;padding:2px 16px 16px}
.azform input{width:100%;box-sizing:border-box;border:0;outline:0;background:var(--surface2);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px}
.azform .btn{width:100%}

/* ===== MDR additions on top of the Kāshi styles ===== */
.mdr{justify-content:flex-start;padding-top:18px;min-height:auto}
.mdr .chiprow{margin-bottom:16px}
.mdr .prompt{font-size:clamp(21px,5.4vw,27px);letter-spacing:-.02em;line-height:1.28;margin-bottom:16px}
.ta{width:100%;display:block;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:400 16px/1.5 var(--sans);padding:12px 14px;resize:none;min-height:96px;outline:none;transition:border-color .2s}
.ta:focus{border-color:var(--ink)}
.ta::placeholder{color:var(--muted);opacity:.7}
.ta.ok{border-color:var(--ok)}.ta.bad{border-color:var(--bad)}
.ta[readonly]{color:var(--muted)}
.hint span b{color:var(--ink)}
.vrow{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.aitip.left{justify-content:flex-start;text-align:left;font-size:14px;color:var(--ink);background:color-mix(in srgb,var(--mid) 12%,var(--surface));border-radius:12px;padding:10px 12px}
.aitip.err{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.aitip.err svg{color:var(--bad)}
.ansfull{margin-top:12px;background:var(--surface);border-radius:14px;padding:14px 16px;font-size:15.5px;line-height:1.55;box-shadow:inset 3px 0 0 var(--ink)}
.fb.ok .ansfull{box-shadow:inset 3px 0 0 var(--ok)}.fb.near .ansfull{box-shadow:inset 3px 0 0 var(--mid)}.fb.bad .ansfull{box-shadow:inset 3px 0 0 var(--bad)}
.ref{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;margin:8px 4px 0}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.grades button{border:0;border-radius:16px;padding:12px 6px 10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.grades button svg.i{width:24px;height:24px;stroke-width:2.2}
.grades .g-bad svg{color:var(--bad)}.grades .g-near svg{color:var(--mid)}.grades .g-ok svg{color:var(--ok)}
.grades button.sug{color:var(--ink);box-shadow:0 0 0 2px var(--c)}
.g-bad{--c:var(--bad)}.g-near{--c:var(--mid)}.g-ok{--c:var(--ok)}
.grades button:hover{color:var(--ink)}
.kbd{font-size:12px;text-align:center;margin-top:12px}
@media (pointer:coarse){.kbd{display:none}}
.btn.dis{opacity:.4;pointer-events:none}
.done p{max-width:34ch;margin:0 auto 18px}
/* chapters */
.ehead{justify-content:flex-start}
.ehead .chips{margin-left:auto}
.chips.sm button{min-width:0;padding:5px 10px;font-size:12px;text-transform:none;letter-spacing:0}
.chrow{cursor:pointer;align-items:center;gap:14px}
.chrow.off .cht{opacity:.45}
.cht{flex:1;min-width:0}
.cht .t1{font-weight:500;line-height:1.3}
.cht .s{font-size:12px;color:var(--muted);margin:2px 0 7px}
.cht .s b{color:var(--ink);font-weight:600}
.sw{width:42px;height:26px;border-radius:13px;background:var(--surface2);position:relative;flex:none;border:0;cursor:pointer;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--ok)}
.sw[aria-pressed="true"]::after{transform:translateX(16px)}
/* cards list */
.chips.fl{justify-content:flex-start;margin-top:10px}
.chips.fl button{font-weight:600}
.crow{width:100%;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.crow:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.wl .s{flex-wrap:wrap}
.sheet .sa{font-size:15px;line-height:1.55;margin-top:10px;max-height:46vh;overflow:auto}

</style>

const RAW="#I|Chapter I|Scope and definitions|Art. 1–4\nWhat is the MDR's full legal reference?|Regulation (EU) 2017/745 of the European Parliament and of the Council of 5 April 2017 on medical devices, published in OJ L 117 of 5 May 2017.|Title\nWhich two directives did the MDR repeal?|Council Directive 90/385/EEC on active implantable medical devices (AIMDD) and Council Directive 93/42/EEC on medical devices (MDD).|Art. 122\nWhich regulation covers in vitro diagnostic medical devices instead of the MDR?|Regulation (EU) 2017/746, the IVDR. IVDs are excluded from the MDR's scope.|Art. 1(6)(a)\nWhen did the MDR enter into force, and from when does it apply?|It entered into force on 25 May 2017 (20 days after publication). It applies from 26 May 2021. The original date was 26 May 2020; Regulation (EU) 2020/561 postponed it by one year because of COVID-19.|Art. 123\nGive the key elements of the definition of a \"medical device\".|Any instrument, apparatus, appliance, software, implant, reagent, material or other article intended by the manufacturer to be used, alone or in combination, for human beings for a specific medical purpose: diagnosis, prevention, monitoring, prediction, prognosis, treatment or alleviation of disease; diagnosis, monitoring, treatment, alleviation of or compensation for an injury or disability; investigation, replacement or modification of the anatomy or of a physiological or pathological process or state; or providing information by in vitro examination of specimens from the human body. It does not achieve its principal intended action by pharmacological, immunological or metabolic means, but may be assisted in its function by such means.|Art. 2(1)\nWhich two groups of products are also deemed to be medical devices under Art. 2(1)?|Devices for the control or support of conception, and products specifically intended for the cleaning, disinfection or sterilisation of devices.|Art. 2(1)\nDefine \"accessory for a medical device\".|An article which, while not itself a medical device, is intended by its manufacturer to be used together with one or several particular medical devices to specifically enable them to be used in accordance with their intended purpose, or to specifically and directly assist their medical functionality in terms of their intended purpose.|Art. 2(2)\nDefine \"intended purpose\".|The use for which a device is intended according to the data supplied by the manufacturer on the label, in the instructions for use or in promotional or sales materials or statements, and as specified by the manufacturer in the clinical evaluation.|Art. 2(12)\nDefine \"manufacturer\".|A natural or legal person who manufactures or fully refurbishes a device, or has a device designed, manufactured or fully refurbished, and markets that device under its name or trademark.|Art. 2(30)\nWho are the \"economic operators\" under the MDR?|The manufacturer, the authorised representative, the importer, the distributor, and the person who combines devices into systems or procedure packs or sterilises them (Art. 22(1) and (3)).|Art. 2(35)\nDefine \"importer\".|Any natural or legal person established within the Union that places a device from a third country on the Union market.|Art. 2(33)\nDefine \"distributor\".|Any natural or legal person in the supply chain, other than the manufacturer or the importer, that makes a device available on the market, up until the point of putting into service.|Art. 2(34)\nDefine \"authorised representative\".|Any natural or legal person established within the Union who has received and accepted a written mandate from a manufacturer located outside the Union to act on the manufacturer's behalf in relation to specified tasks regarding the manufacturer's obligations under the MDR.|Art. 2(32)\nDistinguish \"making available on the market\", \"placing on the market\" and \"putting into service\".|Making available: any supply of a device (other than an investigational device) for distribution, consumption or use on the Union market in the course of a commercial activity, paid or free. Placing on the market: the first making available of a device on the Union market. Putting into service: the stage at which a device has been made available to the final user as ready for use on the Union market for the first time for its intended purpose.|Art. 2(27)–(29)\nDefine \"custom-made device\".|A device specifically made in accordance with a written prescription of a person authorised by national law by virtue of their professional qualifications, giving specific design characteristics under that person's responsibility, and intended for the sole use of a particular patient exclusively to meet their individual conditions and needs. Mass-produced devices that are adapted for a professional user, or mass-produced by industrial processes according to written prescriptions, are not custom-made.|Art. 2(3)\nDefine \"implantable device\".|Any device, including those partially or wholly absorbed, intended to be totally introduced into the human body, or to replace an epithelial surface or the surface of the eye, by clinical intervention and intended to remain in place after the procedure. A device partially introduced by clinical intervention and intended to remain in place for at least 30 days is also deemed implantable.|Art. 2(5)\nDefine \"invasive device\".|Any device which, in whole or in part, penetrates inside the body, either through a body orifice or through the surface of the body.|Art. 2(6)\nDefine \"active device\". Is software an active device?|A device whose operation depends on a source of energy other than that generated by the human body for that purpose or by gravity, and which acts by changing the density of or converting that energy. Devices that only transmit energy, substances or other elements between an active device and the patient without significant change are not active devices. Software is deemed to be an active device.|Art. 2(4)\nDefine \"generic device group\".|A set of devices having the same or similar intended purposes or a commonality of technology, allowing them to be classified in a generic manner not reflecting specific characteristics.|Art. 2(7)\nDefine \"single-use device\".|A device that is intended to be used on one individual during a single procedure.|Art. 2(8)\nDefine \"falsified device\".|Any device with a false presentation of its identity and/or of its source and/or of its CE marking certificates or documents relating to CE marking procedures. It does not cover unintentional non-compliance and is without prejudice to infringements of intellectual property rights.|Art. 2(9)\nWhat is the difference between a \"procedure pack\" and a \"system\"?|Procedure pack: a combination of products packaged together and placed on the market for use for a specific medical purpose. System: a combination of products, packaged together or not, intended to be inter-connected or combined to achieve a specific medical purpose.|Art. 2(10)–(11)\nDefine \"nanomaterial\" under the MDR.|A natural, incidental or manufactured material containing particles in an unbound state, as an aggregate or as an agglomerate, where for 50% or more of the particles in the number size distribution one or more external dimensions is in the range 1–100 nm. Fullerenes, graphene flakes and single-wall carbon nanotubes with one or more external dimensions below 1 nm are also nanomaterials.|Art. 2(18)\nDefine \"risk\" and \"benefit-risk determination\".|Risk: the combination of the probability of occurrence of harm and the severity of that harm. Benefit-risk determination: the analysis of all assessments of benefit and risk of possible relevance for the use of the device for the intended purpose, when used as intended by the manufacturer.|Art. 2(23)–(24)\nDefine \"fully refurbishing\".|The complete rebuilding of a device already placed on the market or put into service, or the making of a new device from used devices, to bring it into conformity with the MDR, combined with the assignment of a new lifetime to the refurbished device.|Art. 2(31)\nDefine \"health institution\" and \"lay person\".|Health institution: an organisation whose primary purpose is the care or treatment of patients or the promotion of public health. Lay person: an individual who does not have formal education in a relevant field of healthcare or medical discipline.|Art. 2(36), (38)\nDefine \"reprocessing\".|A process carried out on a used device to allow its safe reuse, including cleaning, disinfection, sterilisation and related procedures, as well as testing and restoring the technical and functional safety of the used device.|Art. 2(39)\nDefine \"clinical evaluation\".|A systematic and planned process to continuously generate, collect, analyse and assess the clinical data pertaining to a device in order to verify the safety and performance, including clinical benefits, of the device when used as intended by the manufacturer.|Art. 2(44)\nDefine \"clinical investigation\" and \"sponsor\".|Clinical investigation: any systematic investigation involving one or more human subjects, undertaken to assess the safety or performance of a device. Sponsor: any individual, company, institution or organisation which takes responsibility for the initiation, management and setting up of the financing of the clinical investigation.|Art. 2(45), (49)\nFrom which four sources can \"clinical data\" come?|(1) Clinical investigations of the device concerned; (2) clinical investigations or other studies reported in scientific literature of a device for which equivalence can be demonstrated; (3) reports in peer-reviewed scientific literature on other clinical experience of the device or an equivalent device; (4) clinically relevant information from post-market surveillance, in particular post-market clinical follow-up.|Art. 2(48)\nDefine \"clinical evidence\" and \"clinical benefit\".|Clinical evidence: clinical data and clinical evaluation results of sufficient amount and quality to allow a qualified assessment of whether the device is safe and achieves the intended clinical benefits when used as intended. Clinical benefit: the positive impact of a device on the health of an individual, expressed as meaningful, measurable, patient-relevant clinical outcomes (including diagnosis), or a positive impact on patient management or public health.|Art. 2(51), (53)\nDefine \"serious adverse event\" (clinical investigations).|Any adverse event that led to: death; serious deterioration in the health of the subject (life-threatening illness or injury, permanent impairment of a body structure or function, hospitalisation or prolonged hospitalisation, medical or surgical intervention to prevent these, or chronic disease); or foetal distress, foetal death, or a congenital physical or mental impairment or birth defect.|Art. 2(58)\nDefine \"device deficiency\".|Any inadequacy in the identity, quality, durability, reliability, safety or performance of an investigational device, including malfunction, use errors or inadequacy in the information supplied by the manufacturer.|Art. 2(59)\nDistinguish \"post-market surveillance\" from \"market surveillance\".|Post-market surveillance: all activities carried out by manufacturers, with other economic operators, to set up and keep up to date a systematic procedure to proactively collect and review experience from devices they place on the market, to identify any need for corrective or preventive action. Market surveillance: activities and measures of competent authorities to check and ensure that devices comply with Union law and do not endanger health, safety or other public interests.|Art. 2(60)–(61)\nDistinguish \"recall\" from \"withdrawal\".|Recall: any measure aimed at achieving the return of a device that has already been made available to the end user. Withdrawal: any measure aimed at preventing a device in the supply chain from being further made available on the market.|Art. 2(62)–(63)\nDefine \"incident\".|Any malfunction or deterioration in the characteristics or performance of a device made available on the market, including use error due to ergonomic features, as well as any inadequacy in the information supplied by the manufacturer and any undesirable side-effect.|Art. 2(64)\nDefine \"serious incident\".|Any incident that directly or indirectly led, might have led or might lead to: (a) the death of a patient, user or other person; (b) the temporary or permanent serious deterioration of a patient's, user's or other person's state of health; or (c) a serious public health threat.|Art. 2(65)\nDefine \"serious public health threat\".|An event which could result in imminent risk of death, serious deterioration in a person's state of health, or serious illness, that may require prompt remedial action, and that may cause significant morbidity or mortality in humans, or that is unusual or unexpected for the given place and time.|Art. 2(66)\nDefine \"field safety corrective action\" (FSCA) and \"field safety notice\" (FSN).|FSCA: corrective action taken by a manufacturer for technical or medical reasons to prevent or reduce the risk of a serious incident in relation to a device made available on the market. FSN: a communication sent by a manufacturer to users or customers in relation to an FSCA.|Art. 2(68)–(69)\nDefine \"common specifications\" (CS).|A set of technical and/or clinical requirements, other than a standard, that provides a means of complying with the legal obligations applicable to a device, process or system.|Art. 2(71)\nName five product types excluded from the MDR's scope by Art. 1(6).|IVDs (Regulation 2017/746); medicinal products (Directive 2001/83/EC); advanced therapy medicinal products (Regulation 1394/2007); human blood, blood products, plasma or blood cells; cosmetic products (Regulation 1223/2009); viable transplants, tissues or cells of human or animal origin and their derivatives (non-viable or devitalised tissue derivatives are covered); other products containing viable biological material or organisms; food (Regulation 178/2002).|Art. 1(6)\nWhich products without an intended medical purpose fall under the MDR?|The groups of products listed in Annex XVI (e.g. coloured contact lenses, dermal fillers, liposuction equipment, lasers/IPL for skin treatment, brain stimulation equipment). They are covered once common specifications apply (Implementing Regulation (EU) 2022/2346, applicable from 22 June 2023).|Art. 1(2)\nHow is a device that incorporates a medicinal substance with an ancillary action regulated?|It is a device under the MDR (class III under Rule 14). The notified body must obtain a scientific opinion from a medicines authority (a national competent authority or the EMA) on the quality, safety and usefulness of the substance. If the substance's action is principal rather than ancillary, the product is a medicinal product under Directive 2001/83/EC.|Art. 1(8)\nHow does the MDR treat an integral drug-device combination regulated as a medicinal product (e.g. a prefilled syringe)?|The product is governed by the medicines legislation, but the device part must meet the relevant general safety and performance requirements of Annex I MDR. The marketing authorisation dossier must include the device's declaration of conformity or certificate, or a notified body opinion on the device part (Art. 117).|Art. 1(9), 117\nWho decides on the regulatory status of a borderline product?|The Commission, on its own initiative or at the duly substantiated request of a Member State, after consulting the MDCG, by means of implementing acts.|Art. 4\n#II|Chapter II|Making available, economic operators, CE marking|Art. 5–24\nWhat is the basic condition for placing a device on the market (Art. 5)?|A device may be placed on the market or put into service only if it complies with the MDR when duly supplied and properly installed, maintained and used in accordance with its intended purpose. It must meet the applicable general safety and performance requirements of Annex I, and demonstration of conformity includes a clinical evaluation (Art. 61).|Art. 5(1)–(3)\nName four conditions under which health institutions may manufacture and use devices in-house without full MDR compliance.|The devices meet Annex I GSPR and: are not transferred to another legal entity; are made and used under an appropriate QMS; the institution justifies that the target patient group's needs cannot be met (or not at the right level of performance) by an equivalent device on the market; information is provided to the competent authority on request; a public declaration is drawn up; documentation of the facility, process, design and performance is kept; clinical experience is reviewed with corrective action. Not allowed for industrial-scale manufacture.|Art. 5(5)\nDoes the MDR apply to devices sold online or to remote diagnostic services?|Yes. A device offered via information society services (e.g. online) to a person in the Union must comply with the MDR. So must a device not placed on the market but used in a commercial activity to provide a diagnostic or therapeutic service to a person in the Union. On request, the provider must give the competent authority a copy of the EU declaration of conformity.|Art. 6\nWhich misleading claims does Art. 7 prohibit?|In labelling, instructions for use, making available, putting into service and advertising, it is prohibited to mislead the user or patient about intended purpose, safety and performance by: ascribing functions or properties the device does not have; creating a false impression about treatment, diagnosis, functions or properties; failing to inform of a likely risk; or suggesting uses other than the intended purpose for which conformity was assessed.|Art. 7\nWhat is the legal effect of applying harmonised standards?|Devices in conformity with harmonised standards (or parts of them) whose references are published in the Official Journal are presumed to conform to the MDR requirements covered by those standards. This also applies to system or process requirements, such as the QMS, risk management, PMS, clinical investigations, clinical evaluation and PMCF.|Art. 8\nWhen may the Commission adopt common specifications, and how binding are they?|Where no harmonised standards exist, they are insufficient, or public health concerns must be addressed, the Commission may adopt CS by implementing acts after consulting the MDCG. Devices complying with CS are presumed to conform. Manufacturers must comply with CS unless they can duly justify solutions that give at least an equivalent level of safety and performance.|Art. 9\nName five general obligations of manufacturers under Art. 10.|Design and manufacture per the MDR; a risk management system; clinical evaluation including PMCF; technical documentation (Annexes II and III); conformity assessment, EU declaration of conformity and CE marking; UDI and registration obligations; keeping documentation available; a QMS; a PMS system; information supplied with the device in the required languages; corrective action; reporting serious incidents and FSCAs; cooperation with competent authorities; financial coverage for liability; a person responsible for regulatory compliance.|Art. 10\nHow long must manufacturers keep the technical documentation, EU declaration of conformity and certificates?|At least 10 years after the last device covered by the EU declaration of conformity has been placed on the market; at least 15 years for implantable devices.|Art. 10(8)\nName six aspects the manufacturer's QMS must address at least (Art. 10(9)).|(a) regulatory compliance strategy, incl. conformity assessment and management of modifications; (b) identification of applicable GSPR; (c) management responsibility; (d) resource management, incl. selection and control of suppliers and subcontractors; (e) risk management; (f) clinical evaluation incl. PMCF; (g) product realisation; (h) verification of UDI assignments; (i) the PMS system; (j) communication with authorities, notified bodies, operators and customers; (k) vigilance reporting of serious incidents and FSCAs; (l) CAPA and verification of effectiveness; (m) monitoring, measurement, data analysis and product improvement.|Art. 10(9)\nWhat does Art. 10(16) require regarding liability?|People may claim compensation for damage caused by a defective device under Union and national law. Manufacturers must have measures in place, proportionate to the risk class, type of device and enterprise size, to provide sufficient financial coverage for their potential liability under the Product Liability Directive 85/374/EEC.|Art. 10(16)\nWhat does Art. 10a require, and which regulation introduced it?|Introduced by Regulation (EU) 2024/1860 (applicable from 10 January 2025). A manufacturer that anticipates an interruption or discontinuation of supply of a device (other than custom-made), where this could foreseeably cause serious harm or a risk of serious harm to patients or public health, must inform the competent authority, and the economic operators, health institutions and healthcare professionals it directly supplies, at least 6 months in advance (except in exceptional circumstances).|Art. 10a\nWhen must a manufacturer appoint an authorised representative, and how many?|When the manufacturer is not established in a Member State. The device may only be placed on the Union market if the manufacturer designates a sole authorised representative.|Art. 11(1)\nName four tasks the authorised representative's mandate must include at least.|Verify that the EU declaration of conformity and technical documentation exist and that conformity assessment was done; keep copies available for authorities; comply with registration obligations and verify the manufacturer's; provide information and documentation to authorities on request; forward requests for samples or access; cooperate on preventive and corrective actions; immediately inform the manufacturer of complaints and reports; terminate the mandate if the manufacturer acts contrary to its obligations.|Art. 11(3)\nWhat is the liability of the authorised representative?|Where the manufacturer is not established in a Member State and has not complied with its obligations under Art. 10, the authorised representative is legally liable for defective devices on the same basis as, and jointly and severally with, the manufacturer.|Art. 11(5)\nWhat must an agreement on a change of authorised representative cover?|An agreement between the manufacturer, the incoming AR and (where practicable) the outgoing AR, covering at least: the end date of the old mandate and start date of the new one; until when the outgoing AR may be indicated in information supplied, incl. promotional material; transfer of documents, incl. confidentiality and property rights; the outgoing AR's duty after the mandate ends to forward complaints and reports.|Art. 12\nName five checks an importer must make before placing a device on the market.|CE marking and EU declaration of conformity present; manufacturer identified and an authorised representative designated; labelled per the MDR and accompanied by instructions for use; UDI assigned where applicable; registered in Eudamed. Importers must also add their own name and address on the device, packaging or accompanying document.|Art. 13(2)–(3)\nName four ongoing obligations of importers besides the pre-market checks.|Ensure storage and transport conditions do not affect compliance; keep a register of complaints, non-conforming devices, recalls and withdrawals; inform the manufacturer and AR of non-conformity (and the competent authority of serious risk or falsification); forward complaints; cooperate with authorities; keep a copy of the EU declaration of conformity and certificates for the retention period.|Art. 13\nWhat must a distributor verify before making a device available?|That the device has the CE marking and an EU declaration of conformity; is accompanied by the information supplied by the manufacturer; for imported devices, that the importer has complied with its labelling duties (Art. 13(3)); and that a UDI has been assigned where applicable. A representative sampling method may be used.|Art. 14(2)\nWhat must a distributor do if it considers a device non-compliant?|Not make it available until it complies; inform the manufacturer and, where applicable, the AR and importer; and, where the device presents a serious risk or is falsified, also inform the competent authority of its Member State.|Art. 14(2)\nWhat qualifications must the person responsible for regulatory compliance (PRRC) have?|Either (a) a diploma or equivalent qualification in law, medicine, pharmacy, engineering or another relevant scientific discipline plus at least one year of professional experience in regulatory affairs or QMS for medical devices; or (b) four years of professional experience in regulatory affairs or QMS for medical devices. For custom-made device manufacturers: at least two years of experience in a relevant field of manufacturing.|Art. 15(1)\nWhat is the PRRC responsible for?|Ensuring at least that: conformity of the devices is checked per the QMS before release; the technical documentation and EU declaration of conformity are drawn up and kept up to date; PMS obligations are met; vigilance reporting obligations (Art. 87–91) are fulfilled; and, for investigational devices, the statement in Annex XV Chapter II section 4.1 is issued.|Art. 15(3)\nMust a micro or small enterprise employ a PRRC?|No. Micro and small enterprises (Recommendation 2003/361/EC) do not need the PRRC within their organisation but must have one permanently and continuously at their disposal. Authorised representatives must also have a PRRC permanently and continuously at their disposal.|Art. 15(2), (6)\nHow does the MDR protect the PRRC's independence?|The PRRC must suffer no disadvantage within the manufacturer's organisation for properly fulfilling their duties, whether or not they are employees. Where responsibility is shared, each person's area of responsibility must be stipulated in writing.|Art. 15(4)–(5)\nIn which three cases does a distributor, importer or other person take on the manufacturer's obligations?|When it: (a) makes a device available under its own name, registered trade name or registered trade mark (unless an agreement keeps the manufacturer identified on the label and responsible); (b) changes the intended purpose of a device already placed on the market or put into service; (c) modifies such a device in a way that may affect compliance.|Art. 16(1)\nWhich two activities do not turn a distributor or importer into a manufacturer?|(a) Providing or translating the information supplied by the manufacturer, and further information needed to market the device in a Member State; (b) changing the outer packaging, incl. pack size, where repackaging is needed for the national market and done so the device's original condition cannot be affected (not if a sterile pack is opened, damaged or negatively affected).|Art. 16(2)\nWhat must a relabeller or repackager do under Art. 16(3)–(4)?|Indicate the activity and its name, registered trade name or trade mark and address on the device or packaging; have a QMS ensuring accurate, up-to-date translation and preservation of the device's original condition; and at least 28 days before making the device available, inform the manufacturer and the competent authority, provide a sample or mock-up on request, and provide a notified body certificate for its QMS.|Art. 16(3)–(4)\nUnder what conditions may single-use devices be reprocessed?|Only where national law permits it, and only per Art. 17. Whoever reprocesses a single-use device for further use in the Union is deemed its manufacturer and takes on the manufacturer's obligations. Member States may allow health institutions to reprocess in-house under common specifications (Implementing Regulation (EU) 2020/1207) or equivalent national rules. Only devices placed on the market under the MDR or the former directives may be reprocessed.|Art. 17\nWhat must a manufacturer of an implantable device provide to the patient?|An implant card (with the patient's identity) and information on: device identification (name, serial or lot number, UDI, model, manufacturer name, address and website); warnings, precautions or measures regarding interference with external influences, medical examinations or environmental conditions; expected lifetime and necessary follow-up; and other information for safe use, incl. the materials and substances patients may be exposed to.|Art. 18(1)\nWhich implants are exempt from the implant card obligation?|Sutures, staples, dental fillings, dental braces, tooth crowns, screws, wedges, plates, wires, pins, clips and connectors.|Art. 18(3)\nWhat is the EU declaration of conformity and what does it state?|A document in which the manufacturer states that the MDR requirements have been fulfilled for the device covered. It contains at least the Annex IV information, is continuously updated and is translated into the languages required by the Member States where the device is made available. One single declaration covers all applicable Union acts. By drawing it up, the manufacturer assumes responsibility for compliance.|Art. 19\nName four rules for affixing the CE marking.|Affixed visibly, legibly and indelibly to the device or its sterile packaging (or, if not possible, the packaging); also in the instructions for use and on sales packaging; affixed before the device is placed on the market; followed by the notified body's identification number where a notified body was involved; may be followed by a pictogram or mark indicating a special risk or use. Not for custom-made or investigational devices.|Art. 20\nWhich devices may be made available without CE marking under Art. 21?|Investigational devices supplied for clinical investigations meeting Art. 62–80 and 82, and custom-made devices meeting Art. 52(8) and Annex XIII. Non-conforming devices may be shown at trade fairs, exhibitions and demonstrations if a visible sign states they are for presentation only and cannot be made available until they comply.|Art. 21\nWhat must a person who combines CE-marked devices into a system or procedure pack declare?|A statement that: mutual compatibility was verified per the manufacturers' instructions and operations were carried out per those instructions; the system or pack was packaged with relevant user information, incl. the manufacturers' information; and the combining activity is subject to appropriate internal monitoring, verification and validation.|Art. 22(1)–(2)\nWhen is a system or procedure pack treated as a device in its own right?|When it incorporates devices without the CE marking, when the chosen combination is not compatible in view of the devices' original intended purposes, or when sterilisation was not done according to the manufacturer's instructions. It then needs its own conformity assessment under Art. 52.|Art. 22(4)\nWhat does Art. 23 require for spare parts and components?|Whoever makes available an item specifically intended to replace an identical or similar integral part of a defective or worn device, to maintain or re-establish its function without changing its performance, safety characteristics or intended purpose, must ensure the item does not adversely affect safety and performance and keep supporting evidence. An item that significantly changes performance, safety or intended purpose is itself a device.|Art. 23\nWhat does Art. 24 guarantee?|Free movement: Member States shall not refuse, prohibit or restrict the making available or putting into service in their territory of devices that comply with the MDR.|Art. 24\n#III|Chapter III|UDI, registration, SSCP and Eudamed|Art. 25–34\nWhich supply-chain parties must an economic operator be able to identify (Art. 25)?|For the retention period of Art. 10(8): (a) any economic operator to whom it has directly supplied a device; (b) any economic operator who has directly supplied it with a device; (c) any health institution or healthcare professional to whom it has directly supplied a device.|Art. 25(2)\nWhich medical device nomenclature does the Commission provide under the MDR?|The European Medical Device Nomenclature (EMDN), made available free of charge, based on the Italian CND classification.|Art. 26\nWhat are the two parts of a UDI?|The UDI-DI (device identifier), specific to a manufacturer and a device model, giving access to the Eudamed information; and the UDI-PI (production identifier), identifying the unit of production, such as serial number, lot number, software identification, manufacturing date and/or expiry date.|Art. 27(1); Annex VI Part C\nWhat is the Basic UDI-DI?|The primary identifier of a device model, assigned at the level of the device unit of use. It is the main key in the UDI database and is referenced in certificates, EU declarations of conformity, technical documentation and the SSCP. It does not appear on the label.|Art. 27(6), 29; Annex VI Part C\nWhich UDI issuing entities has the Commission designated?|GS1, HIBCC, ICCBBA and IFA GmbH (Implementing Decision (EU) 2019/939).|Art. 27(2)\nWhat is a UDI carrier and where must it be placed?|The means of conveying the UDI by automatic identification and data capture (AIDC: e.g. linear or 2D bar code, RFID) and its human readable interpretation (HRI). It goes on the label of the device and on all higher levels of packaging; shipping containers are excluded. Reusable devices need the UDI carrier on the device itself (direct marking).|Art. 27(4); Annex VI Part C\nWhich UDIs must economic operators and health institutions store?|Economic operators must store, preferably electronically, the UDIs of class III implantable devices they supplied or were supplied with (and other devices the Commission specifies). Health institutions must do the same for class III implantable devices; Member States encourage, and may require, this for other devices.|Art. 27(8)–(9)\nFrom when must the UDI carrier be on labels, per risk class?|Class III and implantable devices: 26 May 2021. Class IIa and IIb: 26 May 2023. Class I: 26 May 2025. Direct marking of reusable devices follows two years later for each class (2023, 2025, 2027).|Art. 123(3)(f)–(g)\nWhat must a manufacturer do before placing a device (other than custom-made) on the market under Art. 29?|Assign a Basic UDI-DI and provide it with the other core data elements (Annex VI Part B) to the UDI database. For devices needing a notified body, the Basic UDI-DI must be assigned before applying to the notified body.|Art. 29(1)–(2)\nWhat is the SRN and how is it obtained?|The Single Registration Number, issued by the competent authority after a manufacturer, authorised representative or importer registers in the Eudamed actor registration system. It is used in applications to notified bodies and in Eudamed for UDI obligations.|Art. 31\nWhich economic operators must register as actors in Eudamed? Do distributors?|Manufacturers, authorised representatives and importers. Distributors have no actor registration obligation under the MDR (national rules may differ).|Art. 30–31\nWhat registration deadlines apply to importers and to changes of actor data?|Within two weeks of placing a device on the market, importers verify that the manufacturer or AR registered the device information and add their own details. Economic operators update their data within one week of any change, and confirm its accuracy one year after submission and every second year thereafter.|Art. 30(3), 31(4)–(5)\nWhich devices need a summary of safety and clinical performance (SSCP)?|Implantable devices and class III devices, other than custom-made or investigational devices. The draft is submitted to and validated by the notified body, and the SSCP is made public through Eudamed.|Art. 32(1)\nName six items the SSCP must contain.|Device and manufacturer identification (Basic UDI-DI, SRN); intended purpose, indications, contraindications and target populations; device description incl. previous generations, variants, accessories and combined devices; possible diagnostic or therapeutic alternatives; harmonised standards and CS applied; summary of the clinical evaluation and PMCF; suggested user profile and training; residual risks, undesirable effects, warnings and precautions.|Art. 32(2)\nHow often must the SSCP be updated?|For class III and implantable devices, the PMCF evaluation report and, if indicated, the SSCP are updated at least annually with PMCF and PMS data.|Art. 61(11)\nWhich electronic systems make up Eudamed?|Registration of devices; the UDI database; registration of economic operators (actors); notified bodies and certificates; clinical investigations; vigilance and post-market surveillance; market surveillance.|Art. 33(2)\nHow did Regulation (EU) 2024/1860 change the roll-out of Eudamed?|It allows a gradual roll-out: each Eudamed module becomes mandatory on its own once the Commission has verified its functionality and published a notice in the Official Journal, with use becoming mandatory about six months after that notice, instead of waiting for the whole system to be functional.|Art. 34, 123(3)(d) as amended\n#IV|Chapter IV|Notified bodies|Art. 35–50\nWhat is the role of the authority responsible for notified bodies?|Each Member State that designates notified bodies appoints an authority responsible for setting up and carrying out the procedures to assess, designate and notify conformity assessment bodies and to monitor notified bodies, including their subcontractors and subsidiaries. It must be objective, impartial and free of conflicts of interest with the bodies it assesses.|Art. 35\nWhere are the requirements that notified bodies must meet laid down?|In Art. 36 and Annex VII: organisational and general requirements (legal status, independence and impartiality, confidentiality, liability insurance, financial resources, participation in coordination), quality management, resources (qualified personnel, subcontractors) and process requirements.|Art. 36\nDescribe the joint assessment in the designation of a notified body.|After the national authority reviews the application, the Commission (with the MDCG) appoints a joint assessment team, normally of three experts from the list of qualified experts, with at least one Commission representative coordinating. The team assesses the applicant and the national report; the MDCG gives a recommendation before designation and notification.|Art. 38–40\nHow is a notified body identified, and where are they listed?|The Commission assigns each notified body an identification number (one number even if notified under several Union acts) and publishes the list of notified bodies with their numbers and scopes in the NANDO database.|Art. 43\nHow often are notified bodies monitored and fully re-assessed?|The national authority monitors each notified body at least once a year (incl. on-site audits). A complete re-assessment by the national authority and a joint assessment team takes place three years after notification and every fourth year thereafter.|Art. 44(4), (10)\nWhat does the review under Art. 45 involve?|The national authority reviews an appropriate number of the notified body's assessments of manufacturers' technical documentation, in particular clinical evaluation documentation, to verify the notified body's conclusions. The Commission may also review such assessments.|Art. 45\nWhat happens to certificates when a notified body's designation is suspended or withdrawn?|The national authority restricts, suspends or withdraws the designation and informs the Commission and Member States. Unduly issued certificates are suspended or withdrawn. Other certificates may remain valid temporarily under conditions, e.g. after a restriction or withdrawal for nine months (extendable in steps of three months to at most twelve) if the competent authority confirms there is no safety issue and another notified body takes over responsibility.|Art. 46\nWhat is the coordination group of notified bodies?|The Commission ensures coordination and cooperation between notified bodies through a coordination group of notified bodies (NBCG-Med), in which notified bodies participate.|Art. 49\nWhat must notified bodies publish about their fees?|Lists of their standard fees for the conformity assessment activities they carry out.|Art. 50\nName two independence rules for notified bodies (Annex VII).|A notified body is a third-party body independent of the manufacturer and of other economic operators with an interest in the device. It, its top management and assessment staff must not design, manufacture, supply, install, buy, own or maintain the devices they assess, nor be the authorised representative of such parties, and must not provide consultancy to manufacturers on the devices or processes under assessment.|Annex VII 1.2\n#V|Chapter V|Classification and conformity assessment|Art. 51–60\nWhat are the MDR risk classes and what determines the class?|Class I, IIa, IIb and III, based on the intended purpose of the device and its inherent risks, using the classification rules of Annex VIII.|Art. 51(1)\nWho resolves a classification dispute between a manufacturer and its notified body?|The competent authority of the Member State where the manufacturer has its registered place of business (or its authorised representative, if the manufacturer is outside the EU). If the notified body is in another Member State, that authority first consults the authority that designated the notified body.|Art. 51(2)\nWhich conformity assessment routes are available for class III devices?|Annex IX (quality management system plus assessment of the technical documentation), or Annex X (type-examination) combined with Annex XI (production quality assurance, Part A, or product verification, Part B).|Art. 52(3)\nWhich conformity assessment routes are available for class IIb devices?|Annex IX Chapters I and III, with technical documentation assessment of at least one representative device per generic device group (for class IIb implantables, every device, except WET implants such as sutures, staples, screws, plates, wires, pins, clips and connectors); or Annex X type-examination combined with Annex XI.|Art. 52(4)\nWhich conformity assessment routes are available for class IIa devices?|Annex IX Chapters I and III, with technical documentation assessment of at least one representative device per category of devices; or technical documentation per Annexes II and III combined with Annex XI (Part A production quality assurance or Part B product verification).|Art. 52(6)\nHow do class I devices reach conformity, and when is a notified body still involved?|The manufacturer draws up the technical documentation (Annexes II and III) and issues the EU declaration of conformity (self-declaration). A notified body is needed only for sterile devices (Is), devices with a measuring function (Im) and reusable surgical instruments (Ir), limited to sterility, metrology or reuse aspects respectively, via Annex IX Chapters I and III or Annex XI Part A.|Art. 52(7)\nWhich procedure applies to custom-made devices?|The manufacturer follows Annex XIII and draws up the statement in its section 1 before placing the device on the market. Class III implantable custom-made devices also need the Annex IX Chapter I QMS procedure or Annex XI Part A.|Art. 52(8)\nWhich devices go through the clinical evaluation consultation procedure (CECP)?|Class III implantable devices and class IIb active devices intended to administer and/or remove a medicinal product (Rule 12). The notified body's clinical evaluation assessment report goes via the Commission to an expert panel, which decides whether to give a scientific opinion.|Art. 54(1)\nWhat are the three exemptions from the CECP?|(a) Renewal of a certificate issued under the MDR; (b) a modification of a device already marketed by the same manufacturer for the same intended purpose, where the manufacturer shows the changes do not adversely affect the benefit-risk ratio; (c) the clinical evaluation principles for that device type are set out in common specifications and the notified body confirms the clinical evaluation complies with them.|Art. 54(2)\nWhat are the expert panel's deadlines in the CECP?|The expert panel decides within 21 days whether to provide a scientific opinion, and if so, delivers it within 60 days of receiving the documentation. The notified body must give due consideration to the opinion and justify any divergence.|Art. 54; Annex IX 5.1\nWhat is the scrutiny mechanism of Art. 55?|Notified bodies notify the competent authorities, via Eudamed, of certificates granted after a CECP, with the SSCP, the notified body's assessment report, the instructions for use and the expert panel's opinion (and justification where views diverged). Authorities may then take further action.|Art. 55\nHow long are notified body certificates valid?|For the period indicated, at most five years. They may be extended for further periods of at most five years each, based on a re-assessment. Their content follows Annex XII.|Art. 56(2)\nWhat must an agreement on a voluntary change of notified body cover?|An agreement between the manufacturer, the incoming notified body and (where practicable) the outgoing one, covering: the date the outgoing body's certificates become invalid; until when its number may be shown in information supplied, incl. promotional material; transfer of documents; the date the incoming body takes over; and the last serial or lot number for which the outgoing body is responsible.|Art. 58\nWhen may a competent authority allow a device on the market without the required conformity assessment?|Under Art. 59, on a duly justified request, a competent authority may authorise a specific device i
