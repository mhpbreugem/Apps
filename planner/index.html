lo.forEach((o,d)=>{if(!o)return;const T=tot(o);if(T>LIM+.05)over++;pk=Math.max(pk,T);let y=40;const x=d*p,w=Math.max(1,p-1);if(o.t){const hh=o.t*k;y-=hh;s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" fill="#5B6472"/>'}Object.keys(AREA).forEach(a=>{const v=o.a[a];if(v>0){const hh=Math.min(v*k,Math.max(0,y-1));y-=hh;s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" fill="'+AREA[a][1]+'"/>'}});if(T>LIM+.05)s+='<rect x="'+x+'" y="'+Math.max(0,40-T*k)+'" width="'+w+'" height="'+Math.min(40,(T-LIM)*k)+'" fill="#FF4D4D"/>'});
h+=s+'</svg></div></div><div class="ov" style="left:'+LBL+'px;width:'+W+'px;bottom:'+CAPH+'px">'+ms.map(m=>'<div class="gl" style="left:'+m.a*p+'px"></div>').join('')+'<div class="today" style="left:'+TODAY*p+'px"></div></div><div class="tflag" style="left:'+(LBL+TODAY*p)+'px;top:'+(HDH-13)+'px">'+fd(TODAY)+'</div></div>';
const x=sc.scrollLeft,y=sc.scrollTop;sc.innerHTML=h;sc.scrollLeft=x;sc.scrollTop=y;stick();
$('sm').innerHTML='<b>'+n+'</b> projects · <b>'+behind+'</b> behind · <b>'+over+'</b> days over '+LIM+' h (peak '+pk.toFixed(1)+' h)';if(drOpen)renderDrawer()}
const fit=days=>{ppd=Math.max(2,(innerWidth-LBL-8)/days)};const goToday=()=>{sc.scrollLeft=Math.max(0,(TODAY-5)*ppd)};

let drOpen=null;const dr=$('dr');

let h='';g.stages.forEach((sn,i)=>{const s=stg(g,i);if(!s)return;h+='<div class="stg"><span>'+(i+1)+'. '+esc(sn)+'</span><span>'+Math.round(s.E)+' h</span></div>';s.ts.forEach(t=>{h+='<div class="tsk" style="--c:'+c+'"><div class="r"><div class="n">'+esc(t.name)+'</div><div style="color:'+(late(t)?'var(--red)':'var(--mu)')+';font-size:10px">'+(t.done?'done':Math.round(work(t)*100)+'%')+'</div></div><div class="d">'+fd(t.s)+' – '+fd(t.e)+' · '+Math.round(t.est)+' h'+(late(t)?' · late':'')+'</div>'+(g.auto?'':'<div class="seg">'+[0,.25,.5,.75,1].map(v=>'<button data-p="'+t.id+':'+v+'"'+(work(t)===v?' class="on"':'')+'>'+(v===1?'✓':v*100+'%')+'</button>').join('')+'</div><div class="seg sh"><button data-sh="'+t.id+':-7">◀ 1 week</button><button data-sh="'+t.id+':7">1 week ▶</button><button data-sh="'+t.id+':all">Shift rest ▶</button></div>')+'</div>'})});$('drb').innerHTML=h}

function setP(id,v){const[g,t]=tOf(id);if(!t)return;t.p=v;t.done=v===1}
function shift(id,d,rest){const[g,t]=tOf(id);if(!t)return;if(rest){g.tasks.forEach(x=>{if(x.st>=t.st&&x!==t&&x.s>=t.s){x.s+=d;x.e+=d}})}t.s+=d;t.e+=d}
$('drb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.p){const[id,v]=b.dataset.p.split(':');setP(id,+v)}else if(b.dataset.sh){const[id,v]=b.dataset.sh.split(':');v==='all'?shift(id,7,true):shift(id,+v)}save();renderGantt();refreshPlan()});

// ---------- feasibility
function capUntil(di){let c=0;for(let d=TODAY;d<=Math.min(di,DAYS-1);d++){const w=D(d).getDay();if(w>0&&w<6)c+=Math.max(0,LIM-(TEACH[fromIdx(d)]||0))}return c}
function feas(){const gs=S.goals.filter(g=>!g.auto).map(g=>({g,left:leftH(g),due:idx(g.due)})).sort((a,b)=>a.due-b.due);let cum=0;return gs.map(o=>{cum+=o.left;const cap=capUntil(o.due);return{id:o.g.id,name:o.g.name,due:fromIdx(o.due),cum:Math.round(cum),cap:Math.round(cap),ratio:cap?cum/cap:9}})}
// ---------- planner page
const $m=$('msgs');let hist=[],msgs=[],props=[],busy=false,pid=0;
const INSTR="You are a planning partner for an academic who teaches and chairs a department. You help the user plan projects that have stages and subtasks, with a hard limit of 6 working hours per day; teaching hours are fixed by the schedule. Rules: 1) Call get_plan before giving any advice about the plan and use only its numbers; never guess. 2) Use only the user's projects, dates and hours; do not invent projects, goals, deadlines or hours. If something is missing, ask one short question. 3) Be a sparring partner: test the plan against the user's own numbers (hours left versus hours available, deadlines, overload days), name conflicts, and give one clear recommendation. 4) To change the plan call propose; never say a change is done: the user approves each proposal. 5) Keep answers short: at most 120 words, plain text, bullets with '- ' when listing. 6) Answer in the language the user writes in.";
function planJSON(){return{today:fromIdx(TODAY),daily_limit_h:LIM,projects:S.goals.map(g=>({id:g.id,name:g.name,area:g.area,due:g.due,pct_done:Math.round(prog(g)*100),hours_left:Math.round(leftH(g)),hours_behind_plan:Math.round(lag(g)),teaching_fixed:!!g.auto,stages:g.stages.map((sn,i)=>{const s=stg(g,i);return s&&{name:sn,index:i,tasks:s.ts.map(t=>({id:t.id,name:t.name,est_h:Math.round(t.est),pct:Math.round(work(t)*100),start:fromIdx(t.s),end:fromIdx(t.e)}))}}).filter(Boolean)})),feasibility:feas(),days_over_limit:load().map((o,d)=>o&&tot(o)>LIM+.05?fromIdx(d):null).filter(Boolean).slice(0,40)}}
function describe(p){const[g,t]=p.task_id?tOf(p.task_id):[gOf(p.project_id)];if(p.kind==='shift')return'Shift "'+t.name+'" '+(p.days>0?'+':'')+p.days+' days'+(p.rest?' and all later subtasks':'');if(p.kind==='progress')return'Set "'+t.name+'" to '+p.pct+'%';if(p.kind==='add_task')return'Add subtask "'+p.name+'" ('+p.est+' h) to '+g.name;if(p.kind==='move_due')return'Move due date of '+g.name+' to '+p.due;if(p.kind==='remove_task')return'Remove subtask "'+t.name+'"';return p.kind}
function validate(p){if(['shift','progress','remove_task'].includes(p.kind)){if(!tOf(p.task_id)[1])throw new Error('unknown task_id '+p.task_id)}if(['add_task','move_due'].includes(p.kind)){if(!gOf(p.project_id))throw new Error('unknown project_id '+p.project_id)}if(p.kind==='shift'&&!Number.isFinite(+p.days))throw new Error('days must be a number');if(p.kind==='progress'&&!(p.pct>=0&&p.pct<=100))throw new Error('pct 0-100');if(p.kind==='add_task'&&!(p.name&&+p.est>0))throw new Error('name and est required');if(p.kind==='move_due'&&!/^\d{4}-\d\d-\d\d$/.test(p.due||''))throw new Error('due must be YYYY-MM-DD');if(!['shift','progress','add_task','move_due','remove_task'].includes(p.kind))throw new Error('unknown kind')}
function applyP(p){if(p.kind==='shift')shift(p.task_id,+p.days,!!p.rest);else if(p.kind==='progress')setP(p.task_id,p.pct/100);else if(p.kind==='remove_task'){const[g,t]=tOf(p.task_id);g.tasks=g.tasks.filter(x=>x!==t)}else if(p.kind==='move_due'){gOf(p.project_id).due=p.due}else if(p.kind==='add_task'){const g=gOf(p.project_id),st=Math.max(0,Math.min(g.stages.length-1,+p.stage_index||0)),s=stg(g,st),a=s?s.e:Math.max(TODAY,idx(g.start)),est=+p.est;g.tasks.push({id:g.id+'t'+Date.now()%1e6,name:String(p.name),st,est,done:false,p:0,s:a,e:a+Math.max(2,Math.round(est/3))});g.tasks.sort((x,y)=>x.st-y.st||x.s-y.s)}save()}
const md=t=>{const L=esc(t).split('\n');let h='',ul=false;L.forEach(l=>{const b=l.match(/^\s*[-•*]\s+(.*)/);const f=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');if(b){if(!ul){h+='<ul>';ul=true}h+='<li>'+f(b[1])+'</li>'}else{if(ul){h+='</ul>';ul=false}if(l.trim())h+='<p>'+f(l)+'</p>'}});return h+(ul?'</ul>':'')};
function renderChat(){if(!msgs.length)msgs=[{r:'a',t:"I only work with your plan and what you tell me. I won't invent goals; I'll test your numbers, ask when something is missing, and propose changes you approve on the right.\n\nWhat do you want to plan?"}];$m.innerHTML=msgs.map(m=>'<div class="msg '+(m.r==='u'?'u':'')+(m.pend?' pend':'')+'">'+md(m.t||'…')+'</div>').join('');$m.scrollTop=$m.scrollHeight}
function renderSide(){const F=feas();$('fd').textContent='6 h/day, teaching removed';$('feas').innerHTML=F.map(f=>{const r=Math.round(f.ratio*100),c=r>100?'var(--red)':r>85?'var(--amb)':'var(--grn)';return'<div class="fr"><span>'+esc(f.name)+'<br><span style="color:var(--mu);font-size:9.5px">to '+f.due.slice(8)+'/'+f.due.slice(5,7)+' · '+f.cum+' of '+f.cap+' h</span></span><span class="b"><i style="width:'+Math.min(100,r)+'%;background:'+c+'"></i></span><span style="color:'+c+'">'+r+'%</span></div>'}).join('')+'<div class="note" style="margin-top:6px">Cumulative: hours still needed by all projects due up to that date, against free hours up to it.</div>';
$('pc').textContent=props.filter(p=>!p.done).length?props.filter(p=>!p.done).length+' open':'';
$('props').innerHTML=props.length?props.map(p=>'<div class="pr'+(p.done?' done':'')+'"><div class="t">'+esc(describe(p))+'</div><div class="w">'+esc(p.reason||'')+'</div>'+(p.done?'<div class="note">'+(p.done==='ok'?'applied':'dismissed')+'</div>':'<div class="a"><button class="ok" data-ap="'+p.id+'">APPLY</button><button data-dm="'+p.id+'">DISMISS</button></div>')+'</div>').join(''):'<div class="note">Nothing proposed yet. The planner suggests changes here; you approve each one.</div>'}
function refreshPlan(){renderSide()}
$('props').addEventListener('click',e=>{const a=e.target.closest('[data-ap],[data-dm]');if(!a)return;const p=props.find(x=>x.id==(a.dataset.ap||a.dataset.dm));if(!p)return;if(a.dataset.ap){try{applyP(p);p.done='ok'}catch(err){p.done='no'}}else p.done='no';renderGantt();renderSide()});
async function ask(text){if(busy||!text.trim())return;const sample=window.__sample||(window.claude&&await window.claude.use('sample'));msgs.push({r:'u',t:text});const cur={r:'a',t:'',pend:true};msgs.push(cur);renderChat();
if(!sample){cur.pend=false;cur.t="The planner needs Claude. It works when this page is opened as a published Claude artifact; here it cannot call a model. The feasibility check on the right still works.";renderChat();return}
busy=true;hist.push({role:'user',content:text});const m2=hist.map((m,i)=>i===0?{role:'user',content:INSTR+'\n\nHis first message: '+m.content}:m);
const tools=[{name:'get_plan',description:'Returns the user's current plan: projects, stages, subtasks (id, hours, progress, dates), feasibility until each due date and days over the daily limit. Call before advising.',inputSchema:{type:'object',properties:{}},execute:async()=>planJSON()},
{name:'propose',description:'Propose one change to the plan for the user to approve. kind: shift (task_id, days, optional rest=true), progress (task_id, pct 0-100), add_task (project_id, stage_index, name, est hours), move_due (project_id, due YYYY-MM-DD), remove_task (task_id). Always give a short reason using the user's numbers.',inputSchema:{type:'object',properties:{kind:{type:'string'},task_id:{type:'string'},project_id:{type:'string'},days:{type:'number'},rest:{type:'boolean'},pct:{type:'number'},stage_index:{type:'number'},name:{type:'string'},est:{type:'number'},due:{type:'string'},reason:{type:'string'}},required:['kind','reason']},execute:async inp=>{validate(inp);props.push(Object.assign({id:++pid,done:null},inp));renderSide();return{ok:true,note:'shown to the user for approval'}}}];
try{const res=await sample(m2,{model:'claude-haiku-5-5',modelTier:'quick',cache:false,tools,onText:({text})=>{cur.t=text;cur.pend=false;renderChat()}});cur.t=res.text||cur.t;cur.pend=false;hist.push({role:'assistant',content:cur.t||'(no text)'})}
catch(err){cur.pend=false;cur.t=err&&err.code==='rate_limited'?'Rate limit reached. Try again in a minute.':err&&err.code==='not_granted'?'Permission to use Claude was not granted.':'The planner could not answer ('+(err&&err.message||'error')+').';hist.pop()}
busy=false;renderChat();renderSide()}
const ta=$('ta');const sendNow=()=>{const v=ta.value;ta.value='';ask(v)};$('send').onclick=sendNow;ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendNow()}});
$('chips').innerHTML=['Plan my week','What is most at risk?','Is my plan feasible?','Where should I cut?'].map(t=>'<button>'+t+'</button>').join('');$('chips').onclick=e=>{const b=e.target.closest('button');if(b)ask(b.textContent)};
(async()=>{try{const d=window.__dict||(window.claude&&await window.claude.use('dictation'));if(!d)return;const mic=$('mic');mic.style.display='';let on=false;d.onFinal(({text})=>{ta.value=(ta.value+' '+text).trim()+' '});d.onState(({state})=>{on=state==='listening';mic.classList.toggle('rec',on)});mic.onclick=()=>{on?d.stop():d.start().catch(()=>{})}}catch(e){}})();

addEventListener('resize',()=>{if($('p-gantt').classList.contains('on'))renderGantt()});
