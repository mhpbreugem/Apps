:root{/* blackboard green; every booked hour is a dot of four quarters; a square is a gate, a stage still to plan */
--bg:#0F1E19;--panel:#1A3229;--well:#091410;--raise:#152A22;--ink:#F2F1E4;--mute:#95A89E;--acc:#F4D776;--acc-ink:#1B1905;--warn:#FF917E;--good:#8FE0A2;--amb:#F5A65B;--on:#0F1E19;--tch:#3B5249;--tch2:#2B4038;
--r:4px;--rk:4px;--rp:5px;--rm:6px;--rt:2px;--rd:50%;--fs:16.5px;--f:"Sofia Sans Condensed","Arial Narrow",system-ui,sans-serif;--fd:var(--f);--fdw:800;--fdl:0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 var(--fs,15px)/1.3 var(--f);color-scheme:dark;overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit;border:0;background:none;outline:none}
input,textarea,select{font-size:16px}
button{cursor:pointer;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
small{font-size:.82em;color:var(--mute);font-weight:500}
h2,h3{font-family:var(--fd);font-weight:var(--fdw);letter-spacing:var(--fdl)}h3{font-size:1.05em;margin:10px 0 2px}
.sp{flex:1}.note{color:var(--mute);font-size:.86em}.note.in{padding:6px 10px}
.bad{color:var(--warn)}.amb{color:var(--amb)}.good{color:var(--good)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{min-height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px}
.nav{display:flex;gap:2px;background:var(--well);border-radius:var(--r);padding:3px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav button{height:34px;padding:0 14px;border-radius:var(--r);font-weight:600;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.nav button.on{background:var(--panel);color:var(--ink)}
.nav em i{font-style:normal}.nav em{font-style:normal;font-size:.76em;background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:1px 7px;font-weight:700}
#sm{color:var(--mute);font-size:.88em;white-space:nowrap}
.btn{height:34px;padding:0 13px;border-radius:var(--r);background:var(--panel);font-weight:600;white-space:nowrap;flex:none}
.btn.pri{background:var(--acc);color:var(--acc-ink)}.btn.wide{width:100%}
#fsb{width:36px;padding:0;display:grid;place-items:center;color:var(--mute)}#fsb.on{color:var(--acc)}
.grp{display:flex;gap:2px;background:var(--well);border-radius:var(--r);padding:3px;flex:none}
.grp button{height:28px;min-width:30px;padding:0 10px;border-radius:var(--r);font-weight:600;color:var(--mute);white-space:nowrap}.grp button.on{background:var(--panel);color:var(--ink)}
.page{flex:1;min-height:0;display:none;flex-direction:column}.page.on{display:flex}
/* fortnight board */
.fn{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;gap:6px;padding:2px 12px 8px}
.bh{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}.bh .rng{font:var(--fdw) 1.12em var(--fd);letter-spacing:var(--fdl);white-space:nowrap}.bh .st{color:var(--mute);font-size:.88em}
.gb{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:var(--rp);padding:5px 5px 5px 12px;font-size:.92em;box-shadow:inset 0 0 0 2px var(--acc)}.gb span{flex:1}
.bb{flex:1;min-height:0;display:flex;gap:8px}
.pal{width:186px;flex:none;overflow:auto;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
.chp{flex:none;text-align:left;padding:6px 10px 6px 13px;border-radius:var(--rk);background:var(--panel);box-shadow:inset 5px 0 0 var(--c);display:flex;flex-direction:column;gap:1px}
.chp b{font-weight:600;font-size:.9em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chp.on{background:var(--c);color:var(--on)}.chp.on small{color:var(--on);opacity:.8}.chp.gt{opacity:.6}
.chp.all{box-shadow:none;background:none;color:var(--mute);font-weight:600;font-size:.86em;padding:8px 12px}
.grid{flex:1;min-width:0;min-height:0;display:flex;gap:5px}
.dy{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--well);border-radius:var(--rp);padding:5px 0 5px}
.dy.w2{margin-left:8px}.dy.td{background:var(--panel)}.dy.ps{opacity:.45}
.dh{text-align:center;line-height:1.1;flex:none}.dh b{display:block;font:var(--fdw) .95em var(--fd);white-space:nowrap}.dy.td .dh b{color:var(--acc)}.dh small{font-size:.72em}
.ds{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
.sl{width:var(--cs);height:var(--cs);border-radius:var(--rd);display:grid;place-items:center;font-weight:700;font-size:calc(var(--cs)*.34);flex:none;letter-spacing:-.02em;font-style:normal}
.k-f{background:var(--panel)}.dy.td .k-f{background:var(--well)}.k-f.buf{background:none;box-shadow:inset 0 0 0 2px var(--panel)}.dy.td .k-f.buf{box-shadow:inset 0 0 0 2px var(--well)}
.k-T{background:repeating-linear-gradient(135deg,var(--tch) 0 5px,var(--tch2) 5px 10px);color:var(--mute)}
.k-t{background:var(--c);color:var(--on)}.k-t.pl{background:none;box-shadow:inset 0 0 0 calc(var(--cs)*.17) var(--c);color:var(--c)}
.k-t.dn{opacity:.4}.k-t.hl{outline:3px solid var(--acc);outline-offset:1px}
.k-g{border:2px dashed var(--c);color:var(--c)}
.hint{color:var(--mute);font-size:.8em;text-align:center}.fn.ld .hint{display:none}
.fn.pt .bb,.fn.top .bb{flex-direction:column}.fn.pt .pal,.fn.top .pal{width:auto;flex-direction:row;overflow-x:auto}.fn.pt .chp,.fn.top .chp{width:150px}.fn.pt .chp.all,.fn.top .chp.all{width:auto;white-space:nowrap}
.fn.top .chp b{-webkit-line-clamp:1}
.fn.pt .grid{flex-direction:column;gap:4px}.fn.pt .dy{flex-direction:row;padding:0 10px;gap:8px}.fn.pt .dy.w2{margin:6px 0 0}.fn.pt .dh{width:46px;text-align:left}.fn.pt .ds{flex-direction:row}
/* tree */
.tree{overflow:auto;padding:2px 12px 40px;scrollbar-width:none;min-height:0}
.row{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 10px;border-radius:var(--rk);cursor:pointer}
.row .nm{flex:1;min-width:0}.row .mt{color:var(--mute);font-size:.84em;white-space:nowrap}.row .mt em{font-style:normal;margin-left:8px}
.row .hr{min-width:66px;text-align:right;font-size:.86em;color:var(--mute);white-space:nowrap;flex:none}.row .no{width:28px;color:var(--mute);font-size:.84em;flex:none}
.car{width:0;height:0;border:5px solid transparent;border-left:7px solid var(--mute);border-right:0;flex:none;transition:transform .15s}.row.op>.car{transform:rotate(90deg)}
.rg{width:20px;height:20px;flex:none}
